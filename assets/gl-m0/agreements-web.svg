<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="450" fill="#FFFFFF"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#17202A">The agreements that bind a launch</text>
<text x="40" y="66" font-size="14" fill="#5B6672">Each line is a written agreement. Together they decide who does what.</text>
<g font-size="15" font-weight="700" fill="#17202A" text-anchor="middle">
<rect x="310" y="185" width="180" height="70" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="3"/><text x="400" y="226">MAH</text>
<rect x="60" y="100" width="190" height="60" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="155" y="136">Dossier owner</text>
<rect x="540" y="96" width="220" height="68" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="650" y="126">Manufacturer</text><text x="650" y="148" font-weight="400" fill="#5B6672">and EU importer</text>
<rect x="60" y="300" width="190" height="60" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="155" y="336">PV service provider</text>
<rect x="560" y="300" width="190" height="60" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="655" y="336">Distributor</text>
</g>
<g stroke="#17202A" stroke-width="2.5"><line x1="250" y1="140" x2="320" y2="190"/><line x1="560" y1="164" x2="480" y2="190"/><line x1="250" y1="320" x2="320" y2="250"/><line x1="560" y1="320" x2="480" y2="250"/></g>
<g font-size="14" fill="#17202A">
<rect x="90" y="182" width="170" height="26" rx="13" fill="#FFFFFF" stroke="#0089BF"/><text x="175" y="200" text-anchor="middle">Licence &amp; supply</text>
<rect x="560" y="186" width="160" height="26" rx="13" fill="#FFFFFF" stroke="#E8B400" stroke-width="2"/><text x="640" y="204" text-anchor="middle">Quality agreement</text>
<rect x="90" y="236" width="170" height="26" rx="13" fill="#FFFFFF" stroke="#C2185B"/><text x="175" y="254" text-anchor="middle">PV agreement</text>
<rect x="560" y="236" width="160" height="26" rx="13" fill="#FFFFFF" stroke="#0089BF"/><text x="640" y="254" text-anchor="middle">Distribution</text>
</g>
<text x="40" y="410" font-size="13" fill="#5B6672">A quality agreement is required by EU GMP for any outsourced activity (EudraLex Vol. 4, Chapter 7).</text>
<text x="40" y="430" font-size="13" fill="#5B6672">The other agreements are standard industry practice; their exact names vary.</text>
</svg>
