<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="470" fill="#FFFFFF"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#17202A">A launch on one page</text>
<text x="40" y="66" font-size="14" fill="#5B6672">Illustrative sequence. Bar lengths aren't to scale; real durations vary by product and procedure.</text>
<g font-size="14" fill="#17202A">
<text x="40" y="112">Deal and dossier transfer</text><rect x="300" y="96" width="70" height="22" rx="4" fill="#0089BF"/>
<text x="40" y="148">Gap analysis</text><rect x="350" y="132" width="60" height="22" rx="4" fill="#0089BF"/>
<text x="40" y="184">Submission + DCP</text><rect x="410" y="168" width="150" height="22" rx="4" fill="#C2185B"/><text x="566" y="184" font-size="12" fill="#5B6672">~210 days + clock-stops</text>
<text x="40" y="220">National phase</text><rect x="560" y="204" width="60" height="22" rx="4" fill="#C2185B"/>
<text x="40" y="256">Marketing authorisation</text><path d="M626 245 l9 -9 l9 9 l-9 9z" fill="#17202A"/>
<text x="40" y="292">Pricing, reimbursement, tenders</text><rect x="640" y="276" width="70" height="22" rx="4" fill="#7C8792"/>
<text x="40" y="328">Artworks + serialisation</text><rect x="520" y="312" width="150" height="22" rx="4" fill="#E8B400"/>
<text x="40" y="364">Launch batches + QP release</text><rect x="600" y="348" width="110" height="22" rx="4" fill="#E8B400"/>
<text x="40" y="400">Launch</text><path d="M716 389 l9 -9 l9 9 l-9 9z" fill="#C2185B"/>
</g>
<line x1="300" y1="420" x2="760" y2="420" stroke="#17202A" stroke-width="2"/><text x="300" y="440" font-size="13" fill="#5B6672">time →</text>
<g font-size="12" fill="#5B6672"><rect x="420" y="432" width="12" height="12" fill="#0089BF"/><text x="437" y="443">deal/dossier</text><rect x="520" y="432" width="12" height="12" fill="#C2185B"/><text x="537" y="443">regulatory</text><rect x="610" y="432" width="12" height="12" fill="#E8B400"/><text x="627" y="443">supply</text><rect x="680" y="432" width="12" height="12" fill="#7C8792"/><text x="697" y="443">market access</text></g>
</svg>
