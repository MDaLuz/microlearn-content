<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="450" fill="#FFFFFF"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#17202A">What happens to price when exclusivity ends</text>
<text x="40" y="68" font-size="14" fill="#5B6672">Average price vs the originator's price before loss of exclusivity (= 100).</text><text x="40" y="88" font-size="14" fill="#5B6672">Curve shapes are illustrative; the two averages are from the EC sector inquiry (2009).</text>
<line x1="90" y1="380" x2="760" y2="380" stroke="#17202A" stroke-width="2"/>
<line x1="90" y1="110" x2="90" y2="380" stroke="#17202A" stroke-width="2"/>
<g font-size="13" fill="#5B6672"><text x="58" y="125">100</text><text x="62" y="232">75</text><text x="62" y="286">60</text><text x="70" y="384">0</text></g>
<line x1="90" y1="120" x2="330" y2="120" stroke="#0089BF" stroke-width="4"/>
<line x1="330" y1="120" x2="330" y2="380" stroke="#7C8792" stroke-width="2" stroke-dasharray="6 6"/>
<text x="338" y="178" font-size="14" font-weight="700" fill="#17202A">Loss of exclusivity</text>
<text x="338" y="196" font-size="13" fill="#5B6672">first generics enter</text>
<path d="M330 120 C 420 135, 560 150, 740 160" fill="none" stroke="#0089BF" stroke-width="4" stroke-dasharray="2 0"/>
<text x="600" y="150" font-size="14" fill="#0089BF" font-weight="700">Originator</text>
<path d="M330 228 C 420 250, 520 272, 560 282 S 700 292, 740 296" fill="none" stroke="#C2185B" stroke-width="4"/>
<circle cx="330" cy="228" r="7" fill="#C2185B"/>
<circle cx="560" cy="282" r="7" fill="#C2185B"/>
<text x="318" y="250" font-size="14" fill="#C2185B" font-weight="700" text-anchor="end">Entry: ~25% below</text>
<text x="575" y="276" font-size="14" fill="#C2185B" font-weight="700">After 2 years: ~40% below</text>
<text x="600" y="325" font-size="14" fill="#C2185B" font-weight="700">Generic price</text>
<text x="90" y="410" font-size="13" fill="#5B6672">Time →</text>
<text x="40" y="436" font-size="12" fill="#5B6672">Source: European Commission, Pharmaceutical Sector Inquiry (2009), sample of medicines facing generic entry 2000–2007.</text>
</svg>
