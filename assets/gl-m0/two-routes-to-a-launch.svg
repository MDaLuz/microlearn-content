<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="380" fill="#FFFFFF"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#17202A">Two routes to a launch</text>
<text x="40" y="66" font-size="14" fill="#5B6672">Steps only, not to scale. In-licensing skips development, so it's usually faster.</text>
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs>
<text x="40" y="118" font-size="16" font-weight="700" fill="#0089BF">In-licensing</text>
<g font-size="13" text-anchor="middle" fill="#17202A">
<rect x="40" y="132" width="130" height="50" rx="8" fill="#EAF6FB" stroke="#0089BF"/><text x="105" y="162">Deal signed</text>
<rect x="200" y="132" width="130" height="50" rx="8" fill="#EAF6FB" stroke="#0089BF"/><text x="265" y="154">Dossier transfer</text><text x="265" y="172">+ gap analysis</text>
<rect x="360" y="132" width="130" height="50" rx="8" fill="#EAF6FB" stroke="#0089BF"/><text x="425" y="162">Submission</text>
<rect x="520" y="132" width="110" height="50" rx="8" fill="#EAF6FB" stroke="#0089BF"/><text x="575" y="162">Approval</text>
<rect x="660" y="132" width="100" height="50" rx="8" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="710" y="162" font-weight="700">Launch</text>
</g>
<g stroke="#17202A" stroke-width="2" marker-end="url(#b)"><line x1="170" y1="157" x2="197" y2="157"/><line x1="330" y1="157" x2="357" y2="157"/><line x1="490" y1="157" x2="517" y2="157"/><line x1="630" y1="157" x2="657" y2="157"/></g>
<text x="40" y="238" font-size="16" font-weight="700" fill="#C2185B">Own development</text>
<g font-size="13" text-anchor="middle" fill="#17202A">
<rect x="40" y="252" width="110" height="50" rx="8" fill="#F5F7F9" stroke="#7C8792"/><text x="95" y="282">Formulation</text>
<rect x="165" y="252" width="110" height="50" rx="8" fill="#F5F7F9" stroke="#7C8792"/><text x="220" y="274">Bioequivalence</text><text x="220" y="292">study</text>
<rect x="290" y="252" width="100" height="50" rx="8" fill="#F5F7F9" stroke="#7C8792"/><text x="340" y="282">Dossier</text>
<rect x="405" y="252" width="100" height="50" rx="8" fill="#EAF6FB" stroke="#0089BF"/><text x="455" y="282">Submission</text>
<rect x="520" y="252" width="110" height="50" rx="8" fill="#EAF6FB" stroke="#0089BF"/><text x="575" y="282">Approval</text>
<rect x="660" y="252" width="100" height="50" rx="8" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="710" y="282" font-weight="700">Launch</text>
</g>
<g stroke="#17202A" stroke-width="2" marker-end="url(#b)"><line x1="150" y1="277" x2="162" y2="277"/><line x1="275" y1="277" x2="287" y2="277"/><line x1="390" y1="277" x2="402" y2="277"/><line x1="505" y1="277" x2="517" y2="277"/><line x1="630" y1="277" x2="657" y2="277"/></g>
<text x="40" y="350" font-size="13" fill="#5B6672">Grey steps happen only in own development. Blue steps are shared by both routes.</text>
</svg>
