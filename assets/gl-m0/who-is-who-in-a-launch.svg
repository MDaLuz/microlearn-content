<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="470" fill="#FFFFFF"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#17202A">Who's who in a generic launch</text>
<text x="40" y="66" font-size="14" fill="#5B6672">Solid arrows: the product moves. Dashed lines: legal responsibility.</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs>
<g font-size="14">
<rect x="30" y="110" width="160" height="70" rx="8" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/>
<text x="110" y="140" text-anchor="middle" font-weight="700" fill="#17202A">Dossier owner</text><text x="110" y="160" text-anchor="middle" fill="#5B6672">licensor, developer</text>
<rect x="230" y="110" width="160" height="70" rx="8" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/>
<text x="310" y="140" text-anchor="middle" font-weight="700" fill="#17202A">Manufacturer</text><text x="310" y="160" text-anchor="middle" fill="#5B6672">e.g. site in India</text>
<rect x="430" y="110" width="160" height="70" rx="8" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/>
<text x="510" y="140" text-anchor="middle" font-weight="700" fill="#17202A">EU importer + QP</text><text x="510" y="160" text-anchor="middle" fill="#5B6672">tests, certifies batch</text>
<rect x="630" y="110" width="140" height="70" rx="8" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/>
<text x="700" y="140" text-anchor="middle" font-weight="700" fill="#17202A">Distributor</text><text x="700" y="160" text-anchor="middle" fill="#5B6672">wholesaler</text>
<rect x="630" y="230" width="140" height="60" rx="8" fill="#F5F7F9" stroke="#7C8792" stroke-width="2"/>
<text x="700" y="256" text-anchor="middle" font-weight="700" fill="#17202A">Pharmacy</text><text x="700" y="276" text-anchor="middle" fill="#5B6672">or hospital</text>
<rect x="250" y="300" width="300" height="80" rx="8" fill="#FBE8EF" stroke="#C2185B" stroke-width="3"/>
<text x="400" y="333" text-anchor="middle" font-size="17" font-weight="700" fill="#17202A">MAH</text><text x="400" y="356" text-anchor="middle" fill="#5B6672">marketing authorisation holder</text>
<rect x="40" y="320" width="170" height="60" rx="8" fill="#FFFFFF" stroke="#C2185B" stroke-width="2"/>
<text x="125" y="347" text-anchor="middle" font-weight="700" fill="#17202A">Regulatory affairs</text><text x="125" y="366" text-anchor="middle" fill="#5B6672">submissions, variations</text>
<rect x="590" y="330" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#C2185B" stroke-width="2"/>
<text x="680" y="357" text-anchor="middle" font-weight="700" fill="#17202A">QPPV</text><text x="680" y="376" text-anchor="middle" fill="#5B6672">pharmacovigilance</text>
</g>
<g stroke="#17202A" stroke-width="2.5" fill="none" marker-end="url(#a)">
<path d="M190 145H226"/><path d="M390 145H426"/><path d="M590 145H626"/><path d="M700 180V226"/></g>
<text x="208" y="104" font-size="12" fill="#5B6672" text-anchor="middle">dossier</text>
<g stroke="#C2185B" stroke-width="2" stroke-dasharray="6 5" fill="none">
<path d="M330 300L310 182"/><path d="M470 300L510 182"/><path d="M250 345H210"/><path d="M550 355H590"/></g>
<text x="40" y="430" font-size="13" fill="#5B6672">One company can play several roles. The MAH must be established in the EU/EEA.</text><text x="40" y="450" font-size="13" fill="#5B6672">The QP and the QPPV are named, qualified people.</text>
</svg>
