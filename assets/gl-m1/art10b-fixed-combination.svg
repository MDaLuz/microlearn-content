<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="460" fill="#FFFFFF"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#17202A">Art. 10b: two known substances, one new product</text>
<text x="40" y="66" font-size="14" fill="#5B6672">Each substance is already authorised, but not yet in this combination.</text>
<g text-anchor="middle" font-size="15">
<circle cx="110" cy="150" r="58" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="110" y="146" font-weight="700" font-size="14" fill="#17202A">Substance A</text><text x="110" y="166" font-size="12" fill="#5B6672">known</text>
<circle cx="110" cy="310" r="58" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="110" y="306" font-weight="700" font-size="14" fill="#17202A">Substance B</text><text x="110" y="326" font-size="12" fill="#5B6672">known</text>
<rect x="260" y="190" width="170" height="80" rx="40" fill="#FBE8EF" stroke="#C2185B" stroke-width="3"/><text x="345" y="226" font-weight="700" fill="#17202A">A + B</text><text x="345" y="248" font-size="12" fill="#5B6672">one tablet</text>
</g>
<g stroke="#17202A" stroke-width="2"><line x1="165" y1="170" x2="262" y2="220"/><line x1="165" y1="290" x2="262" y2="242"/></g>
<text x="480" y="110" font-size="16" font-weight="700" fill="#17202A">Data the application needs</text>
<g font-size="14" fill="#17202A">
<text x="480" y="142">✓ Full quality data for the new product</text>
<text x="480" y="170">✓ New studies on the combination</text>
<text x="500" y="190" font-size="12" fill="#5B6672">(non-clinical and/or clinical, as relevant)</text>
<text x="480" y="218">✓ Often: bioequivalence of A+B vs</text>
<text x="500" y="238" font-size="12" fill="#5B6672">A and B taken as separate products</text>
<text x="480" y="266" font-size="14" fill="#5B6672">✗ No need to re-prove each single</text>
<text x="500" y="286" font-size="14" fill="#5B6672">substance on its own</text>
</g>
<text x="40" y="398" font-size="13" fill="#5B6672">If an authorised A+B product already exists and its protection has expired,</text>
<text x="40" y="416" font-size="13" fill="#5B6672">a generic of it (Art. 10(1)) may be possible instead.</text><text x="40" y="440" font-size="13" fill="#5B6672">EMA guideline on fixed combination medicinal products (EMA/CHMP/158268/2017).</text>
</svg>
