<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="460" fill="#FFFFFF"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#17202A">Bioequivalence in one picture</text>
<text x="40" y="66" font-size="14" fill="#5B6672">Blood level over time after one dose (illustrative curves).</text>
<line x1="80" y1="370" x2="520" y2="370" stroke="#17202A" stroke-width="2"/><line x1="80" y1="90" x2="80" y2="370" stroke="#17202A" stroke-width="2"/>
<text x="24" y="230" font-size="13" fill="#5B6672" transform="rotate(-90 24 230)">blood level</text><text x="460" y="392" font-size="13" fill="#5B6672">time →</text>
<path d="M80 370 C 120 150, 150 120, 180 125 S 300 260, 510 350" fill="#EAF6FB" stroke="none" opacity="0.8"/>
<path d="M80 370 C 120 150, 150 120, 180 125 S 300 260, 510 350" fill="none" stroke="#0089BF" stroke-width="4"/>
<path d="M80 370 C 122 160, 155 130, 188 133 S 305 265, 510 352" fill="none" stroke="#C2185B" stroke-width="4" stroke-dasharray="8 6"/>
<line x1="180" y1="125" x2="180" y2="370" stroke="#7C8792" stroke-dasharray="4 4"/>
<text x="188" y="112" font-size="14" font-weight="700" fill="#17202A">Cmax (peak)</text>
<text x="200" y="300" font-size="14" font-weight="700" fill="#0089BF">AUC = shaded area</text>
<text x="200" y="318" font-size="13" fill="#5B6672">(total exposure)</text>
<g font-size="14"><line x1="300" y1="160" x2="330" y2="160" stroke="#0089BF" stroke-width="4"/><text x="338" y="165" fill="#17202A">Reference</text>
<line x1="300" y1="186" x2="330" y2="186" stroke="#C2185B" stroke-width="4" stroke-dasharray="8 6"/><text x="338" y="191" fill="#17202A">Generic</text></g>
<text x="560" y="110" font-size="15" font-weight="700" fill="#17202A">The usual EU test</text>
<line x1="580" y1="140" x2="580" y2="380" stroke="#17202A"/>
<rect x="560" y="200" width="200" height="120" fill="#EAF6FB"/>
<line x1="560" y1="200" x2="760" y2="200" stroke="#0089BF" stroke-width="2"/><line x1="560" y1="320" x2="760" y2="320" stroke="#0089BF" stroke-width="2"/>
<text x="700" y="196" font-size="13" fill="#0089BF" text-anchor="end">125%</text><text x="700" y="336" font-size="13" fill="#0089BF" text-anchor="end">80%</text>
<line x1="560" y1="268" x2="760" y2="268" stroke="#7C8792" stroke-dasharray="4 4"/><text x="756" y="262" font-size="12" fill="#5B6672" text-anchor="end">100%</text>
<line x1="620" y1="232" x2="620" y2="300" stroke="#C2185B" stroke-width="4"/><circle cx="620" cy="262" r="6" fill="#C2185B"/>
<text x="640" y="246" font-size="12" fill="#17202A">AUC ratio,</text><text x="640" y="262" font-size="12" fill="#17202A">90% CI</text>
<text x="545" y="400" font-size="12" fill="#5B6672">Pass: the 90% CI of the</text>
<text x="545" y="416" font-size="12" fill="#5B6672">generic/reference ratio lies</text>
<text x="545" y="432" font-size="12" fill="#5B6672">within 80–125% (AUC and Cmax).</text>
</svg>
