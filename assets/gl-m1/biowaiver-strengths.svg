<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="420" fill="#FFFFFF"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#17202A">One study, several strengths</text>
<text x="40" y="66" font-size="14" fill="#5B6672">An additional-strength biowaiver, under the EMA bioequivalence guideline.</text>
<g font-size="15" fill="#17202A" text-anchor="middle">
<rect x="60" y="110" width="170" height="80" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="3"/><text x="145" y="145" font-weight="700">40 mg</text><text x="145" y="168" font-size="13" fill="#5B6672">BE study done</text>
<rect x="320" y="90" width="150" height="56" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="395" y="124">20 mg</text>
<rect x="320" y="160" width="150" height="56" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="395" y="194">10 mg</text>
<rect x="320" y="230" width="150" height="56" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="395" y="264">5 mg</text>
</g>
<g stroke="#17202A" stroke-width="2"><line x1="230" y1="150" x2="320" y2="118"/><line x1="230" y1="150" x2="320" y2="188"/><line x1="230" y1="150" x2="320" y2="258"/></g>
<text x="250" y="110" font-size="13" fill="#5B6672">waiver</text>
<text x="520" y="110" font-size="16" font-weight="700" fill="#17202A">Conditions, all required</text>
<g font-size="14" fill="#17202A"><text x="520" y="142">✓ Same manufacturing process</text><text x="520" y="170">✓ Same qualitative composition</text><text x="520" y="198">✓ Proportional composition</text><text x="520" y="226">✓ Similar dissolution profiles</text><text x="520" y="254">✓ Linear pharmacokinetics</text></g>
<text x="40" y="330" font-size="13" fill="#5B6672">Strengths are illustrative. Which strength must be studied depends on the substance;</text><text x="40" y="348" font-size="13" fill="#5B6672">RA decides this using the guideline.</text>
<text x="40" y="374" font-size="13" fill="#5B6672">Separately, a BCS-based biowaiver (ICH M9) can replace a BE study for some highly soluble substances.</text>
</svg>
