<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="440" fill="#FFFFFF"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#17202A">When can a generic file, and when can it launch?</text>
<text x="40" y="66" font-size="14" fill="#5B6672">Years from the reference product's first EU authorisation. Patents and SPCs are separate (Module 3).</text>
<g font-size="12" fill="#5B6672"><text x="90" y="100">0</text><text x="378" y="100">8</text><text x="450" y="100">10</text><text x="486" y="100">11</text></g>
<g stroke="#D9DEE3"><line x1="94" y1="106" x2="94" y2="330"/><line x1="382" y1="106" x2="382" y2="330"/><line x1="454" y1="106" x2="454" y2="330"/><line x1="490" y1="106" x2="490" y2="330"/></g>
<text x="40" y="132" font-size="15" font-weight="700" fill="#17202A">Current rules: 8 + 2 (+1)</text>
<rect x="94" y="144" width="288" height="34" fill="#0089BF"/><text x="238" y="166" font-size="13" fill="#FFFFFF" text-anchor="middle">Data protection: no generic filing</text>
<rect x="382" y="144" width="72" height="34" fill="#C2185B"/><text x="418" y="166" font-size="12" fill="#FFFFFF" text-anchor="middle">Market prot.</text>
<rect x="454" y="144" width="36" height="34" fill="#C2185B" opacity="0.45"/><text x="472" y="166" font-size="12" fill="#17202A" text-anchor="middle">+1</text>
<text x="500" y="158" font-size="12" fill="#17202A">+1 year if a significant</text><text x="500" y="174" font-size="12" fill="#17202A">new indication</text>
<path d="M382 190 v12" stroke="#17202A" stroke-width="2"/><text x="300" y="218" font-size="12" fill="#17202A">generic may file</text>
<path d="M454 190 v12" stroke="#17202A" stroke-width="2"/><text x="446" y="232" font-size="12" fill="#17202A">may launch</text>
<text x="40" y="270" font-size="15" font-weight="700" fill="#17202A">Reform (pharma package): 8 + 1 (+ extensions, max 11)</text>
<rect x="94" y="282" width="288" height="34" fill="#0089BF"/><text x="238" y="304" font-size="13" fill="#FFFFFF" text-anchor="middle">Data protection</text>
<rect x="382" y="282" width="36" height="34" fill="#C2185B"/><text x="400" y="304" font-size="12" fill="#FFFFFF" text-anchor="middle">+1</text>
<rect x="418" y="282" width="72" height="34" fill="#C2185B" opacity="0.45"/><text x="454" y="304" font-size="12" fill="#17202A" text-anchor="middle">extensions</text>
<text x="500" y="296" font-size="12" fill="#17202A">e.g. a significant new indication;</text><text x="500" y="312" font-size="12" fill="#17202A">combined cap of 11 years</text>
<text x="40" y="370" font-size="13" fill="#5B6672">Reform: political agreement 11 Dec 2025; applies after formal adoption and a transition period (EMA: ~2028).</text>
<text x="40" y="390" font-size="13" fill="#5B6672">Which reference products fall under which regime depends on the final transitional provisions. Check with RA.</text>
</svg>
