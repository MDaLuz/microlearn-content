<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="430" fill="#FFFFFF"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#17202A">Reference product vs generic: what must match</text>
<text x="40" y="66" font-size="14" fill="#5B6672">Based on Directive 2001/83/EC, Art. 10(2)(b).</text>
<g font-size="15" fill="#17202A">
<rect x="40" y="90" width="340" height="240" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/>
<text x="60" y="122" font-size="17" font-weight="700" fill="#0089BF">Must be the same</text>
<text x="60" y="158">✓ Active substance(s), same amount</text>
<text x="60" y="190">✓ Pharmaceutical form</text>
<text x="80" y="212" font-size="13" fill="#5B6672">(immediate-release oral forms count as one form)</text>
<text x="60" y="244">✓ Bioequivalence shown</text>
<text x="80" y="266" font-size="13" fill="#5B6672">(Lesson 2)</text>
<rect x="420" y="90" width="340" height="240" rx="10" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/>
<text x="440" y="122" font-size="17" font-weight="700" fill="#8A6A00">May differ</text>
<text x="440" y="158">• Excipients (inactive ingredients)</text>
<text x="440" y="190">• Shape, colour, size</text>
<text x="440" y="222">• Salt, ester or isomer of the</text>
<text x="456" y="244">substance, unless safety or</text>
<text x="456" y="266">efficacy differs significantly</text>
<text x="440" y="298">• Name and packaging</text>
</g>
<text x="40" y="370" font-size="13" fill="#5B6672">If the form, strength, route or indication differs, or bioequivalence can't be shown, the generic route doesn't fit,</text>
<text x="40" y="390" font-size="13" fill="#5B6672">and a hybrid application (Art. 10(3)) may be needed.</text>
</svg>
