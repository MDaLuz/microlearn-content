<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="520" fill="#FFFFFF"/>
<text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Choosing the legal basis: a simplified tree</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Directive 2001/83/EC. Real decisions involve RA and sometimes scientific advice.</text>
<defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs>
<g font-size="13" fill="#17202A">
<rect x="250" y="80" width="300" height="46" rx="8" fill="#F5F7F9" stroke="#7C8792"/><text x="400" y="100" text-anchor="middle">Is there an EU reference product with</text><text x="400" y="117" text-anchor="middle">the same substance(s), strength and form?</text>
<rect x="40" y="170" width="250" height="46" rx="8" fill="#F5F7F9" stroke="#7C8792"/><text x="165" y="190" text-anchor="middle">Can bioequivalence be shown,</text><text x="165" y="207" text-anchor="middle">with nothing else changed?</text>
<rect x="510" y="170" width="250" height="46" rx="8" fill="#F5F7F9" stroke="#7C8792"/><text x="635" y="190" text-anchor="middle">Known substances newly</text><text x="635" y="207" text-anchor="middle">combined in one product?</text>
<rect x="20" y="270" width="140" height="56" rx="8" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="90" y="294" text-anchor="middle" font-weight="700">Art. 10(1)</text><text x="90" y="313" text-anchor="middle">generic</text>
<rect x="180" y="270" width="150" height="56" rx="8" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="255" y="294" text-anchor="middle" font-weight="700">Art. 10(3)</text><text x="255" y="313" text-anchor="middle">hybrid (bridging data)</text>
<rect x="430" y="270" width="160" height="56" rx="8" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="510" y="294" text-anchor="middle" font-weight="700">Art. 10b</text><text x="510" y="313" text-anchor="middle">fixed combination</text>
<rect x="610" y="270" width="170" height="46" rx="8" fill="#F5F7F9" stroke="#7C8792"/><text x="695" y="290" text-anchor="middle">Substance in EU use</text><text x="695" y="306" text-anchor="middle">10+ years, literature?</text>
<rect x="540" y="380" width="120" height="56" rx="8" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="600" y="404" text-anchor="middle" font-weight="700">Art. 10a</text><text x="600" y="423" text-anchor="middle">well-established</text>
<rect x="670" y="380" width="120" height="56" rx="8" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="730" y="404" text-anchor="middle" font-weight="700">Art. 8(3)</text><text x="730" y="423" text-anchor="middle">full or mixed</text>
</g>
<g stroke="#17202A" stroke-width="2" fill="none" marker-end="url(#k)"><path d="M330 126 L190 168"/><path d="M470 126 L610 168"/><path d="M110 216 L90 268"/><path d="M220 216 L250 268"/><path d="M580 216 L520 268"/><path d="M690 216 L695 268"/><path d="M670 316 L610 378"/><path d="M715 316 L730 378"/></g>
<g font-size="12" font-weight="700" fill="#5B6672"><text x="232" y="146">yes</text><text x="550" y="146">no</text><text x="68" y="246">yes</text><text x="243" y="246">no</text><text x="530" y="246">yes</text><text x="700" y="246">no</text><text x="612" y="352">yes</text><text x="728" y="352">no</text></g>
<rect x="40" y="460" width="720" height="44" rx="8" fill="#FDF6DC" stroke="#E8B400"/>
<text x="56" y="478" font-size="13" fill="#17202A"><tspan font-weight="700">Art. 10c, informed consent:</tspan> the existing MAH lets you use its full dossier for an identical product.</text>
<text x="56" y="496" font-size="13" fill="#17202A">It sits outside this tree, because it depends on an agreement, not on data.</text>
</svg>
