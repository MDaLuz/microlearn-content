<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="470" fill="#FFFFFF"/>
<text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Legal basis at a glance</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Typical, not absolute. "Effort to file" means the work needed before submission.</text>
<g font-size="13" fill="#17202A">
<rect x="30" y="80" width="740" height="34" fill="#17202A"/>
<g fill="#FFFFFF" font-weight="700"><text x="42" y="102">Basis</text><text x="185" y="102">Relies on</text><text x="410" y="102">Own data needed</text><text x="640" y="102">Effort to file</text></g>
<rect x="30" y="114" width="740" height="52" fill="#F5F7F9"/>
<text x="42" y="136" font-weight="700">10(1) generic</text><text x="185" y="136">reference product's data</text><text x="410" y="136">quality + bioequivalence</text><text x="640" y="136">lowest</text>
<rect x="30" y="166" width="740" height="52" fill="#FFFFFF"/>
<text x="42" y="188" font-weight="700">10(3) hybrid</text><text x="185" y="188">reference + bridging data</text><text x="410" y="188">quality + bridging studies</text><text x="640" y="188">medium</text>
<rect x="30" y="218" width="740" height="52" fill="#F5F7F9"/>
<text x="42" y="240" font-weight="700">10a WEU</text><text x="185" y="240">published literature</text><text x="410" y="240">quality + literature review</text><text x="640" y="240">medium</text>
<rect x="30" y="270" width="740" height="52" fill="#FBE8EF"/>
<text x="42" y="292" font-weight="700">10b fixed comb.</text><text x="185" y="292">known substances' record</text><text x="410" y="292">quality + combination studies</text><text x="640" y="292">medium to high</text>
<rect x="30" y="322" width="740" height="52" fill="#F5F7F9"/>
<text x="42" y="344" font-weight="700">10c informed</text><text x="185" y="344">another MAH's full dossier</text><text x="410" y="344">consent letter, identical dossier</text><text x="640" y="344">low (needs a deal)</text>
<rect x="30" y="374" width="740" height="52" fill="#FBE8EF"/>
<text x="42" y="396" font-weight="700">8(3) full / mixed</text><text x="185" y="396">own data (+ literature)</text><text x="410" y="396">complete dossier</text><text x="640" y="396">highest</text>
</g>
<text x="40" y="452" font-size="12" fill="#5B6672">WEU = well-established use. Every route also includes the procedure itself (Module 2) and launch conditions (Module 3).</text>
</svg>
