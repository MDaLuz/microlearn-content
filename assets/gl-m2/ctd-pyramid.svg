<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="480" fill="#FFFFFF"/>
<text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">The CTD dossier: five modules</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Redrawn from the ICH M4 structure. Module 1 is regional (EU-specific); Modules 2–5 are common.</text>
<g font-size="14" fill="#17202A" text-anchor="middle">
<path d="M400 90 L470 160 L330 160 Z" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/><text x="400" y="145" font-weight="700" font-size="12">Module 1</text>
<path d="M330 165 L470 165 L540 235 L260 235 Z" fill="#F5F7F9" stroke="#7C8792" stroke-width="2"/><text x="400" y="198" font-weight="700">Module 2</text><text x="400" y="218" font-size="12" fill="#5B6672">overviews and summaries</text>
<path d="M260 240 L360 240 L360 400 L130 400 Z" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="275" y="320" font-weight="700">Module 3</text><text x="275" y="340" font-size="12">Quality</text>
<path d="M365 240 L435 240 L435 400 L365 400 Z" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="400" y="320" font-weight="700" font-size="12">Mod. 4</text><text x="400" y="338" font-size="11">Non-clin.</text>
<path d="M440 240 L540 240 L670 400 L440 400 Z" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="525" y="320" font-weight="700">Module 5</text><text x="525" y="340" font-size="12">Clinical</text>
</g>
<g font-size="12" fill="#17202A">
<text x="490" y="118">← EU admin forms, SmPC, labelling and PIL,</text><text x="505" y="134">country requirements</text>
<text x="40" y="430">For a generic: Module 3 is full (own product); Module 4 mostly relies on the reference;</text>
<text x="40" y="448">Module 5 holds the bioequivalence study.</text><text x="40" y="466" fill="#5B6672">Submitted electronically as eCTD in the EU.</text>
</g>
</svg>
