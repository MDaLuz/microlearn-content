<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="470" fill="#FFFFFF"/>
<text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">The DCP clock, day by day</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Simplified from the CMDh DCP best-practice guide. Clock-stops pause the count; their length depends on you.</text>
<line x1="60" y1="200" x2="760" y2="200" stroke="#17202A" stroke-width="3"/>
<rect x="300" y="186" width="70" height="28" fill="#F2C94C"/><text x="335" y="205" font-size="12" text-anchor="middle" fill="#17202A">clock-stop</text>
<rect x="598" y="186" width="56" height="28" fill="#F2C94C" opacity="0.6"/><text x="626" y="205" font-size="11" text-anchor="middle" fill="#17202A">if needed</text>
<g font-size="13" fill="#17202A" text-anchor="middle">
<circle cx="70" cy="200" r="8" fill="#0089BF"/><text x="70" y="178" font-weight="700">Day 0</text><text x="70" y="235">start</text>
<circle cx="170" cy="200" r="8" fill="#0089BF"/><text x="170" y="178" font-weight="700">Day 70</text><text x="170" y="235">RMS preliminary</text><text x="170" y="251">assessment</text>
<circle cx="240" cy="200" r="8" fill="#0089BF"/><text x="240" y="170" font-weight="700">Day 100</text><text x="240" y="275">CMS comments</text>
<circle cx="295" cy="200" r="8" fill="#C2185B"/><text x="292" y="150" font-weight="700">Day 105</text><text x="292" y="135" font-size="12">questions to you</text>
<circle cx="380" cy="200" r="8" fill="#0089BF"/><text x="390" y="178" font-weight="700">Day 106</text><text x="395" y="235">your responses</text>
<circle cx="450" cy="200" r="8" fill="#C2185B"/><text x="455" y="160" font-weight="700">Day 120</text><text x="455" y="255">draft report;</text><text x="455" y="271">may close here</text>
<circle cx="530" cy="200" r="8" fill="#0089BF"/><text x="530" y="178" font-weight="700">Day 145</text><text x="530" y="300">CMS comments</text>
<circle cx="580" cy="200" r="8" fill="#0089BF"/><text x="572" y="135" font-weight="700">Day 180</text><text x="572" y="120" font-size="12">outstanding issues</text>
<circle cx="700" cy="200" r="11" fill="#C2185B"/><text x="700" y="174" font-weight="700">Day 210</text><text x="700" y="235">procedure</text><text x="700" y="251">closes</text>
</g>
<rect x="60" y="330" width="700" height="56" rx="8" fill="#FBE8EF" stroke="#C2185B"/>
<text x="76" y="352" font-size="14" font-weight="700" fill="#17202A">Then the national phase (Lesson 7):</text>
<text x="76" y="372" font-size="13" fill="#17202A">translations from you within days, then 30 days for each country to grant its licence.</text>
<text x="40" y="420" font-size="12" fill="#5B6672">If there's no agreement by Day 210 over a potential serious risk to public health, the case goes to the CMDh (60 days).</text>
<text x="40" y="440" font-size="12" fill="#5B6672">Days are procedure days, not calendar days. Check the current CMDh flow chart for exact steps.</text>
</svg>
