<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="470" fill="#FFFFFF"/>
<text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Who decides on a marketing authorisation in the EU</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Two tracks. Generics mostly take the national track (MRP/DCP).</text>
<g font-size="14" fill="#17202A" text-anchor="middle">
<text x="210" y="100" font-size="16" font-weight="700" fill="#0089BF">Central track</text>
<rect x="80" y="115" width="260" height="58" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="210" y="140" font-weight="700">EMA (CHMP)</text><text x="210" y="160" font-size="12" fill="#5B6672">scientific assessment and opinion</text>
<rect x="80" y="215" width="260" height="58" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="210" y="240" font-weight="700">European Commission</text><text x="210" y="260" font-size="12" fill="#5B6672">legally binding decision</text>
<rect x="80" y="315" width="260" height="50" rx="10" fill="#F5F7F9" stroke="#7C8792"/><text x="210" y="345">One licence, valid in the whole EU</text>
<text x="590" y="100" font-size="16" font-weight="700" fill="#C2185B">National track</text>
<rect x="460" y="115" width="260" height="58" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="590" y="140" font-weight="700">National agencies (NCAs)</text><text x="590" y="160" font-size="12" fill="#5B6672">assess, and grant national licences</text>
<rect x="460" y="215" width="260" height="58" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="590" y="240" font-weight="700">CMDh</text><text x="590" y="260" font-size="12" fill="#5B6672">coordinates MRP/DCP, settles disputes</text>
<rect x="460" y="315" width="260" height="50" rx="10" fill="#F5F7F9" stroke="#7C8792"/><text x="590" y="337">One licence per country,</text><text x="590" y="355">same harmonised content</text>
</g>
<defs><marker id="z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs>
<g stroke="#17202A" stroke-width="2" marker-end="url(#z)"><line x1="210" y1="173" x2="210" y2="212"/><line x1="210" y1="273" x2="210" y2="312"/><line x1="590" y1="273" x2="590" y2="312"/></g>
<line x1="590" y1="173" x2="590" y2="215" stroke="#17202A" stroke-width="2" stroke-dasharray="5 4"/>
<text x="40" y="410" font-size="13" fill="#5B6672">If member states disagree in MRP/DCP over a serious risk to public health, the CMDh tries to</text>
<text x="40" y="430" font-size="13" fill="#5B6672">settle it (60 days); otherwise it goes to the CHMP and a Commission decision.</text>
<text x="40" y="450" font-size="13" fill="#5B6672">Switzerland (Swissmedic) is outside this system.</text></svg>
