<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="480" fill="#FFFFFF"/>
<text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Gap analysis: what gets checked</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Typical checklist for an in-licensed dossier (industry practice). Red = example gaps found.</text>
<g font-size="14" fill="#17202A">
<rect x="40" y="82" width="350" height="34" rx="6" fill="#F5F7F9"/><circle cx="60" cy="99" r="8" fill="#0089BF"/><text x="78" y="104">Legal basis and reference product proof</text>
<rect x="40" y="122" width="350" height="34" rx="6" fill="#F5F7F9"/><circle cx="60" cy="139" r="8" fill="#0089BF"/><text x="78" y="144">BE study: EU reference, full report</text>
<rect x="40" y="162" width="350" height="34" rx="6" fill="#FBE8EF"/><circle cx="60" cy="179" r="8" fill="#C2185B"/><text x="78" y="184">Stability: EU conditions, enough data</text>
<rect x="40" y="202" width="350" height="34" rx="6" fill="#F5F7F9"/><circle cx="60" cy="219" r="8" fill="#0089BF"/><text x="78" y="224">API documentation: ASMF or CEP</text>
<rect x="40" y="242" width="350" height="34" rx="6" fill="#FBE8EF"/><circle cx="60" cy="259" r="8" fill="#C2185B"/><text x="78" y="264">Nitrosamine risk assessment</text>
<rect x="410" y="82" width="350" height="34" rx="6" fill="#F5F7F9"/><circle cx="430" cy="99" r="8" fill="#0089BF"/><text x="448" y="104">Process validation status</text>
<rect x="410" y="122" width="350" height="34" rx="6" fill="#FBE8EF"/><circle cx="430" cy="139" r="8" fill="#C2185B"/><text x="448" y="144">Sites: EU GMP status</text>
<rect x="410" y="162" width="350" height="34" rx="6" fill="#F5F7F9"/><circle cx="430" cy="179" r="8" fill="#0089BF"/><text x="448" y="184">Module 1: country requirements</text>
<rect x="410" y="202" width="350" height="34" rx="6" fill="#F5F7F9"/><circle cx="430" cy="219" r="8" fill="#0089BF"/><text x="448" y="224">Product information (SmPC/PIL) vs reference</text>
<rect x="410" y="242" width="350" height="34" rx="6" fill="#F5F7F9"/><circle cx="430" cy="259" r="8" fill="#0089BF"/><text x="448" y="264">eCTD format and lifecycle</text>
</g>
<text x="40" y="320" font-size="16" font-weight="700" fill="#17202A">Output: a gap list</text>
<g font-size="13" fill="#17202A">
<rect x="40" y="335" width="720" height="30" fill="#17202A"/><g fill="#FFFFFF" font-weight="700"><text x="52" y="355">Gap</text><text x="330" y="355">Owner</text><text x="470" y="355">Impact</text><text x="620" y="355">Due</text></g>
<rect x="40" y="365" width="720" height="30" fill="#FBE8EF"/><text x="52" y="385">Only 6 months' EU-condition stability</text><text x="330" y="385">Dossier owner</text><text x="470" y="385">Blocks filing</text><text x="620" y="385">week 6</text>
<rect x="40" y="395" width="720" height="30" fill="#F5F7F9"/><text x="52" y="415">Nitrosamine assessment missing</text><text x="330" y="415">Dossier owner / QA</text><text x="470" y="415">Likely question</text><text x="620" y="415">week 4</text>
</g>
<text x="40" y="455" font-size="12" fill="#5B6672">Example rows are illustrative.</text>
</svg>
