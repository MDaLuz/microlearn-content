<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="400" fill="#FFFFFF"/>
<text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Keeping a licence alive</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Directive 2001/83/EC, Art. 24. The pharma package revises parts of this framework once it applies.</text>
<line x1="60" y1="170" x2="760" y2="170" stroke="#17202A" stroke-width="3"/>
<g font-size="12" fill="#5B6672" text-anchor="middle"><text x="70" y="195">year 0</text><text x="250" y="195">year 3</text><text x="430" y="195">year 5</text></g>
<circle cx="70" cy="170" r="9" fill="#0089BF"/><text x="44" y="146" font-size="13" font-weight="700" fill="#17202A">Licence granted</text>
<rect x="70" y="210" width="180" height="40" rx="6" fill="#FDF6DC" stroke="#E8B400"/><text x="160" y="228" font-size="12" text-anchor="middle" fill="#17202A">Must be placed on the</text><text x="160" y="243" font-size="12" text-anchor="middle" fill="#17202A">market within 3 years</text>
<circle cx="250" cy="170" r="9" fill="#C2185B"/><text x="250" y="130" font-size="13" text-anchor="middle" font-weight="700" fill="#C2185B">Sunset check</text><text x="250" y="146" font-size="12" text-anchor="middle" fill="#17202A">not marketed → licence lapses</text>
<circle cx="370" cy="170" r="8" fill="#0089BF"/><text x="370" y="240" font-size="12" text-anchor="middle" fill="#17202A">renewal filed ≥ 9 months</text><text x="370" y="255" font-size="12" text-anchor="middle" fill="#17202A">before expiry</text>
<circle cx="430" cy="170" r="9" fill="#0089BF"/><text x="430" y="146" font-size="13" text-anchor="middle" font-weight="700" fill="#17202A">Renewal</text>
<rect x="450" y="150" width="310" height="40" fill="#EAF6FB"/><text x="605" y="175" font-size="13" text-anchor="middle" fill="#17202A">Then usually unlimited validity</text>
<text x="40" y="300" font-size="14" font-weight="700" fill="#17202A">Sunset clause, in plain words</text>
<text x="40" y="324" font-size="13" fill="#17202A">A licence lapses if the product isn't actually marketed in that country within 3 years of approval,</text>
<text x="40" y="344" font-size="13" fill="#17202A">or if it's off the market there for 3 consecutive years. Exemptions are possible in exceptional cases.</text>
<text x="40" y="378" font-size="12" fill="#5B6672">Years are illustrative positions on the line, not to scale.</text>
</svg>
