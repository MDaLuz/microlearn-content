<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="380" fill="#FFFFFF"/>
<text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">After the procedure closes: the national phase</text>
<text x="40" y="62" font-size="13" fill="#5B6672">The same steps run in parallel in every country.</text>
<defs><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs>
<g font-size="13" fill="#17202A" text-anchor="middle">
<rect x="30" y="100" width="150" height="80" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="105" y="134" font-weight="700">Procedure</text><text x="105" y="152" font-weight="700">closes</text><text x="105" y="170" font-size="12" fill="#5B6672">agreed English texts</text>
<rect x="215" y="100" width="170" height="80" rx="10" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/><text x="300" y="130" font-weight="700">You send</text><text x="300" y="148">translations of SmPC,</text><text x="300" y="166">PIL and labelling</text>
<rect x="420" y="100" width="170" height="80" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="505" y="130" font-weight="700">Each country</text><text x="505" y="148">checks texts and</text><text x="505" y="166">national details</text>
<rect x="625" y="100" width="145" height="80" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="697" y="134" font-weight="700">National</text><text x="697" y="152" font-weight="700">licence granted</text><text x="697" y="170" font-size="12" fill="#5B6672">within 30 days</text>
</g>
<g stroke="#17202A" stroke-width="2" marker-end="url(#n)"><line x1="180" y1="140" x2="212" y2="140"/><line x1="385" y1="140" x2="417" y2="140"/><line x1="590" y1="140" x2="622" y2="140"/></g>
<text x="40" y="230" font-size="16" font-weight="700" fill="#17202A">Typical PM watch-points</text>
<g font-size="13" fill="#17202A"><text x="40" y="258">• Translation vendor booked before Day 120, so texts are ready when the procedure closes</text><text x="40" y="282">• National particulars (Blue Box, local representative, pack sizes): Module 8</text><text x="40" y="306">• A licence isn't a launch: artwork, pricing and supply still have to be ready (Module 9)</text></g>
<text x="40" y="350" font-size="12" fill="#5B6672">Sources: Directive 2001/83/EC Art. 28(5); CMDh DCP best-practice guide (deadline for translations).</text>
</svg>
