<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="470" fill="#FFFFFF"/>
<text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Four procedures compared</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Assessment timelines from EU law, excluding clock-stops and national steps.</text>
<g font-size="13" fill="#17202A">
<rect x="30" y="80" width="740" height="36" fill="#17202A"/>
<g fill="#FFFFFF" font-weight="700"><text x="42" y="103">Procedure</text><text x="190" y="103">When used</text><text x="440" y="103">How it works</text><text x="650" y="103">Clock</text></g>
<rect x="30" y="116" width="740" height="66" fill="#F5F7F9"/>
<text x="42" y="140" font-weight="700">National</text><text x="190" y="140">One country only</text><text x="440" y="140">That country assesses</text><text x="440" y="158">and decides</text><text x="650" y="140">210 days</text>
<rect x="30" y="182" width="740" height="66" fill="#FFFFFF"/>
<text x="42" y="206" font-weight="700">MRP</text><text x="190" y="206">Licence already exists</text><text x="190" y="224">in one EU country</text><text x="440" y="206">Others recognise the</text><text x="440" y="224">existing licence</text><text x="650" y="206">90 + 90 days</text>
<rect x="30" y="248" width="740" height="66" fill="#FBE8EF"/>
<text x="42" y="272" font-weight="700">DCP</text><text x="190" y="272">No licence yet;</text><text x="190" y="290">several countries at once</text><text x="440" y="272">Lead country (RMS) assesses,</text><text x="440" y="290">others (CMS) approve</text><text x="650" y="272">120 + 90 days</text><text x="650" y="290" font-size="12" fill="#5B6672">+ 30 national</text>
<rect x="30" y="314" width="740" height="66" fill="#F5F7F9"/>
<text x="42" y="338" font-weight="700">Centralised</text><text x="190" y="338">Mandatory for some types;</text><text x="190" y="356">optional for others</text><text x="440" y="338">EMA's CHMP assesses,</text><text x="440" y="356">Commission decides</text><text x="650" y="338">210 days</text><text x="650" y="356" font-size="12" fill="#5B6672">+ EC decision</text>
</g>
<text x="40" y="414" font-size="13" fill="#5B6672">For the same product in 2+ EU countries, a national procedure isn't allowed: MRP or DCP is required.</text>
<text x="40" y="434" font-size="13" fill="#5B6672">Sources: Directive 2001/83/EC Art. 17, 18, 28; Regulation (EC) No 726/2004 Art. 3, 6, 10.</text>
</svg>
