<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="440" fill="#FFFFFF"/>
<text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Pharmacovigilance: ready on day one</text>
<text x="40" y="62" font-size="13" fill="#5B6672">What the MAH must have in place before the first pack is sold.</text>
<g font-size="13" fill="#17202A" text-anchor="middle">
<rect x="300" y="90" width="200" height="70" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="3"/><text x="400" y="120" font-weight="700" font-size="15">MAH's PV system</text><text x="400" y="142" font-size="12" fill="#5B6672">described in the PSMF</text>
<rect x="40" y="210" width="210" height="72" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="145" y="238" font-weight="700">QPPV</text><text x="145" y="258" font-size="12">named, lives and works in the EU</text>
<rect x="295" y="210" width="210" height="72" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="400" y="238" font-weight="700">Case reporting</text><text x="400" y="258" font-size="12">to EudraVigilance:</text><text x="400" y="274" font-size="12">serious 15 days, others 90</text>
<rect x="550" y="210" width="210" height="72" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="655" y="238" font-weight="700">RMP</text><text x="655" y="258" font-size="12">for generics, usually</text><text x="655" y="274" font-size="12">aligned with the reference</text>
<text x="400" y="310" font-size="13" text-anchor="middle" font-weight="700" fill="#5B6672">Also needed</text><rect x="165" y="320" width="210" height="72" rx="10" fill="#F5F7F9" stroke="#7C8792" stroke-width="2"/><text x="270" y="348" font-weight="700">PV agreements</text><text x="270" y="368" font-size="12">with partners (SDEA)</text>
<rect x="425" y="320" width="210" height="72" rx="10" fill="#F5F7F9" stroke="#7C8792" stroke-width="2"/><text x="530" y="348" font-weight="700">Product data in EMA</text><text x="530" y="368" font-size="12">database (Art. 57)</text>
</g>
<g stroke="#17202A" stroke-width="2"><line x1="360" y1="160" x2="190" y2="210"/><line x1="400" y1="160" x2="400" y2="210"/><line x1="440" y1="160" x2="610" y2="210"/></g>
<text x="40" y="425" font-size="12" fill="#5B6672">Generics are usually exempt from routine PSURs unless the licence or the EU reference-dates list requires them.</text>
</svg>
