<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="440" fill="#FFFFFF"/>
<text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">One lead country, several followers</text>
<text x="40" y="62" font-size="13" fill="#5B6672">In a DCP the reference member state (RMS) writes the assessment;</text>
<g transform="translate(-50,22)"><g font-size="14" text-anchor="middle" fill="#17202A">
<circle cx="300" cy="235" r="70" fill="#FBE8EF" stroke="#C2185B" stroke-width="3"/><text x="300" y="230" font-weight="700" font-size="17">RMS</text><text x="300" y="252" font-size="12" fill="#5B6672">e.g. NL</text>
<circle cx="110" cy="130" r="42" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="110" y="128" font-weight="700">CMS</text><text x="110" y="146" font-size="12" fill="#5B6672">DE</text>
<circle cx="110" cy="340" r="42" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="110" y="338" font-weight="700">CMS</text><text x="110" y="356" font-size="12" fill="#5B6672">FR</text>
<circle cx="490" cy="130" r="42" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="490" y="128" font-weight="700">CMS</text><text x="490" y="146" font-size="12" fill="#5B6672">IT</text>
<circle cx="490" cy="340" r="42" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="490" y="338" font-weight="700">CMS</text><text x="490" y="356" font-size="12" fill="#5B6672">PL</text>
</g>
<g stroke="#17202A" stroke-width="2"><line x1="145" y1="153" x2="242" y2="200"/><line x1="145" y1="317" x2="242" y2="270"/><line x1="455" y1="153" x2="358" y2="200"/><line x1="455" y1="317" x2="358" y2="270"/></g></g>
<text x="240" y="432" font-size="11" fill="#5B6672">Countries are illustrative.</text>
<text x="540" y="110" font-size="16" font-weight="700" fill="#17202A">What drives the RMS choice</text>
<g font-size="13" fill="#17202A"><text x="540" y="140">• Agency capacity and slots</text><text x="540" y="166">• Track record on timelines</text><text x="540" y="192">• Experience with the</text><text x="552" y="210">product type</text><text x="540" y="236">• Fees and language</text><text x="540" y="262">• Your key markets</text><text x="540" y="288">• In an MRP: fixed, it's the</text><text x="552" y="306">country with the licence</text></g>
<text x="540" y="340" font-size="12" fill="#5B6672">Industry practice, not law</text><text x="540" y="356" font-size="12" fill="#5B6672">(except the MRP rule).</text>
<text x="40" y="80" font-size="13" fill="#5B6672">concerned member states (CMS) comment and approve.</text></svg>
