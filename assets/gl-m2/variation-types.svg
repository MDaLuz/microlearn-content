<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="430" fill="#FFFFFF"/>
<text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Changing an approved product: variation types</text>
<text x="40" y="62" font-size="13" fill="#5B6672">EU variations framework (Reg. (EC) No 1234/2008, as amended; guidelines from 15 Jan 2026). Simplified.</text>
<g font-size="14" fill="#17202A">
<rect x="40" y="320" width="170" height="60" rx="8" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="125" y="344" text-anchor="middle" font-weight="700">Type IA</text><text x="125" y="364" text-anchor="middle" font-size="12">minor: do, then tell</text>
<rect x="230" y="250" width="170" height="130" rx="8" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/><text x="315" y="274" text-anchor="middle" font-weight="700">Type IB</text><text x="315" y="294" text-anchor="middle" font-size="12">minor: tell, wait, do</text>
<rect x="420" y="170" width="170" height="210" rx="8" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="505" y="194" text-anchor="middle" font-weight="700">Type II</text><text x="505" y="214" text-anchor="middle" font-size="12">major: approval first</text>
<rect x="610" y="90" width="160" height="290" rx="8" fill="#F5F7F9" stroke="#7C8792" stroke-width="2"/><text x="690" y="114" text-anchor="middle" font-weight="700">Extension</text><text x="690" y="134" text-anchor="middle" font-size="11">e.g. new strength/form</text>
</g>
<g font-size="12" fill="#5B6672" text-anchor="middle"><text x="125" y="300">usually via annual update</text><text x="125" y="314">(some: immediately)</text><text x="315" y="330">30-day review</text><text x="505" y="260">60-day assessment</text><text x="505" y="276">(can be shorter or longer)</text><text x="690" y="220">assessed like a</text><text x="690" y="236">new application</text></g>
<text x="40" y="410" font-size="12" fill="#5B6672">Worksharing: one assessment for the same change across several licences. Grouping: several changes in one submission.</text>
</svg>
