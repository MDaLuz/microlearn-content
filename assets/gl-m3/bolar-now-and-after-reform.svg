<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="430" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">The Bolar exemption: what you may do before expiry</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Today: Directive 2001/83/EC Art. 10(6), implemented nationally.</text>
<text x="40" y="80" font-size="13" fill="#5B6672">Reform: pharma package (agreed Dec 2025; applies after adoption and transition).</text>
<g font-size="13" fill="#17202A">
<rect x="40" y="96" width="720" height="34" fill="#17202A"/><g fill="#FFFFFF" font-weight="700"><text x="52" y="118">Activity before patent/SPC expiry</text><text x="440" y="118">Today</text><text x="610" y="118">After reform</text></g>
<rect x="40" y="130" width="720" height="38" fill="#F5F7F9"/><text x="52" y="154">Bioequivalence and other studies</text><text x="440" y="154" fill="#0089BF" font-weight="700">✓ allowed</text><text x="610" y="154" fill="#0089BF" font-weight="700">✓ allowed</text>
<rect x="40" y="168" width="720" height="38" fill="#FFFFFF"/><text x="52" y="192">Filing and obtaining the licence</text><text x="440" y="192" fill="#0089BF" font-weight="700">✓ allowed</text><text x="610" y="192" fill="#0089BF" font-weight="700">✓ allowed</text>
<rect x="40" y="206" width="720" height="38" fill="#F5F7F9"/><text x="52" y="230">HTA, pricing and reimbursement</text><text x="440" y="230" fill="#8A6A00" font-weight="700">? varies by country</text><text x="610" y="230" fill="#0089BF" font-weight="700">✓ allowed</text>
<rect x="40" y="244" width="720" height="38" fill="#FFFFFF"/><text x="52" y="268">Submitting tender bids</text><text x="440" y="268" fill="#8A6A00" font-weight="700">? varies / risky</text><text x="610" y="268" fill="#0089BF" font-weight="700">✓ allowed</text>
<rect x="40" y="282" width="720" height="44" fill="#F5F7F9"/><text x="52" y="306">Making stock for EU launch</text><text x="440" y="302" fill="#8A6A00" font-weight="700">only via SPC waiver,</text><text x="440" y="318" font-size="11" fill="#8A6A00">last 6 months of the SPC</text><text x="610" y="306" fill="#8A6A00" font-weight="700">same</text>
<rect x="40" y="326" width="720" height="38" fill="#FBE8EF"/><text x="52" y="350">Selling in the EU</text><text x="440" y="350" fill="#C2185B" font-weight="700">✗ infringement</text><text x="610" y="350" fill="#C2185B" font-weight="700">✗ infringement</text>
</g>
<text x="40" y="392" font-size="12" fill="#5B6672">"Varies" = national laws differ, so ask patent counsel per country. The reform harmonises the scope once it applies.</text>
<text x="40" y="410" font-size="12" fill="#5B6672">SPC manufacturing waiver: Regulation (EU) 2019/933 (notify the patent office and the SPC holder in advance).</text></svg>