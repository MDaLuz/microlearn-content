<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="380" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Earliest launch date, per country</text>
<text x="40" y="62" font-size="13" fill="#5B6672">The PM's master grid for Module 3. Values illustrative; launch = the latest date that applies.</text>
<g font-size="13" fill="#17202A">
<rect x="30" y="80" width="740" height="34" fill="#17202A"/><g fill="#FFFFFF" font-weight="700"><text x="42" y="102">Country</text><text x="140" y="102">Market prot.</text><text x="270" y="102">Patent ends</text><text x="400" y="102">SPC (+paed)</text><text x="530" y="102">Open dispute</text><text x="670" y="102">Earliest</text></g>
<rect x="30" y="114" width="740" height="40" fill="#F5F7F9"/><text x="42" y="139">DE</text><text x="140" y="139">Mar 2028</text><text x="270" y="139">Jun 2027</text><text x="400" y="139">Dec 2029</text><text x="530" y="139">none</text><text x="670" y="139" font-weight="700" fill="#C2185B">Dec 2029</text>
<rect x="30" y="154" width="740" height="40" fill="#FFFFFF"/><text x="42" y="179">FR</text><text x="140" y="179">Mar 2028</text><text x="270" y="179">Jun 2027</text><text x="400" y="179">Dec 2029</text><text x="530" y="179">opposition</text><text x="670" y="179" font-weight="700" fill="#C2185B">Dec 2029 ?</text>
<rect x="30" y="194" width="740" height="40" fill="#F5F7F9"/><text x="42" y="219">Country X</text><text x="140" y="219">Mar 2028</text><text x="270" y="219">Jun 2027</text><text x="400" y="219">no SPC</text><text x="530" y="219">none</text><text x="670" y="219" font-weight="700" fill="#0089BF">Mar 2028</text>
<rect x="30" y="234" width="740" height="40" fill="#FFFFFF"/><text x="42" y="259">Country Y</text><text x="140" y="259">Mar 2028</text><text x="270" y="259">not validated</text><text x="400" y="259">n/a</text><text x="530" y="259">none</text><text x="670" y="259" font-weight="700" fill="#0089BF">Mar 2028</text>
</g>
<g font-size="13" fill="#17202A"><text x="40" y="306" font-weight="700">How to read it</text>
<text x="40" y="328">Earliest = the latest date in the row. Secondary patents get their own FTO line.</text>
<text x="40" y="350">'?' = a legal decision is pending, so keep a scenario for both outcomes.</text></g></svg>