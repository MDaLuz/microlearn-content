<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="360" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Freedom to operate: from search to decision</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Done by patent attorneys, per product and per country. Practice, not a legal procedure.</text>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs>
<g font-size="13" fill="#17202A" text-anchor="middle">
<rect x="30" y="140" width="150" height="70" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="105" y="170" font-weight="700">Search</text><text x="105" y="190">patents in force</text>
<rect x="210" y="140" width="150" height="70" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="285" y="170" font-weight="700">Analyse</text><text x="285" y="190">infringed? valid?</text>
<rect x="390" y="140" width="150" height="70" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="465" y="170" font-weight="700">FTO opinion</text><text x="465" y="190">per country</text>
<rect x="590" y="90" width="180" height="40" rx="8" fill="#F5F7F9" stroke="#7C8792"/><text x="680" y="115">Clear: plan launch</text>
<rect x="590" y="140" width="180" height="40" rx="8" fill="#F5F7F9" stroke="#7C8792"/><text x="680" y="165">Design around</text>
<rect x="590" y="190" width="180" height="40" rx="8" fill="#F5F7F9" stroke="#7C8792"/><text x="680" y="215">Challenge (opposition)</text>
<rect x="590" y="240" width="180" height="40" rx="8" fill="#F5F7F9" stroke="#7C8792"/><text x="680" y="265">Licence or wait</text>
</g>
<g stroke="#17202A" stroke-width="2" marker-end="url(#f)" fill="none"><line x1="180" y1="175" x2="207" y2="175"/><line x1="360" y1="175" x2="387" y2="175"/><path d="M540 175 L588 110"/><path d="M540 175 L588 160"/><path d="M540 175 L588 210"/><path d="M540 175 L588 258"/></g>
<text x="40" y="318" font-size="13" fill="#5B6672">EPO opposition: possible within 9 months of a European patent's grant (EPC Art. 99), affecting all countries at once.</text>
<text x="40" y="340" font-size="13" fill="#5B6672">The PM tracks the opinion's date and conditions; patent counsel owns the content.</text></svg>