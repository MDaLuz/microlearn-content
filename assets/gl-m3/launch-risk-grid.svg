<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="430" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Launch at risk: a country-by-country decision</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Illustrative grid. Real ratings come from patent counsel; courts and practices differ by country.</text>
<g font-size="13" fill="#17202A">
<rect x="40" y="80" width="720" height="34" fill="#17202A"/><g fill="#FFFFFF" font-weight="700"><text x="52" y="102">Country</text><text x="180" y="102">Patent status</text><text x="380" y="102">Injunction risk</text><text x="520" y="102">Decision</text></g>
<rect x="40" y="114" width="720" height="40" fill="#F5F7F9"/><text x="52" y="139">Country A</text><text x="180" y="139">expired</text><rect x="380" y="124" width="100" height="20" rx="10" fill="#0089BF"/><text x="430" y="139" fill="#FFFFFF" text-anchor="middle">none</text><text x="520" y="139">launch</text>
<rect x="40" y="154" width="720" height="40" fill="#FFFFFF"/><text x="52" y="179">Country B</text><text x="180" y="179">valid, likely invalid</text><rect x="380" y="164" width="100" height="20" rx="10" fill="#E8B400"/><text x="430" y="179" text-anchor="middle">medium</text><text x="520" y="179">challenge first, then decide</text>
<rect x="40" y="194" width="720" height="40" fill="#F5F7F9"/><text x="52" y="219">Country C</text><text x="180" y="219">valid, strong</text><rect x="380" y="204" width="100" height="20" rx="10" fill="#C2185B"/><text x="430" y="219" fill="#FFFFFF" text-anchor="middle">high</text><text x="520" y="219">wait for expiry</text>
<rect x="40" y="234" width="720" height="40" fill="#FFFFFF"/><text x="52" y="259">UPC states</text><text x="180" y="259">one court, many states</text><rect x="380" y="244" width="100" height="20" rx="10" fill="#C2185B"/><text x="430" y="259" fill="#FFFFFF" text-anchor="middle">wide reach</text><text x="520" y="259">one ruling hits several markets</text>
</g>
<text x="40" y="310" font-size="13" fill="#17202A"><tspan font-weight="700">Preliminary injunction:</tspan> a fast court order stopping sales while the case is decided.</text>
<text x="40" y="334" font-size="13" fill="#17202A"><tspan font-weight="700">Damages:</tspan> if the patent is upheld, the launcher may owe the originator for lost sales.</text>
<text x="40" y="358" font-size="13" fill="#17202A"><tspan font-weight="700">Unified Patent Court (UPC):</tspan> since June 2023, one court can rule for all participating states.</text>
<text x="40" y="396" font-size="12" fill="#5B6672">Launching at risk is a management decision taken on legal advice.</text>
<text x="40" y="414" font-size="12" fill="#5B6672">The PM's job: make its dates and conditions visible.</text></svg>