<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="420" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Choosing a product name</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Directive 2001/83/EC Art. 1(20): an invented name, or the common name with a trademark or company name.</text>
<g font-size="14" fill="#17202A" text-anchor="middle">
<path d="M80 90 H720 L650 150 H150 Z" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="400" y="126">Name ideas (invented names, or INN + company name)</text>
<path d="M150 158 H650 L590 218 H210 Z" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="400" y="194">Trademark search and registration</text>
<path d="M210 226 H590 L540 286 H260 Z" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/><text x="400" y="262">No confusion with other medicines</text>
<path d="M260 294 H540 L500 354 H300 Z" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="400" y="320" font-weight="700">Accepted by each agency</text><text x="400" y="338" font-size="12">(EMA for central products)</text>
</g>
<text x="40" y="384" font-size="13" fill="#5B6672">In a DCP the name can differ by country. Many generics use the INN + company name</text>
<text x="40" y="402" font-size="13" fill="#5B6672">(e.g. "Substance Company 10 mg tablets") to avoid trademark work.</text></svg>