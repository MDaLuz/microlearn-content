<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="430" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">One medicine, several layers of patents</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Each patent lasts up to 20 years from its own filing date.</text>
<text x="40" y="80" font-size="13" fill="#5B6672">Later filings can protect the product longer in practice.</text>
<g font-size="13" fill="#17202A">
<text x="40" y="122" font-weight="700">Compound</text><rect x="200" y="106" width="380" height="24" rx="4" fill="#C2185B"/><text x="588" y="123" fill="#5B6672">the molecule (basic patent)</text>
<text x="40" y="168" font-weight="700">Salt / crystal form</text><rect x="260" y="152" width="380" height="24" rx="4" fill="#0089BF"/>
<text x="40" y="214" font-weight="700">Formulation</text><rect x="320" y="198" width="380" height="24" rx="4" fill="#0089BF"/>
<text x="40" y="260" font-weight="700">Process</text><rect x="290" y="244" width="380" height="24" rx="4" fill="#0089BF" opacity="0.75"/>
<text x="40" y="306" font-weight="700">Use / dosing</text><rect x="370" y="290" width="380" height="24" rx="4" fill="#E8B400"/>
</g>
<line x1="200" y1="332" x2="760" y2="332" stroke="#17202A" stroke-width="2"/><text x="200" y="350" font-size="12" fill="#5B6672">time →  (positions illustrative)</text>
<text x="40" y="386" font-size="13" fill="#5B6672">A generic can often avoid secondary patents (another salt, formulation or process), but not the compound</text>
<text x="40" y="405" font-size="13" fill="#5B6672">patent. That one usually decides the earliest launch, often extended by an SPC (Lesson 2).</text></svg>