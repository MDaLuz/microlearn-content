<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="440" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">How an SPC extends protection</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Regulation (EC) No 469/2009; paediatric extension: Regulation (EC) No 1901/2006, Art. 36.</text>
<g font-size="12" fill="#5B6672"><text x="76" y="104">patent filed</text><text x="280" y="104">first EU authorisation</text><text x="520" y="104">patent ends (20 y)</text></g>
<rect x="80" y="114" width="520" height="34" fill="#0089BF"/><text x="210" y="136" font-size="13" fill="#FFFFFF" text-anchor="middle">Patent: 20 years</text>
<rect x="600" y="114" width="110" height="34" fill="#C2185B"/><text x="655" y="136" font-size="13" fill="#FFFFFF" text-anchor="middle">SPC ≤ 5 y</text>
<rect x="710" y="114" width="22" height="34" fill="#E8B400"/><text x="738" y="166" font-size="12" fill="#17202A">+6 m</text>
<line x1="330" y1="108" x2="330" y2="200" stroke="#17202A" stroke-dasharray="4 4"/>
<rect x="330" y="176" width="380" height="24" fill="#FBE8EF" stroke="#C2185B"/><text x="520" y="193" font-size="12" text-anchor="middle" fill="#17202A">patent + SPC ≤ 15 years from first EU authorisation</text>
<g font-size="13" fill="#17202A">
<text x="40" y="240" font-size="15" font-weight="700">The rules in one breath</text>
<text x="40" y="266">• SPC length = time from patent filing to first EU authorisation, minus 5 years; capped at 5 years.</text>
<text x="40" y="290">• Total protection from the first EU authorisation can't exceed 15 years.</text>
<text x="40" y="314">• +6 months if the originator completed an agreed paediatric investigation plan.</text>
<text x="40" y="338">• SPCs are granted country by country, so expiry can differ between countries.</text>
<text x="40" y="362">• SPC manufacturing waiver: generics may make in the EU during the SPC for export,</text>
<text x="56" y="382">and stockpile for EU launch in the last 6 months (Regulation (EU) 2019/933).</text>
</g>
<text x="40" y="420" font-size="12" fill="#5B6672">Positions illustrative.</text></svg>