<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="390" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Two clocks decide the launch date</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Regulatory protection (Module 1) and patents/SPCs run independently.</text>
<text x="40" y="80" font-size="13" fill="#5B6672">Launch waits for the later one, country by country.</text>
<g font-size="13" fill="#17202A">
<text x="40" y="122" font-weight="700">Regulatory</text><rect x="180" y="106" width="300" height="26" fill="#0089BF"/><text x="330" y="124" fill="#FFFFFF" text-anchor="middle">8 data + 2 market protection</text>
<text x="40" y="172" font-weight="700">Patent + SPC</text><rect x="180" y="156" width="420" height="26" fill="#C2185B"/><text x="390" y="174" fill="#FFFFFF" text-anchor="middle">compound patent + SPC (+ paediatric)</text>
<line x1="600" y1="96" x2="600" y2="210" stroke="#17202A" stroke-width="2" stroke-dasharray="5 4"/><text x="606" y="206" font-weight="700">earliest launch</text>
<line x1="420" y1="96" x2="420" y2="210" stroke="#0089BF" stroke-width="2" stroke-dasharray="5 4"/><text x="300" y="206" fill="#0089BF">may file (year 8)</text>
</g>
<rect x="40" y="230" width="720" height="130" rx="8" fill="#F5F7F9"/>
<text x="56" y="256" font-size="15" font-weight="700" fill="#17202A">Example (illustrative)</text>
<g font-size="13" fill="#17202A"><text x="56" y="282">Market protection ends: 2028. SPC expires: 2030 in DE, FR, IT; no SPC in country X.</text>
<text x="56" y="306">→ Earliest launch: 2030 in DE, FR, IT, but 2028 in country X (if no other patent applies there).</text>
<text x="56" y="330">→ Filing can still start in 2026 everywhere, so the licence is ready when the date arrives.</text></g></svg>