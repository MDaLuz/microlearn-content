<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="430" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Climatic zones and stability conditions</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Long-term storage conditions by zone (ICH Q1A(R2) and WHO). Redrawn as a chart rather than a map.</text>
<g font-size="13" fill="#17202A">
<rect x="40" y="80" width="720" height="34" fill="#17202A"/><g fill="#FFFFFF" font-weight="700"><text x="52" y="102">Zone</text><text x="200" y="102">Climate</text><text x="420" y="102">Long-term test</text><text x="600" y="102">Examples</text></g>
<rect x="40" y="114" width="720" height="40" fill="#EAF6FB"/><text x="52" y="139" font-weight="700">I / II</text><text x="200" y="139">temperate / subtropical</text><text x="420" y="139">25 °C / 60% RH</text><text x="600" y="139" font-weight="700" fill="#0089BF">EU, US, Japan</text>
<rect x="40" y="154" width="720" height="40" fill="#FFFFFF"/><text x="52" y="179" font-weight="700">III</text><text x="200" y="179">hot, dry</text><text x="420" y="179">30 °C / 35% RH</text><text x="600" y="179">parts of MENA</text>
<rect x="40" y="194" width="720" height="40" fill="#F5F7F9"/><text x="52" y="219" font-weight="700">IVa</text><text x="200" y="219">hot, humid</text><text x="420" y="219">30 °C / 65% RH</text><text x="600" y="219">e.g. Brazil</text>
<rect x="40" y="234" width="720" height="40" fill="#FBE8EF"/><text x="52" y="259" font-weight="700">IVb</text><text x="200" y="259">hot, very humid</text><text x="420" y="259">30 °C / 75% RH</text><text x="600" y="259" font-weight="700" fill="#C2185B">e.g. India</text>
</g>
<g font-size="13" fill="#17202A"><text x="40" y="306" font-weight="700">Also in every stability programme</text>
<text x="40" y="328">Accelerated: 40 °C / 75% RH for 6 months, to spot problems early.</text>
<text x="40" y="350">For EU filing, long-term data at 25 °C / 60% RH (or the harsher 30 °C) must cover the shelf life claimed.</text></g>
<text x="40" y="396" font-size="12" fill="#5B6672">Country examples follow the WHO zone list; check the current list for a specific market. RH = relative humidity.</text></svg>