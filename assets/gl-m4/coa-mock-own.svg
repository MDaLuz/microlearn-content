<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="440" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Reading a certificate of analysis</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Mock-up, illustrative values. Each line pairs a test from the specification with this batch's result.</text>
<rect x="60" y="80" width="680" height="320" fill="#FFFFFF" stroke="#7C8792" stroke-width="2"/>
<text x="80" y="110" font-size="16" font-weight="700" fill="#17202A">CERTIFICATE OF ANALYSIS</text>
<g font-size="12" fill="#17202A"><text x="80" y="134">Product: Substance X 10 mg film-coated tablets   Batch: AB1234   Mfg date: 03/2026   Expiry: 02/2029</text></g>
<g font-size="12" fill="#17202A">
<rect x="80" y="148" width="640" height="26" fill="#17202A"/><g fill="#FFFFFF" font-weight="700"><text x="90" y="166">Test</text><text x="280" y="166">Specification (limit)</text><text x="500" y="166">Result</text><text x="620" y="166">Pass?</text></g>
<text x="90" y="194">Appearance</text><text x="280" y="194">white, round, film-coated</text><text x="500" y="194">complies</text><text x="620" y="194" fill="#0089BF" font-weight="700">✓</text>
<text x="90" y="220">Identification</text><text x="280" y="220">matches reference</text><text x="500" y="220">complies</text><text x="620" y="220" fill="#0089BF" font-weight="700">✓</text>
<text x="90" y="246">Assay</text><text x="280" y="246">95.0–105.0%</text><text x="500" y="246">99.4%</text><text x="620" y="246" fill="#0089BF" font-weight="700">✓</text>
<text x="90" y="272">Dissolution (30 min)</text><text x="280" y="272">Q ≥ 80%</text><text x="500" y="272">92% (min 88%)</text><text x="620" y="272" fill="#0089BF" font-weight="700">✓</text>
<text x="90" y="298">Impurities, total</text><text x="280" y="298">≤ 1.0%</text><text x="500" y="298">0.3%</text><text x="620" y="298" fill="#0089BF" font-weight="700">✓</text>
<text x="90" y="324">Uniformity of dosage units</text><text x="280" y="324">per Ph. Eur.</text><text x="500" y="324">complies</text><text x="620" y="324" fill="#0089BF" font-weight="700">✓</text>
<text x="90" y="350">Microbial quality</text><text x="280" y="350">per Ph. Eur.</text><text x="500" y="350">complies</text><text x="620" y="350" fill="#0089BF" font-weight="700">✓</text>
<text x="90" y="384" font-weight="700">Conclusion: complies with specification.   Approved by: QC manager, date</text></g>
<text x="40" y="428" font-size="12" fill="#5B6672">A CoA shows test results. It isn't the QP release: that's a separate certification (Lesson 2).</text></svg>