<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="380" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">When something goes wrong, or needs to change</text>
<text x="40" y="62" font-size="13" fill="#5B6672">The quality system loop (EudraLex Vol. 4, Chapter 1; ICH Q10). Simplified.</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs>
<g font-size="13" fill="#17202A" text-anchor="middle">
<rect x="30" y="110" width="160" height="80" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="110" y="142" font-weight="700">Deviation</text><text x="110" y="162" font-size="12">something didn't go</text><text x="110" y="178" font-size="12">as planned</text>
<rect x="220" y="110" width="160" height="80" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="300" y="142" font-weight="700">Investigation</text><text x="300" y="162" font-size="12">root cause,</text><text x="300" y="178" font-size="12">impact on batches</text>
<rect x="410" y="110" width="160" height="80" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="490" y="142" font-weight="700">CAPA</text><text x="490" y="162" font-size="12">corrective and</text><text x="490" y="178" font-size="12">preventive actions</text>
<rect x="600" y="110" width="170" height="80" rx="10" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/><text x="685" y="142" font-weight="700">Change control</text><text x="685" y="162" font-size="12">assess, approve,</text><text x="685" y="178" font-size="12">implement changes</text>
</g>
<g stroke="#17202A" stroke-width="2" marker-end="url(#a)"><line x1="190" y1="150" x2="217" y2="150"/><line x1="380" y1="150" x2="407" y2="150"/><line x1="570" y1="150" x2="597" y2="150"/></g>
<path d="M685 190 L685 240 L300 240" stroke="#17202A" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
<rect x="160" y="226" width="140" height="30" rx="6" fill="#FBE8EF" stroke="#C2185B"/><text x="230" y="246" font-size="12" text-anchor="middle" fill="#17202A">may need a variation</text>
<g font-size="13" fill="#17202A"><text x="40" y="296" font-weight="700">PM angle</text>
<text x="40" y="318">An open deviation can block QP release of a launch batch. A change (new supplier, new site) can need a</text>
<text x="40" y="338">variation (Module 2) before the product can ship.</text></g></svg>