<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="400" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">GMP and GDP: the rules along the chain</text>
<text x="40" y="62" font-size="13" fill="#5B6672">EudraLex Vol. 4 (GMP) covers making and releasing; the EU GDP guidelines cover storing and transporting.</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs>
<g font-size="13" fill="#17202A" text-anchor="middle">
<rect x="30" y="110" width="150" height="70" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="105" y="140" font-weight="700">API site</text><text x="105" y="160" font-size="12">GMP Part II</text>
<rect x="210" y="110" width="150" height="70" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="285" y="140" font-weight="700">Finished product</text><text x="285" y="160" font-size="12">GMP Part I</text>
<rect x="390" y="110" width="150" height="70" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="465" y="140" font-weight="700">EU importer + QP</text><text x="465" y="160" font-size="12">GMP + Annex 16</text>
<rect x="570" y="110" width="200" height="70" rx="10" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/><text x="670" y="140" font-weight="700">Wholesaler, transport</text><text x="670" y="160" font-size="12">GDP</text>
</g>
<g stroke="#17202A" stroke-width="2" marker-end="url(#a)"><line x1="180" y1="145" x2="207" y2="145"/><line x1="360" y1="145" x2="387" y2="145"/><line x1="540" y1="145" x2="567" y2="145"/></g>
<rect x="30" y="215" width="510" height="34" rx="6" fill="#EAF6FB"/><text x="285" y="237" font-size="13" text-anchor="middle" fill="#17202A">Good Manufacturing Practice (GMP); GDP on the right</text>
<rect x="570" y="215" width="200" height="34" rx="6" fill="#FDF6DC"/><text x="670" y="237" font-size="13" text-anchor="middle" fill="#17202A">Good Distribution Practice</text>
<g font-size="13" fill="#17202A"><text x="40" y="292">Proof of compliance: an EU GMP certificate after inspection, published in EudraGMDP (Module 6).</text>
<text x="40" y="316">Legal basis: Directive (EU) 2017/1572 (GMP principles); EU GDP guidelines 2013/C 343/01.</text></g>
<text x="40" y="360" font-size="12" fill="#5B6672">One chain, two rulebooks. Every site in the dossier must comply with the right one.</text></svg>