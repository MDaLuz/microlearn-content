<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="420" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">What the QP checks before signing</text>
<text x="40" y="62" font-size="13" fill="#5B6672">EudraLex Vol. 4, Annex 16. One signature per batch, and only then can it be sold.</text>
<g font-size="13" fill="#17202A">
<rect x="40" y="90" width="330" height="40" rx="6" fill="#F5F7F9"/><text x="56" y="115">✓ Made per the marketing authorisation</text>
<rect x="40" y="136" width="330" height="40" rx="6" fill="#F5F7F9"/><text x="56" y="161">✓ Made and tested under GMP</text>
<rect x="40" y="182" width="330" height="40" rx="6" fill="#F5F7F9"/><text x="56" y="207">✓ Batch records reviewed, deviations closed</text>
<rect x="40" y="228" width="330" height="40" rx="6" fill="#F5F7F9"/><text x="56" y="253">✓ Test results within specification</text>
<rect x="40" y="274" width="330" height="40" rx="6" fill="#FBE8EF"/><text x="56" y="299">✓ Imported: full EU testing done (Module 6)</text>
<rect x="40" y="320" width="330" height="40" rx="6" fill="#F5F7F9"/><text x="56" y="345">✓ Supply chain and API GMP confirmed</text>
</g>
<rect x="470" y="170" width="260" height="110" rx="12" fill="#FBE8EF" stroke="#C2185B" stroke-width="3"/>
<text x="600" y="210" font-size="18" font-weight="700" text-anchor="middle" fill="#17202A">QP certification</text>
<text x="600" y="236" font-size="13" text-anchor="middle" fill="#17202A">recorded in a register</text><text x="600" y="256" font-size="13" text-anchor="middle" fill="#17202A">→ batch may be released</text>
<path d="M370 225 L466 225" stroke="#17202A" stroke-width="2"/>
<text x="40" y="396" font-size="12" fill="#5B6672">Directive 2001/83/EC Art. 48–51: QP qualifications, duties and batch certification. Checklist simplified.</text></svg>