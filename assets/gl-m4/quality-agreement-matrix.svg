<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="420" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Quality agreement: who does what</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Typical split for a product made in India and imported into the EU. Illustrative; agreements differ.</text>
<g font-size="13" fill="#17202A">
<rect x="30" y="80" width="740" height="34" fill="#17202A"/><g fill="#FFFFFF" font-weight="700"><text x="42" y="102">Activity</text><text x="330" y="102">Manufacturer</text><text x="480" y="102">Importer / QP</text><text x="640" y="102">MAH</text></g>
<rect x="30" y="114" width="740" height="34" fill="#F5F7F9"/><text x="42" y="136">Manufacture and in-process control</text><text x="370" y="136" font-weight="700" fill="#C2185B">R</text><text x="525" y="136">I</text><text x="650" y="136">I</text>
<rect x="30" y="148" width="740" height="34" fill="#FFFFFF"/><text x="42" y="170">Release testing in the EU</text><text x="370" y="170">I</text><text x="525" y="170" font-weight="700" fill="#C2185B">R</text><text x="650" y="170">I</text>
<rect x="30" y="182" width="740" height="34" fill="#F5F7F9"/><text x="42" y="204">QP certification</text><text x="370" y="204">I</text><text x="525" y="204" font-weight="700" fill="#C2185B">R</text><text x="650" y="204">I</text>
<rect x="30" y="216" width="740" height="34" fill="#FFFFFF"/><text x="42" y="238">Ongoing stability programme</text><text x="370" y="238" font-weight="700" fill="#C2185B">R</text><text x="525" y="238">C</text><text x="650" y="238">I</text>
<rect x="30" y="250" width="740" height="34" fill="#F5F7F9"/><text x="42" y="272">Change notification and approval</text><text x="370" y="272">C</text><text x="525" y="272">C</text><text x="650" y="272" font-weight="700" fill="#C2185B">A</text>
<rect x="30" y="284" width="740" height="34" fill="#FFFFFF"/><text x="42" y="306">Complaints and recalls</text><text x="370" y="306">C</text><text x="525" y="306">C</text><text x="650" y="306" font-weight="700" fill="#C2185B">A</text>
<rect x="30" y="318" width="740" height="34" fill="#F5F7F9"/><text x="42" y="340">Supplier and site audits</text><text x="370" y="340">I</text><text x="525" y="340" font-weight="700" fill="#C2185B">R</text><text x="650" y="340">C</text>
</g>
<text x="40" y="384" font-size="12" fill="#5B6672">R = responsible, A = accountable, C = consulted, I = informed. Required by EudraLex Vol. 4, Chapter 7.</text>
<text x="40" y="402" font-size="12" fill="#5B6672">The content of each row is industry practice.</text></svg>