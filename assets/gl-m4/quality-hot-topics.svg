<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="400" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Three quality topics you'll hear about</text>
<text x="40" y="62" font-size="13" fill="#5B6672">Each can create a gap in an in-licensed dossier, and a question during assessment.</text>
<g font-size="13" fill="#17202A">
<rect x="30" y="90" width="235" height="220" rx="12" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="48" y="122" font-size="16" font-weight="700">Nitrosamines</text>
<text x="48" y="150">Impurities that may cause</text><text x="48" y="168">cancer at very low levels.</text><text x="48" y="196">MAHs must assess the risk</text><text x="48" y="214">and test where needed,</text><text x="48" y="232">against EMA limits.</text><text x="48" y="266" font-size="12" fill="#5B6672">EMA Q&amp;A on nitrosamines;</text><text x="48" y="282" font-size="12" fill="#5B6672">Art. 5(3) review (2020)</text>
<rect x="283" y="90" width="235" height="220" rx="12" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="301" y="122" font-size="16" font-weight="700">Elemental impurities</text>
<text x="301" y="150">Metals from catalysts,</text><text x="301" y="168">equipment or excipients.</text><text x="301" y="196">A risk assessment against</text><text x="301" y="214">ICH Q3D limits is</text><text x="301" y="232">expected in Module 3.</text><text x="301" y="266" font-size="12" fill="#5B6672">ICH Q3D</text>
<rect x="536" y="90" width="235" height="220" rx="12" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/><text x="554" y="122" font-size="16" font-weight="700">Data integrity</text>
<text x="554" y="150">Records must be complete,</text><text x="554" y="168">accurate and traceable</text><text x="554" y="186">(ALCOA+).</text><text x="554" y="214">Findings at inspections</text><text x="554" y="232">can block GMP certificates.</text><text x="554" y="266" font-size="12" fill="#5B6672">EMA GMP Q&amp;A on data</text><text x="554" y="282" font-size="12" fill="#5B6672">integrity; MHRA guidance</text>
</g>
<text x="40" y="350" font-size="13" fill="#17202A">Ask for all three during gap analysis (Module 2). Missing nitrosamine assessments are a frequent blocker.</text></svg>