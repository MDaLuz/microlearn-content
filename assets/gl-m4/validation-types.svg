<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="380" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Validation: proving it works every time</text>
<text x="40" y="62" font-size="13" fill="#5B6672">EudraLex Vol. 4, Annex 15; ICH Q2(R2); EMA process validation guideline. Simplified.</text>
<g font-size="13" fill="#17202A" text-anchor="middle">
<rect x="30" y="100" width="170" height="150" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="115" y="130" font-weight="700">Equipment</text><text x="115" y="150" font-size="12">qualification</text><text x="115" y="184" font-size="12">installed correctly,</text><text x="115" y="202" font-size="12">works as specified</text>
<rect x="215" y="100" width="170" height="150" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="300" y="130" font-weight="700">Process</text><text x="300" y="150" font-size="12">validation</text><text x="300" y="184" font-size="12">consistent batches at</text><text x="300" y="202" font-size="12">commercial scale</text>
<rect x="400" y="100" width="170" height="150" rx="10" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/><text x="485" y="130" font-weight="700">Cleaning</text><text x="485" y="150" font-size="12">validation</text><text x="485" y="184" font-size="12">no carry-over to</text><text x="485" y="202" font-size="12">the next product</text>
<rect x="585" y="100" width="185" height="150" rx="10" fill="#F5F7F9" stroke="#7C8792" stroke-width="2"/><text x="677" y="130" font-weight="700">Analytical</text><text x="677" y="150" font-size="12">method validation</text><text x="677" y="184" font-size="12">the test measures</text><text x="677" y="202" font-size="12">what it should</text>
</g>
<g font-size="13" fill="#17202A"><text x="40" y="294" font-weight="700">PM angle</text>
<text x="40" y="316">For standard products, process validation on commercial-scale batches can often be completed after approval,</text>
<text x="40" y="336">but before the product is sold. Plan those batches into the launch timeline.</text></g></svg>