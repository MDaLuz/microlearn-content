<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="370" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Documenting the API: ASMF or CEP</text><text x="40" y="62" font-size="13" fill="#5B6672">Two ways to give the agency the API data (CTD 3.2.S) without the API maker revealing its secrets.</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="30" y="110" width="220" height="170" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="140.0" y="154.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">ASMF</text><text x="140.0" y="172.0" text-anchor="middle" font-size="12" fill="#17202A">Active Substance Master File</text><text x="140.0" y="190.0" text-anchor="middle" font-size="12" fill="#17202A"></text><text x="140.0" y="208.0" text-anchor="middle" font-size="12" fill="#17202A">Open part → to the MAH</text><text x="140.0" y="226.0" text-anchor="middle" font-size="12" fill="#17202A">Restricted part → only to</text><text x="140.0" y="244.0" text-anchor="middle" font-size="12" fill="#17202A">the agency, confidential</text><rect x="290" y="110" width="220" height="170" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="400.0" y="154.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">CEP</text><text x="400.0" y="172.0" text-anchor="middle" font-size="12" fill="#17202A">Certificate of Suitability</text><text x="400.0" y="190.0" text-anchor="middle" font-size="12" fill="#17202A">(EDQM)</text><text x="400.0" y="208.0" text-anchor="middle" font-size="12" fill="#17202A"></text><text x="400.0" y="226.0" text-anchor="middle" font-size="12" fill="#17202A">EDQM has already assessed</text><text x="400.0" y="244.0" text-anchor="middle" font-size="12" fill="#17202A">the API vs Ph. Eur.</text><rect x="550" y="110" width="220" height="170" rx="10" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/><text x="660.0" y="154.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">In the dossier</text><text x="660.0" y="172.0" text-anchor="middle" font-size="12" fill="#17202A"></text><text x="660.0" y="190.0" text-anchor="middle" font-size="12" fill="#17202A">ASMF: open part +</text><text x="660.0" y="208.0" text-anchor="middle" font-size="12" fill="#17202A">letter of access</text><text x="660.0" y="226.0" text-anchor="middle" font-size="12" fill="#17202A"></text><text x="660.0" y="244.0" text-anchor="middle" font-size="12" fill="#17202A">CEP: copy of the certificate</text><text x="40" y="320" font-size="13" fill="#17202A">Either way the API maker must notify changes, and the MAH needs proof of API GMP (audit, QP declaration).</text><text x="40" y="345" font-size="13" fill="#5B6672">Sources: EMA guideline on the ASMF procedure; EDQM certification of suitability; EudraLex Vol. 4 Part II.</text></svg>