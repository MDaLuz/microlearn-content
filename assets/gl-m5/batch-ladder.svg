<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="430" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Batch types: a ladder to commercial supply</text><text x="40" y="62" font-size="13" fill="#5B6672">Sizes and names vary; the sequence is typical.</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="40" y="330" width="420" height="44" rx="8" fill="#F5F7F9" stroke="#7C8792" stroke-width="2"/><text x="56" y="350" font-size="14" font-weight="700" fill="#17202A">Development batches</text><text x="56" y="367" font-size="12" fill="#17202A">lab scale, formulation work</text><rect x="100" y="275" width="420" height="44" rx="8" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="116" y="295" font-size="14" font-weight="700" fill="#17202A">Exhibit / biobatch</text><text x="116" y="312" font-size="12" fill="#17202A">≥ 1/10 of production scale or 100,000 units; used for BE</text><rect x="160" y="220" width="420" height="44" rx="8" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="176" y="240" font-size="14" font-weight="700" fill="#17202A">Stability batches</text><text x="176" y="257" font-size="12" fill="#17202A">registration stability programme</text><rect x="220" y="165" width="420" height="44" rx="8" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="236" y="185" font-size="14" font-weight="700" fill="#17202A">Validation batches</text><text x="236" y="202" font-size="12" fill="#17202A">commercial scale; often also launch stock</text><rect x="280" y="110" width="420" height="44" rx="8" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/><text x="296" y="130" font-size="14" font-weight="700" fill="#17202A">Commercial batches</text><text x="296" y="147" font-size="12" fill="#17202A">routine supply</text><text x="40" y="410" font-size="13" fill="#5B6672">Biobatch size: EMA bioequivalence guideline (≥ 1/10 of production scale or 100,000 units, whichever is greater).</text></svg>