<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="300" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Packaging operations</text><text x="40" y="62" font-size="13" fill="#5B6672">From bulk tablets to a finished, coded, serialised pack (illustrative).</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="30" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="97.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Blister</text><text x="97.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">forming + sealing</text><text x="97.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">(PVC/PVDC or Alu/Alu)</text><line x1="165" y1="160" x2="179" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="180" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="247.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Coding</text><text x="247.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">batch number,</text><text x="247.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">expiry date</text><line x1="315" y1="160" x2="329" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="397.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Cartoning</text><text x="397.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">blister + PIL</text><text x="397.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">into the carton</text><line x1="465" y1="160" x2="479" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="480" y="110" width="135" height="100" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="547.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Serialise</text><text x="547.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">2D code + seal</text><text x="547.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">(FMD, Module 8)</text><line x1="615" y1="160" x2="629" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="110" width="135" height="100" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="697.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Case packing</text><text x="697.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">shipper cases,</text><text x="697.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">pallet</text><text x="40" y="250" font-size="13" fill="#17202A">Each country usually needs its own pack: language, Blue Box, pack size, and its own artwork version (Module 8).</text><text x="40" y="274" font-size="13" fill="#17202A">Packaging lines are validated, and line clearance between batches prevents mix-ups.</text></svg>