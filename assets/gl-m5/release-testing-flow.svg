<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="300" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">From last test to first shipment</text><text x="40" y="62" font-size="13" fill="#5B6672">Release of a batch made in India for the EU (detail in Module 6).</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="30" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="97.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">QC testing</text><text x="97.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">at the</text><text x="97.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">manufacturer</text><line x1="165" y1="160" x2="179" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="180" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="247.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Ship to EU</text><text x="247.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">importer</text><text x="247.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">(Module 6)</text><line x1="315" y1="160" x2="329" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="397.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">EU testing</text><text x="397.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">full analysis</text><text x="397.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">on import</text><line x1="465" y1="160" x2="479" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="480" y="110" width="135" height="100" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="547.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">QP review</text><text x="547.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">records + results</text><text x="547.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">→ certification</text><line x1="615" y1="160" x2="629" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="697.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Released</text><text x="697.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">available</text><text x="697.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">to ship</text><text x="40" y="250" font-size="13" fill="#17202A">Each step takes time: testing days, transport, EU retesting and QP review add up to weeks.</text><text x="40" y="274" font-size="13" fill="#17202A">The CoA from each test site is one of the QP's key inputs (Module 4).</text></svg>