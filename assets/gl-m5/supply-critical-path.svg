<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="380" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Supply critical path to launch</text><text x="40" y="62" font-size="13" fill="#5B6672">Recap of Module 5: the chain that must be ready on launch day (illustrative order).</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="30" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="97.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">API</text><text x="97.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">ASMF/CEP OK,</text><text x="97.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">GMP confirmed</text><line x1="165" y1="160" x2="179" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="180" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="247.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Validation</text><text x="247.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">batches</text><text x="247.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">made</text><line x1="315" y1="160" x2="329" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="397.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Packed</text><text x="397.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">in country</text><text x="397.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">artwork</text><line x1="465" y1="160" x2="479" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="480" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="547.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">EU</text><text x="547.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">testing +</text><text x="547.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">QP release</text><line x1="615" y1="160" x2="629" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="110" width="135" height="100" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="697.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Launch</text><text x="697.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">stock at</text><text x="697.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">wholesaler</text><text x="40" y="250" font-size="14" font-weight="700" fill="#17202A">Questions to ask every month</text><text x="40" y="276" font-size="13" fill="#17202A">1. Is the API ordered, and is its documentation current?</text><text x="40" y="298" font-size="13" fill="#17202A">2. Are validation batches scheduled, and is the stability data sufficient?</text><text x="40" y="320" font-size="13" fill="#17202A">3. Is the country artwork approved, and is packaging material ordered?</text><text x="40" y="342" font-size="13" fill="#17202A">4. Is the import testing slot booked, and is the QP briefed?</text></svg>