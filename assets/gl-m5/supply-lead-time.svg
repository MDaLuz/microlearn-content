<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="440" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Supply lead time: why launch stock is ordered early</text><text x="40" y="62" font-size="13" fill="#5B6672">Illustrative durations in weeks; real ones come from the supply agreement and the manufacturer's plan.</text><text x="40" y="117" font-size="13" fill="#17202A">API procurement</text><rect x="220" y="100" width="180" height="24" rx="4" fill="#0089BF" stroke="none"/><text x="40" y="153" font-size="13" fill="#17202A">Manufacturing slot</text><rect x="364" y="136" width="72" height="24" rx="4" fill="#0089BF" stroke="none"/><text x="40" y="189" font-size="13" fill="#17202A">Manufacture + QC</text><rect x="436" y="172" width="72" height="24" rx="4" fill="#0089BF" stroke="none"/><text x="40" y="225" font-size="13" fill="#17202A">Packaging</text><rect x="508" y="208" width="36" height="24" rx="4" fill="#0089BF" stroke="none"/><text x="40" y="261" font-size="13" fill="#17202A">Shipping to EU</text><rect x="544" y="244" width="54" height="24" rx="4" fill="#E8B400" stroke="none"/><text x="40" y="297" font-size="13" fill="#17202A">EU testing + QP</text><rect x="598" y="280" width="72" height="24" rx="4" fill="#C2185B" stroke="none"/><text x="40" y="333" font-size="13" fill="#17202A">Distribution</text><rect x="670" y="316" width="36" height="24" rx="4" fill="#E8B400" stroke="none"/><line x1="220" y1="360" x2="760" y2="360" stroke="#17202A" stroke-width="2"/><text x="216" y="378" font-size="11" fill="#5B6672">0</text><text x="306" y="378" font-size="11" fill="#5B6672">5</text><text x="396" y="378" font-size="11" fill="#5B6672">10</text><text x="486" y="378" font-size="11" fill="#5B6672">15</text><text x="576" y="378" font-size="11" fill="#5B6672">20</text><text x="666" y="378" font-size="11" fill="#5B6672">25</text><text x="756" y="378" font-size="11" fill="#5B6672">30</text><text x="40" y="400" font-size="13" fill="#17202A">weeks → about 6 months from API order to stock in the market, in this example</text><text x="40" y="424" font-size="13" fill="#5B6672">Watch: minimum order quantities, batch size, forecasts and safety stock in the supply agreement.</text></svg>