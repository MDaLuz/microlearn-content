<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="330" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">From powder to tablet</text><text x="40" y="62" font-size="13" fill="#5B6672">Typical steps for a film-coated tablet (illustrative; processes differ by product).</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="30" y="110" width="110" height="90" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="85.0" y="141.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Dispense</text><text x="85.0" y="159.0" text-anchor="middle" font-size="12" fill="#17202A">weigh raw</text><text x="85.0" y="177.0" text-anchor="middle" font-size="12" fill="#17202A">materials</text><line x1="140" y1="155" x2="154" y2="155" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="155" y="110" width="110" height="90" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="210.0" y="141.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Blend /</text><text x="210.0" y="159.0" text-anchor="middle" font-size="12" fill="#17202A">granulate</text><text x="210.0" y="177.0" text-anchor="middle" font-size="12" fill="#17202A">(wet or dry)</text><line x1="265" y1="155" x2="279" y2="155" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="110" width="110" height="90" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="335.0" y="150.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Dry and</text><text x="335.0" y="168.0" text-anchor="middle" font-size="12" fill="#17202A">mill</text><line x1="390" y1="155" x2="404" y2="155" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="405" y="110" width="110" height="90" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="460.0" y="150.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Final blend</text><text x="460.0" y="168.0" text-anchor="middle" font-size="12" fill="#17202A">+ lubricant</text><line x1="515" y1="155" x2="529" y2="155" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="530" y="110" width="110" height="90" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="585.0" y="150.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Compress</text><text x="585.0" y="168.0" text-anchor="middle" font-size="12" fill="#17202A">tablet press</text><line x1="640" y1="155" x2="654" y2="155" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="655" y="110" width="110" height="90" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="710.0" y="150.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Coat</text><text x="710.0" y="168.0" text-anchor="middle" font-size="12" fill="#17202A">film coating</text><rect x="30" y="230" width="735" height="36" rx="8" fill="#FDF6DC" stroke="#E8B400"/><text x="397" y="253" font-size="13" text-anchor="middle" fill="#17202A">In-process controls at each step: weight, hardness, thickness, friability, moisture</text><text x="40" y="300" font-size="13" fill="#17202A">Then: bulk tablets → packaging (Lesson 4) → testing and QP release (Lesson 5).</text></svg>