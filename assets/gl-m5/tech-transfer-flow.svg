<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="300" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Moving production: technology transfer</text><text x="40" y="62" font-size="13" fill="#5B6672">From the current site to a new one: a project in its own right (illustrative).</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="30" y="110" width="110" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="85.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Transfer</text><text x="85.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">package:</text><text x="85.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">process, methods</text><line x1="140" y1="160" x2="154" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="155" y="110" width="110" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="210.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Trial batches</text><text x="210.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">at the</text><text x="210.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">new site</text><line x1="265" y1="160" x2="279" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="110" width="110" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="335.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Validation</text><text x="335.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">+ stability</text><text x="335.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">at new site</text><line x1="390" y1="160" x2="404" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="405" y="110" width="110" height="100" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="460.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Variation</text><text x="460.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">new site in</text><text x="460.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">the licence</text><line x1="515" y1="160" x2="529" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="530" y="110" width="110" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="585.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">GMP status</text><text x="585.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">certificate</text><text x="585.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">for new site</text><line x1="640" y1="160" x2="654" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="655" y="110" width="110" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="710.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Switch</text><text x="710.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">supply from</text><text x="710.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">new site</text><text x="40" y="250" font-size="13" fill="#17202A">Typically months to years. Stability data from the new site and the variation are usually the longest poles.</text><text x="40" y="274" font-size="13" fill="#17202A">Don't plan a launch on a site that isn't yet in the licence.</text></svg>