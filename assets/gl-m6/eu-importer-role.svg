<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="380" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">The EU importer: the product's front door</text><text x="40" y="62" font-size="13" fill="#5B6672">An EU site holding a manufacturing and importation authorisation (MIA).</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="290" y="100" width="220" height="90" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="400.0" y="131.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">EU importer (MIA)</text><text x="400.0" y="149.0" text-anchor="middle" font-size="12" fill="#17202A">named in the marketing</text><text x="400.0" y="167.0" text-anchor="middle" font-size="12" fill="#17202A">authorisation</text><rect x="40" y="230" width="170" height="70" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="125.0" y="260.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Physical import</text><text x="125.0" y="278.0" text-anchor="middle" font-size="12" fill="#17202A">receives the goods</text><line x1="400" y1="190" x2="125" y2="230" stroke="#17202A" stroke-width="2"/><rect x="230" y="230" width="170" height="70" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="315.0" y="260.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Storage</text><text x="315.0" y="278.0" text-anchor="middle" font-size="12" fill="#17202A">under GMP/GDP</text><line x1="400" y1="190" x2="315" y2="230" stroke="#17202A" stroke-width="2"/><rect x="420" y="230" width="170" height="70" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="505.0" y="260.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Testing</text><text x="505.0" y="278.0" text-anchor="middle" font-size="12" fill="#17202A">own or contract lab</text><line x1="400" y1="190" x2="505" y2="230" stroke="#17202A" stroke-width="2"/><rect x="610" y="230" width="170" height="70" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="695.0" y="260.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">QP certification</text><text x="695.0" y="278.0" text-anchor="middle" font-size="12" fill="#17202A">batch release site</text><line x1="400" y1="190" x2="695" y2="230" stroke="#17202A" stroke-width="2"/><text x="40" y="340" font-size="13" fill="#17202A">Often an outsourced service (a contract importer with its own QP), bound by a quality agreement (Module 4).</text><text x="40" y="362" font-size="13" fill="#5B6672">The site must be in the dossier; changing it later needs a variation.</text></svg>