<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 405" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="405" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Where import timelines slip, and the buffers to plan</text><text x="40" y="62" font-size="13" fill="#5B6672">Illustrative; build real buffers from your own history with each partner.</text><rect x="40" y="86" width="720" height="32" fill="#17202A"/><text x="52" y="107" font-size="13" font-weight="700" fill="#FFFFFF">Risk</text><text x="560" y="107" font-size="13" font-weight="700" fill="#FFFFFF">Typical delay</text><rect x="40" y="118" width="720" height="36" fill="#FBE8EF"/><text x="52" y="141" font-size="13" fill="#17202A">Site GMP inspection or a non-compliance statement</text><text x="560" y="141" font-size="13" fill="#17202A">months</text><rect x="40" y="154" width="720" height="36" fill="#FBE8EF"/><text x="52" y="177" font-size="13" fill="#17202A">Written confirmation expired or missing</text><text x="560" y="177" font-size="13" fill="#17202A">weeks to months</text><rect x="40" y="190" width="720" height="36" fill="#FDF6DC"/><text x="52" y="213" font-size="13" fill="#17202A">EU import testing capacity</text><text x="560" y="213" font-size="13" fill="#17202A">1–4 weeks</text><rect x="40" y="226" width="720" height="36" fill="#FDF6DC"/><text x="52" y="249" font-size="13" fill="#17202A">Missing or inconsistent documents</text><text x="560" y="249" font-size="13" fill="#17202A">days to weeks</text><rect x="40" y="262" width="720" height="36" fill="#EAF6FB"/><text x="52" y="285" font-size="13" fill="#17202A">Customs or transport problems</text><text x="560" y="285" font-size="13" fill="#17202A">days to weeks</text><rect x="40" y="298" width="720" height="36" fill="#EAF6FB"/><text x="52" y="321" font-size="13" fill="#17202A">Temperature excursion investigation</text><text x="560" y="321" font-size="13" fill="#17202A">days to weeks</text><text x="40" y="366" font-size="13" fill="#17202A">Plan: check GMP and written-confirmation validity before each order;</text><text x="40" y="386" font-size="13" fill="#17202A">pre-book EU testing; agree a document checklist with the manufacturer.</text></svg>