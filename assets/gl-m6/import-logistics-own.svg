<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="390" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Logistics: getting the goods to the EU importer</text><text x="40" y="62" font-size="13" fill="#5B6672">Typical considerations (practice; durations illustrative).</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="40" y="100" width="330" height="120" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="205.0" y="137.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Sea freight</text><text x="205.0" y="155.0" text-anchor="middle" font-size="12" fill="#17202A">weeks in transit</text><text x="205.0" y="173.0" text-anchor="middle" font-size="12" fill="#17202A">lower cost</text><text x="205.0" y="191.0" text-anchor="middle" font-size="12" fill="#17202A">temperature control needed</text><rect x="430" y="100" width="330" height="120" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="595.0" y="137.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Air freight</text><text x="595.0" y="155.0" text-anchor="middle" font-size="12" fill="#17202A">days in transit</text><text x="595.0" y="173.0" text-anchor="middle" font-size="12" fill="#17202A">higher cost</text><text x="595.0" y="191.0" text-anchor="middle" font-size="12" fill="#17202A">common for launch stock</text><text x="40" y="262" font-size="14" font-weight="700" fill="#17202A">Along the way</text><text x="40" y="288" font-size="13" fill="#17202A">• GDP: validated transport, temperature monitoring with data loggers</text><text x="40" y="310" font-size="13" fill="#17202A">• Customs clearance at EU entry, with the importer as consignee</text><text x="40" y="332" font-size="13" fill="#17202A">• Temperature excursion? The QP must assess it before release</text><text x="40" y="354" font-size="13" fill="#17202A">• Documents travel with the goods: CoA, packing list, temperature records</text></svg>