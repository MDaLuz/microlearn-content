<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 375" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="375" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">From an Indian plant to an EU pharmacy</text><text x="40" y="62" font-size="13" fill="#5B6672">The import route for a finished product made outside the EU (simplified).</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="30" y="110" width="110" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="85.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Plant in India</text><text x="85.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">manufacture,</text><text x="85.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">QC, CoA</text><line x1="140" y1="160" x2="154" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="155" y="110" width="110" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="210.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Shipping</text><text x="210.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">sea or air,</text><text x="210.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">GDP conditions</text><line x1="265" y1="160" x2="279" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="110" width="110" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="335.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">EU importer</text><text x="335.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">MIA holder:</text><text x="335.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">receipt, storage</text><line x1="390" y1="160" x2="404" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="405" y="110" width="110" height="100" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="460.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">EU testing</text><text x="460.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">full analysis</text><text x="460.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">(no MRA)</text><line x1="515" y1="160" x2="529" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="530" y="110" width="110" height="100" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="585.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">QP</text><text x="585.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">certifies</text><text x="585.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">the batch</text><line x1="640" y1="160" x2="654" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="655" y="110" width="110" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="710.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Market</text><text x="710.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">wholesaler →</text><text x="710.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">pharmacy</text><rect x="255" y="240" width="410" height="36" rx="8" fill="#FBE8EF" stroke="#C2185B"/><text x="460" y="263" font-size="13" text-anchor="middle" fill="#17202A">The EU-only steps that make third-country imports different</text><text x="40" y="310" font-size="13" fill="#17202A">A 'third country' is any country outside the EU/EEA. India is a third country</text><text x="40" y="330" font-size="13" fill="#17202A">without a mutual recognition agreement (MRA) with the EU.</text><text x="40" y="354" font-size="13" fill="#5B6672">Directive 2001/83/EC Art. 40(3) (importation authorisation), Art. 51 (testing and QP certification).</text></svg>