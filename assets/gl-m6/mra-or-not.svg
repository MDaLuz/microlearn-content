<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="400" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Why there's no shortcut for India: the MRA question</text><text x="40" y="62" font-size="13" fill="#5B6672">Directive 2001/83/EC Art. 51(1)(b) and 51(2). Simplified.</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><text x="40" y="104" font-size="15" font-weight="700" fill="#0089BF">With an MRA (e.g. US, Japan, Canada, Switzerland)</text><rect x="40" y="118" width="200" height="64" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="140.0" y="145.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Made + tested</text><text x="140.0" y="163.0" text-anchor="middle" font-size="12" fill="#17202A">in partner country</text><line x1="240" y1="150" x2="266" y2="150" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="118" width="200" height="64" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="380.0" y="145.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Partner's batch</text><text x="380.0" y="163.0" text-anchor="middle" font-size="12" fill="#17202A">certificate accepted</text><line x1="480" y1="150" x2="506" y2="150" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="520" y="118" width="200" height="64" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="620.0" y="145.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">QP certifies</text><text x="620.0" y="163.0" text-anchor="middle" font-size="12" fill="#17202A">without full re-test</text><text x="40" y="228" font-size="15" font-weight="700" fill="#C2185B">Without an MRA (e.g. India)</text><rect x="40" y="242" width="200" height="64" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="140.0" y="269.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Made + tested</text><text x="140.0" y="287.0" text-anchor="middle" font-size="12" fill="#17202A">in India</text><line x1="240" y1="274" x2="266" y2="274" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="242" width="200" height="64" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="380.0" y="269.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Full EU analysis</text><text x="380.0" y="287.0" text-anchor="middle" font-size="12" fill="#17202A">on every batch</text><line x1="480" y1="274" x2="506" y2="274" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="520" y="242" width="200" height="64" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="620.0" y="269.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">QP certifies</text><text x="620.0" y="287.0" text-anchor="middle" font-size="12" fill="#17202A">after EU results</text><text x="40" y="342" font-size="12" fill="#17202A">Full analysis = full qualitative analysis, quantitative analysis of at least all active substances,</text><text x="40" y="358" font-size="12" fill="#17202A">and all other tests the licence requires.</text><text x="40" y="380" font-size="13" fill="#5B6672">MRA list illustrative; check the current EU list for any given country.</text></svg>