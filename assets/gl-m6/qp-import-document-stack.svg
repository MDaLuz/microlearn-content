<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="440" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">What the QP needs for an imported batch</text><text x="40" y="62" font-size="13" fill="#5B6672">A typical document stack (EudraLex Vol. 4, Annex 16). Each missing item can hold up release.</text><rect x="60" y="90" width="420" height="32" rx="6" fill="#F5F7F9" stroke="#7C8792"/><text x="76" y="111" font-size="13" fill="#17202A">Manufacturer's batch certificate / CoA</text><rect x="66" y="128" width="420" height="32" rx="6" fill="#F5F7F9" stroke="#7C8792"/><text x="82" y="149" font-size="13" fill="#17202A">Batch record review (or summary)</text><rect x="72" y="166" width="420" height="32" rx="6" fill="#FBE8EF" stroke="#7C8792"/><text x="88" y="187" font-size="13" fill="#17202A">EU import test results</text><rect x="78" y="204" width="420" height="32" rx="6" fill="#F5F7F9" stroke="#7C8792"/><text x="94" y="225" font-size="13" fill="#17202A">Transport conditions (temperature log)</text><rect x="84" y="242" width="420" height="32" rx="6" fill="#F5F7F9" stroke="#7C8792"/><text x="100" y="263" font-size="13" fill="#17202A">GMP status of every site (EudraGMDP)</text><rect x="90" y="280" width="420" height="32" rx="6" fill="#FBE8EF" stroke="#7C8792"/><text x="106" y="301" font-size="13" fill="#17202A">API: written confirmation + GMP declaration</text><rect x="96" y="318" width="420" height="32" rx="6" fill="#F5F7F9" stroke="#7C8792"/><text x="112" y="339" font-size="13" fill="#17202A">Deviations closed or assessed</text><rect x="102" y="356" width="420" height="32" rx="6" fill="#F5F7F9" stroke="#7C8792"/><text x="118" y="377" font-size="13" fill="#17202A">Compliance with the marketing authorisation</text><rect x="560" y="180" width="200" height="110" rx="12" fill="#FBE8EF" stroke="#C2185B" stroke-width="3"/><text x="660" y="225" font-size="17" font-weight="700" text-anchor="middle" fill="#17202A">QP</text><text x="660" y="250" font-size="13" text-anchor="middle" fill="#17202A">certification</text><text x="660" y="270" font-size="13" text-anchor="middle" fill="#17202A">→ release</text><text x="40" y="420" font-size="13" fill="#5B6672">Pink items are specific to imports from a country without an MRA.</text></svg>