<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="380" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Importing the API: written confirmation</text><text x="40" y="62" font-size="13" fill="#5B6672">Directive 2001/83/EC Art. 46b (introduced by the Falsified Medicines Directive, 2011/62/EU).</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="40" y="100" width="200" height="90" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="140.0" y="140.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">API site in India</text><text x="140.0" y="158.0" text-anchor="middle" font-size="12" fill="#17202A">makes the API</text><rect x="300" y="100" width="200" height="90" rx="10" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/><text x="400.0" y="131.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Indian authority</text><text x="400.0" y="149.0" text-anchor="middle" font-size="12" fill="#17202A">issues a written</text><text x="400.0" y="167.0" text-anchor="middle" font-size="12" fill="#17202A">confirmation</text><rect x="560" y="100" width="200" height="90" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="660.0" y="131.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">EU</text><text x="660.0" y="149.0" text-anchor="middle" font-size="12" fill="#17202A">API may be</text><text x="660.0" y="167.0" text-anchor="middle" font-size="12" fill="#17202A">imported</text><line x1="240" y1="145" x2="296" y2="145" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><line x1="500" y1="145" x2="556" y2="145" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><text x="40" y="232" font-size="14" font-weight="700" fill="#17202A">What it confirms</text><text x="40" y="258" font-size="13" fill="#17202A">• GMP at the API site is at least equivalent to EU standards</text><text x="40" y="280" font-size="13" fill="#17202A">• The site is regularly inspected and controlled</text><text x="40" y="302" font-size="13" fill="#17202A">• The authority will tell the EU about serious non-compliance</text><text x="40" y="340" font-size="13" fill="#17202A">Not needed for countries on the EU 'equivalence list' (Art. 111b); India isn't on it.</text><text x="40" y="362" font-size="13" fill="#5B6672">It's specific to each API and site, and has an expiry date: track it like a licence.</text></svg>