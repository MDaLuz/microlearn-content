<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 395" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="395" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">The carton, face by face</text><text x="40" y="62" font-size="13" fill="#5B6672">What a typical EU carton carries (illustrative layout, not real artwork).</text><rect x="60" y="100" width="240" height="220" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="180" y="140" font-size="15" font-weight="700" text-anchor="middle" fill="#17202A">Front</text><text x="180" y="170" font-size="12" text-anchor="middle" fill="#17202A">name, strength, form</text><text x="180" y="190" font-size="12" text-anchor="middle" fill="#17202A">active substance</text><text x="180" y="210" font-size="12" text-anchor="middle" fill="#17202A">pack size</text><text x="180" y="230" font-size="12" text-anchor="middle" fill="#17202A">Braille (name)</text><rect x="300" y="100" width="90" height="220" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/><text x="345" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#17202A">Side</text><text x="345" y="170" font-size="11" text-anchor="middle" fill="#17202A">batch,</text><text x="345" y="186" font-size="11" text-anchor="middle" fill="#17202A">expiry,</text><text x="345" y="202" font-size="11" text-anchor="middle" fill="#17202A">2D code</text><rect x="390" y="100" width="240" height="220" fill="#F5F7F9" stroke="#7C8792" stroke-width="2"/><text x="510" y="140" font-size="15" font-weight="700" text-anchor="middle" fill="#17202A">Back</text><text x="510" y="170" font-size="12" text-anchor="middle" fill="#17202A">excipients with known effect</text><text x="510" y="190" font-size="12" text-anchor="middle" fill="#17202A">storage, MAH, licence no.</text><text x="510" y="210" font-size="12" text-anchor="middle" fill="#17202A">Blue Box (national info)</text><rect x="630" y="100" width="90" height="220" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="675" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#17202A">Flaps</text><text x="675" y="170" font-size="11" text-anchor="middle" fill="#17202A">tamper-</text><text x="675" y="186" font-size="11" text-anchor="middle" fill="#17202A">evident</text><text x="675" y="202" font-size="11" text-anchor="middle" fill="#17202A">seal</text><text x="40" y="356" font-size="12" fill="#17202A">Required particulars: Directive 2001/83/EC Art. 54; Braille: Art. 56a; safety features: Delegated Regulation (EU) 2016/161.</text><text x="40" y="376" font-size="12" fill="#5B6672">Exact placement varies; Module 8 covers artwork in depth.</text></svg>