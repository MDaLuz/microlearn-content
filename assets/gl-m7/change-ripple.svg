<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="430" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">One change, many ripples</text><text x="40" y="62" font-size="13" fill="#5B6672">Example: the blister film supplier changes (illustrative).</text><line x1="400" y1="220" x2="210" y2="150" stroke="#17202A" stroke-width="2" stroke-dasharray="5 4"/><line x1="400" y1="220" x2="660" y2="150" stroke="#17202A" stroke-width="2" stroke-dasharray="5 4"/><line x1="400" y1="220" x2="210" y2="320" stroke="#17202A" stroke-width="2" stroke-dasharray="5 4"/><line x1="400" y1="220" x2="660" y2="320" stroke="#17202A" stroke-width="2" stroke-dasharray="5 4"/><circle cx="400" cy="220" r="70" fill="#FBE8EF" stroke="#C2185B" stroke-width="3"/><text x="400" y="214" font-size="15" font-weight="700" text-anchor="middle" fill="#17202A">New blister</text><text x="400" y="234" font-size="15" font-weight="700" text-anchor="middle" fill="#17202A">film supplier</text><rect x="110" y="110" width="200" height="80" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="210.0" y="136.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">QA</text><text x="210.0" y="154.0" text-anchor="middle" font-size="12" fill="#17202A">change control,</text><text x="210.0" y="172.0" text-anchor="middle" font-size="12" fill="#17202A">supplier qualification</text><rect x="560" y="110" width="200" height="80" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="660.0" y="136.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">RA</text><text x="660.0" y="154.0" text-anchor="middle" font-size="12" fill="#17202A">variation?</text><text x="660.0" y="172.0" text-anchor="middle" font-size="12" fill="#17202A">(depends on change)</text><rect x="110" y="280" width="200" height="80" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="210.0" y="306.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Stability</text><text x="210.0" y="324.0" text-anchor="middle" font-size="12" fill="#17202A">new data if</text><text x="210.0" y="342.0" text-anchor="middle" font-size="12" fill="#17202A">protection changes</text><rect x="560" y="280" width="200" height="80" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="660.0" y="306.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Supply + artwork</text><text x="660.0" y="324.0" text-anchor="middle" font-size="12" fill="#17202A">new material,</text><text x="660.0" y="342.0" text-anchor="middle" font-size="12" fill="#17202A">codes, maybe artwork</text><text x="40" y="410" font-size="13" fill="#17202A">Ask with every change: who else does this touch, and what has to be approved before we use it?</text></svg>