<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="330" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">When a device is part of the product</text><text x="40" y="62" font-size="13" fill="#5B6672">Most oral generics have none; some products include one (illustrative).</text><rect x="40" y="100" width="330" height="150" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="205.0" y="134.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Separate device</text><text x="205.0" y="152.0" text-anchor="middle" font-size="12" fill="#17202A">e.g. a measuring cup or oral syringe</text><text x="205.0" y="170.0" text-anchor="middle" font-size="12" fill="#17202A">in the box</text><text x="205.0" y="188.0" text-anchor="middle" font-size="12" fill="#17202A"></text><text x="205.0" y="206.0" text-anchor="middle" font-size="12" fill="#17202A">CE-marked on its own under</text><text x="205.0" y="224.0" text-anchor="middle" font-size="12" fill="#17202A">the medical devices rules</text><rect x="430" y="100" width="330" height="150" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="595.0" y="134.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Integral device</text><text x="595.0" y="152.0" text-anchor="middle" font-size="12" fill="#17202A">e.g. a pre-filled pen or inhaler</text><text x="595.0" y="170.0" text-anchor="middle" font-size="12" fill="#17202A">forming one product with the medicine</text><text x="595.0" y="188.0" text-anchor="middle" font-size="12" fill="#17202A"></text><text x="595.0" y="206.0" text-anchor="middle" font-size="12" fill="#17202A">the licence needs a notified-body</text><text x="595.0" y="224.0" text-anchor="middle" font-size="12" fill="#17202A">opinion on the device part</text><text x="40" y="292" font-size="12" fill="#17202A">EU Medical Device Regulation (EU) 2017/745, Art. 117 (integral drug–device combinations).</text><text x="40" y="312" font-size="12" fill="#5B6672">For the PM: a device adds a supplier, a specification and a regulatory step.</text></svg>