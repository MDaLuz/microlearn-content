<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="410" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Anatomy of a finished pack</text><text x="40" y="62" font-size="13" fill="#5B6672">What's in the box (tablet product, illustrative). Each part has its own supplier and specification.</text><rect x="40" y="110" width="170" height="120" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="125.0" y="156.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Tablets</text><text x="125.0" y="174.0" text-anchor="middle" font-size="12" fill="#17202A">API + excipients</text><text x="125.0" y="192.0" text-anchor="middle" font-size="12" fill="#17202A">(Lesson 2)</text><rect x="230" y="110" width="170" height="120" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="315.0" y="156.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Blister</text><text x="315.0" y="174.0" text-anchor="middle" font-size="12" fill="#17202A">film + foil</text><text x="315.0" y="192.0" text-anchor="middle" font-size="12" fill="#17202A">(primary, Lesson 3)</text><rect x="420" y="110" width="170" height="120" rx="10" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/><text x="505.0" y="156.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Leaflet (PIL)</text><text x="505.0" y="174.0" text-anchor="middle" font-size="12" fill="#17202A">patient</text><text x="505.0" y="192.0" text-anchor="middle" font-size="12" fill="#17202A">information</text><rect x="610" y="110" width="150" height="120" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="685.0" y="156.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Carton</text><text x="685.0" y="174.0" text-anchor="middle" font-size="12" fill="#17202A">secondary pack</text><text x="685.0" y="192.0" text-anchor="middle" font-size="12" fill="#17202A">(Lesson 4)</text><rect x="610" y="250" width="150" height="80" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="685.0" y="276.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Safety features</text><text x="685.0" y="294.0" text-anchor="middle" font-size="12" fill="#17202A">2D code + seal</text><text x="685.0" y="312.0" text-anchor="middle" font-size="12" fill="#17202A">(Module 8)</text><rect x="230" y="250" width="170" height="80" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="315.0" y="276.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">or: bottle</text><text x="315.0" y="294.0" text-anchor="middle" font-size="12" fill="#17202A">+ closure</text><text x="315.0" y="312.0" text-anchor="middle" font-size="12" fill="#17202A">+ desiccant</text><text x="40" y="370" font-size="13" fill="#17202A">Primary packaging touches the product; secondary doesn't. That drives how strictly each is controlled.</text><text x="40" y="392" font-size="13" fill="#5B6672">Directive 2001/83/EC Art. 54 (outer packaging), Art. 55 (blisters), Art. 59 (PIL).</text></svg>