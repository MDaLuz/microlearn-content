<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="345" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Primary packaging: what touches the product</text><text x="40" y="62" font-size="13" fill="#5B6672">Common options for tablets (illustrative). The registered pack is the one the stability data support.</text><rect x="40" y="100" width="220" height="140" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="150.0" y="129.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">PVC or PVC/PVDC</text><text x="150.0" y="147.0" text-anchor="middle" font-size="12" fill="#17202A">blister</text><text x="150.0" y="165.0" text-anchor="middle" font-size="12" fill="#17202A"></text><text x="150.0" y="183.0" text-anchor="middle" font-size="12" fill="#17202A">clear film + foil</text><text x="150.0" y="201.0" text-anchor="middle" font-size="12" fill="#17202A">moderate moisture</text><text x="150.0" y="219.0" text-anchor="middle" font-size="12" fill="#17202A">protection</text><rect x="290" y="100" width="220" height="140" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="400.0" y="129.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Alu/Alu blister</text><text x="400.0" y="147.0" text-anchor="middle" font-size="12" fill="#17202A">(cold-form)</text><text x="400.0" y="165.0" text-anchor="middle" font-size="12" fill="#17202A"></text><text x="400.0" y="183.0" text-anchor="middle" font-size="12" fill="#17202A">high moisture and</text><text x="400.0" y="201.0" text-anchor="middle" font-size="12" fill="#17202A">light protection</text><text x="400.0" y="219.0" text-anchor="middle" font-size="12" fill="#17202A"></text><rect x="540" y="100" width="220" height="140" rx="10" fill="#FDF6DC" stroke="#E8B400" stroke-width="2"/><text x="650.0" y="129.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">HDPE bottle</text><text x="650.0" y="147.0" text-anchor="middle" font-size="12" fill="#17202A">+ closure</text><text x="650.0" y="165.0" text-anchor="middle" font-size="12" fill="#17202A"></text><text x="650.0" y="183.0" text-anchor="middle" font-size="12" fill="#17202A">often with a desiccant;</text><text x="650.0" y="201.0" text-anchor="middle" font-size="12" fill="#17202A">may be</text><text x="650.0" y="219.0" text-anchor="middle" font-size="12" fill="#17202A">child-resistant</text><text x="40" y="282" font-size="13" fill="#17202A">Changing primary packaging means new stability data and usually a variation:</text><text x="40" y="300" font-size="13" fill="#17202A">the product's protection changes.</text><text x="40" y="322" font-size="13" fill="#5B6672">Materials must suit the product and meet Ph. Eur. requirements for packaging materials.</text></svg>