<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="300" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Qualifying a supplier</text><text x="40" y="62" font-size="13" fill="#5B6672">How a component supplier gets approved (EudraLex Vol. 4, Chapter 5; excipient risk assessment guideline).</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="30" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="97.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Identify</text><text x="97.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">need + spec</text><text x="97.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">for the item</text><line x1="165" y1="160" x2="179" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="180" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="247.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Assess risk</text><text x="247.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">criticality of</text><text x="247.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">the material</text><line x1="315" y1="160" x2="329" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="397.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Audit or</text><text x="397.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">questionnaire</text><text x="397.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">(by risk)</text><line x1="465" y1="160" x2="479" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="480" y="110" width="135" height="100" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="547.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Quality</text><text x="547.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">agreement +</text><text x="547.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">approval</text><line x1="615" y1="160" x2="629" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="697.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Monitor</text><text x="697.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">incoming tests,</text><text x="697.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">re-evaluation</text><text x="40" y="250" font-size="12" fill="#17202A">Applies to every starting and packaging material, not just the API. Higher risk means a deeper check (e.g. an audit).</text><text x="40" y="272" font-size="12" fill="#17202A">A new supplier usually also means change control, and possibly a variation (Module 4).</text></svg>