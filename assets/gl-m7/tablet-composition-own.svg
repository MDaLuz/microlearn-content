<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="410" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">What's in a tablet</text><text x="40" y="62" font-size="13" fill="#5B6672">Illustrative composition of a film-coated tablet by role (not a real formula).</text><rect x="40" y="100" width="98" height="50" fill="#C2185B"/><rect x="138" y="100" width="350" height="50" fill="#0089BF"/><rect x="488" y="100" width="56" height="50" fill="#66B8DD"/><rect x="544" y="100" width="42" height="50" fill="#004F6E"/><rect x="586" y="100" width="7" height="50" fill="#7C8792"/><rect x="593" y="100" width="28" height="50" fill="#E8B400"/><rect x="40" y="168" width="14" height="14" fill="#C2185B"/><text x="62" y="180" font-size="13" font-weight="700" fill="#17202A">API</text><text x="170" y="180" font-size="13" fill="#17202A">the active substance</text><rect x="40" y="194" width="14" height="14" fill="#0089BF"/><text x="62" y="206" font-size="13" font-weight="700" fill="#17202A">Filler</text><text x="170" y="206" font-size="13" fill="#17202A">bulk, e.g. lactose, cellulose</text><rect x="40" y="220" width="14" height="14" fill="#66B8DD"/><text x="62" y="232" font-size="13" font-weight="700" fill="#17202A">Binder</text><text x="170" y="232" font-size="13" fill="#17202A">holds it together</text><rect x="40" y="246" width="14" height="14" fill="#004F6E"/><text x="62" y="258" font-size="13" font-weight="700" fill="#17202A">Disintegrant</text><text x="170" y="258" font-size="13" fill="#17202A">helps it break up</text><rect x="40" y="272" width="14" height="14" fill="#7C8792"/><text x="62" y="284" font-size="13" font-weight="700" fill="#17202A">Lubricant</text><text x="170" y="284" font-size="13" fill="#17202A">e.g. magnesium stearate</text><rect x="40" y="298" width="14" height="14" fill="#E8B400"/><text x="62" y="310" font-size="13" font-weight="700" fill="#17202A">Film coat</text><text x="170" y="310" font-size="13" fill="#17202A">appearance, protection</text><text x="40" y="352" font-size="13" fill="#17202A">Excipients 'with known effect' (e.g. lactose, sodium) must be declared</text><text x="40" y="370" font-size="13" fill="#17202A">on the label and leaflet (Commission guideline).</text><text x="40" y="392" font-size="13" fill="#5B6672">Proportions shown are illustrative only.</text></svg>