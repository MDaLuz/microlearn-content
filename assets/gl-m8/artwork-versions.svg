<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="310" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Artwork versions follow the licence</text><text x="40" y="62" font-size="13" fill="#5B6672">Every approved text change creates a new artwork version (illustrative timeline).</text><line x1="60" y1="140" x2="760" y2="140" stroke="#17202A" stroke-width="3"/><circle cx="100" cy="140" r="10" fill="#C2185B"/><text x="100" y="116" font-size="15" font-weight="700" text-anchor="middle" fill="#17202A">v1</text><text x="100" y="172" font-size="12" text-anchor="middle" fill="#17202A">launch artwork</text><circle cx="330" cy="140" r="10" fill="#C2185B"/><text x="330" y="116" font-size="15" font-weight="700" text-anchor="middle" fill="#17202A">v2</text><text x="330" y="172" font-size="12" text-anchor="middle" fill="#17202A">after a safety variation</text><circle cx="560" cy="140" r="10" fill="#C2185B"/><text x="560" y="116" font-size="15" font-weight="700" text-anchor="middle" fill="#17202A">v3</text><text x="560" y="172" font-size="12" text-anchor="middle" fill="#17202A">new pack size</text><rect x="330" y="190" width="230" height="40" rx="6" fill="#FDF6DC" stroke="#E8B400"/><text x="445" y="215" font-size="12" text-anchor="middle" fill="#17202A">implementation deadline: old stock?</text><text x="40" y="270" font-size="12" fill="#17202A">Track for each country: the approved text version, its artwork version, and its implementation deadline.</text><text x="40" y="290" font-size="12" fill="#17202A">Label changes not linked to the SmPC can go through an Art. 61(3) notification instead of a variation.</text></svg>