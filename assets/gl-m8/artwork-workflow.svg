<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="300" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">The artwork workflow</text><text x="40" y="62" font-size="13" fill="#5B6672">Typical steps from approved text to first printed pack (practice; company procedures vary).</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="30" y="110" width="110" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="85.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Brief</text><text x="85.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">texts +</text><text x="85.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">die-line</text><line x1="140" y1="160" x2="154" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="155" y="110" width="110" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="210.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Design</text><text x="210.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">artwork</text><text x="210.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">drafted</text><line x1="265" y1="160" x2="279" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="110" width="110" height="100" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="335.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Proofread</text><text x="335.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">vs approved</text><text x="335.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">text, Braille</text><line x1="390" y1="160" x2="404" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="405" y="110" width="110" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="460.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Approvals</text><text x="460.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">RA, QA,</text><text x="460.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">marketing</text><line x1="515" y1="160" x2="529" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="530" y="110" width="110" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="585.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Printer</text><text x="585.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">proof, colour,</text><text x="585.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">print run</text><line x1="640" y1="160" x2="654" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="655" y="110" width="110" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="710.0" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">First print</text><text x="710.0" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">inspection</text><text x="710.0" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">→ release</text><text x="40" y="250" font-size="13" fill="#17202A">Each country = one loop. Most delays come from late text approval and late proof corrections.</text><text x="40" y="274" font-size="13" fill="#17202A">The die-line (technical drawing) comes from the packaging site; use the right one for the right line.</text></svg>