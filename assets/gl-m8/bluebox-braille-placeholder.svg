<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="380" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Blue Box and Braille</text><text x="40" y="62" font-size="13" fill="#5B6672">Two features of every EU carton (schematic).</text><rect x="60" y="100" width="300" height="200" fill="#F5F7F9" stroke="#7C8792" stroke-width="2"/><rect x="90" y="140" width="240" height="120" fill="none" stroke="#0089BF" stroke-width="3"/><text x="210" y="180" font-size="14" font-weight="700" text-anchor="middle" fill="#0089BF">Blue Box</text><text x="210" y="204" font-size="12" text-anchor="middle" fill="#17202A">national particulars,</text><text x="210" y="222" font-size="12" text-anchor="middle" fill="#17202A">e.g. legal status, local codes,</text><text x="210" y="240" font-size="12" text-anchor="middle" fill="#17202A">reimbursement information</text><rect x="440" y="100" width="300" height="200" fill="#F5F7F9" stroke="#7C8792" stroke-width="2"/><circle cx="470" cy="170" r="3.5" fill="#17202A"/><circle cx="484" cy="170" r="3.5" fill="#17202A"/><circle cx="498" cy="170" r="3.5" fill="#17202A"/><circle cx="540" cy="170" r="3.5" fill="#17202A"/><circle cx="554" cy="170" r="3.5" fill="#17202A"/><circle cx="582" cy="170" r="3.5" fill="#17202A"/><circle cx="596" cy="170" r="3.5" fill="#17202A"/><circle cx="624" cy="170" r="3.5" fill="#17202A"/><circle cx="652" cy="170" r="3.5" fill="#17202A"/><circle cx="680" cy="170" r="3.5" fill="#17202A"/><circle cx="470" cy="184" r="3.5" fill="#17202A"/><circle cx="512" cy="184" r="3.5" fill="#17202A"/><circle cx="554" cy="184" r="3.5" fill="#17202A"/><circle cx="568" cy="184" r="3.5" fill="#17202A"/><circle cx="596" cy="184" r="3.5" fill="#17202A"/><circle cx="666" cy="184" r="3.5" fill="#17202A"/><circle cx="694" cy="184" r="3.5" fill="#17202A"/><circle cx="484" cy="198" r="3.5" fill="#17202A"/><circle cx="498" cy="198" r="3.5" fill="#17202A"/><circle cx="512" cy="198" r="3.5" fill="#17202A"/><circle cx="540" cy="198" r="3.5" fill="#17202A"/><circle cx="568" cy="198" r="3.5" fill="#17202A"/><circle cx="582" cy="198" r="3.5" fill="#17202A"/><circle cx="596" cy="198" r="3.5" fill="#17202A"/><circle cx="610" cy="198" r="3.5" fill="#17202A"/><text x="590" y="240" font-size="13" text-anchor="middle" fill="#17202A">product name in Braille</text><text x="590" y="258" font-size="12" text-anchor="middle" fill="#5B6672">(embossed; dots illustrative)</text><text x="40" y="336" font-size="12" fill="#17202A">Blue Box: Directive 2001/83/EC Art. 57 and the CMDh 'Blue Box' requirements per country. Braille: Art. 56a.</text><text x="40" y="356" font-size="12" fill="#C2185B">Schematic only; a real anonymised carton photo will be added.</text></svg>