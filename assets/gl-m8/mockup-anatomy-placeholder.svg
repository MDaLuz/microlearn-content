<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="400" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Anatomy of a mock-up</text><text x="40" y="62" font-size="13" fill="#5B6672">What a carton mock-up shows (schematic).</text><rect x="60" y="100" width="680" height="230" fill="#FFFFFF" stroke="#7C8792" stroke-width="2" stroke-dasharray="8 6"/><rect x="90" y="125" width="260" height="180" fill="#EAF6FB" stroke="#0089BF"/><text x="220" y="160" font-size="14" font-weight="700" text-anchor="middle" fill="#17202A">Front panel</text><text x="220" y="186" font-size="12" text-anchor="middle" fill="#17202A">layout, fonts, colours</text><rect x="370" y="125" width="110" height="180" fill="#FDF6DC" stroke="#E8B400"/><text x="425" y="160" font-size="13" font-weight="700" text-anchor="middle" fill="#17202A">Side</text><text x="425" y="186" font-size="11" text-anchor="middle" fill="#17202A">2D code area</text><rect x="500" y="125" width="210" height="180" fill="#F5F7F9" stroke="#7C8792"/><text x="605" y="160" font-size="14" font-weight="700" text-anchor="middle" fill="#17202A">Back panel</text><text x="605" y="186" font-size="12" text-anchor="middle" fill="#17202A">Blue Box position</text><text x="400" y="322" font-size="11" text-anchor="middle" fill="#5B6672">die-line (cut and fold lines) around the flat carton</text><text x="40" y="360" font-size="12" fill="#17202A">Mock-ups are flat colour layouts of the pack, submitted to agencies (Art. 61); specimens are actual printed samples.</text><text x="40" y="380" font-size="12" fill="#C2185B">Schematic only; a real anonymised mock-up will be added.</text></svg>