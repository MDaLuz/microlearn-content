<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="345" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">One pack, several countries: multilingual packs</text><text x="40" y="62" font-size="13" fill="#5B6672">Allowed if every language carries the same particulars (Directive 2001/83/EC Art. 63(1)). Trade-off view.</text><rect x="40" y="100" width="330" height="150" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="205.0" y="152.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Pros</text><text x="205.0" y="170.0" text-anchor="middle" font-size="12" fill="#17202A">fewer pack versions (SKUs)</text><text x="205.0" y="188.0" text-anchor="middle" font-size="12" fill="#17202A">bigger, simpler packaging runs</text><text x="205.0" y="206.0" text-anchor="middle" font-size="12" fill="#17202A">flexible stock between countries</text><rect x="430" y="100" width="330" height="150" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="595.0" y="152.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Cons</text><text x="595.0" y="170.0" text-anchor="middle" font-size="12" fill="#17202A">limited carton space for all texts</text><text x="595.0" y="188.0" text-anchor="middle" font-size="12" fill="#17202A">national Blue Box and codes per country</text><text x="595.0" y="206.0" text-anchor="middle" font-size="12" fill="#17202A">every country must agree on wording</text><text x="40" y="290" font-size="12" fill="#17202A">Common in groups of smaller markets (e.g. Baltic, Nordic, Benelux).</text><text x="40" y="308" font-size="12" fill="#17202A">Serialisation data must reach every relevant national system.</text><text x="40" y="328" font-size="12" fill="#5B6672">Practice; feasibility depends on carton size and national requirements.</text></svg>