<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="330" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Readability (user) testing of the leaflet</text><text x="40" y="62" font-size="13" fill="#5B6672">Directive 2001/83/EC Art. 59(3); Commission readability guideline (typical method).</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="30" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="97.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Draft PIL</text><text x="97.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">per QRD</text><text x="97.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">template</text><line x1="165" y1="160" x2="179" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="180" y="110" width="135" height="100" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="247.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Test round</text><text x="247.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">real users find</text><text x="247.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">and understand</text><line x1="315" y1="160" x2="329" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="397.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Revise</text><text x="397.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">fix what</text><text x="397.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">failed</text><line x1="465" y1="160" x2="479" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="480" y="110" width="135" height="100" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="547.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Re-test</text><text x="547.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">until criteria</text><text x="547.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">are met</text><line x1="615" y1="160" x2="629" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="697.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Report</text><text x="697.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">in the</text><text x="697.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">dossier</text><path d="M482 210 Q 400 260 330 210" stroke="#17202A" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="40" y="290" font-size="12" fill="#17202A">A common success standard: 90% of participants find each key piece of information, and 90% of those understand it.</text><text x="40" y="310" font-size="12" fill="#17202A">Generics can often 'bridge' to the reference product's tested leaflet instead of running a full test.</text></svg>