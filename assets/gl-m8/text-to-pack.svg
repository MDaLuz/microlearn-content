<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="300" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">From SmPC text to printed pack</text><text x="40" y="62" font-size="13" fill="#5B6672">Approved texts become artwork. Templates: EMA QRD (also used in MRP/DCP).</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="30" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="97.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">QRD template</text><text x="97.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">standard headings</text><text x="97.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">and wording</text><line x1="165" y1="160" x2="179" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="180" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="247.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Approved texts</text><text x="247.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">SmPC, labelling,</text><text x="247.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">PIL (English)</text><line x1="315" y1="160" x2="329" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="397.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Translations</text><text x="397.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">national</text><text x="397.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">phase</text><line x1="465" y1="160" x2="479" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="480" y="110" width="135" height="100" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="547.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Artwork</text><text x="547.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">graphic design</text><text x="547.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">per country</text><line x1="615" y1="160" x2="629" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="110" width="135" height="100" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="697.5" y="146.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17202A">Printed</text><text x="697.5" y="164.0" text-anchor="middle" font-size="12" fill="#17202A">carton, leaflet,</text><text x="697.5" y="182.0" text-anchor="middle" font-size="12" fill="#17202A">blister foil</text><text x="40" y="250" font-size="12" fill="#17202A">Text is regulatory (approved); artwork is how that text appears on the pack. A wrong word on a carton is a regulatory issue.</text><text x="40" y="272" font-size="12" fill="#5B6672">QRD = Quality Review of Documents, the EMA group that maintains the product-information templates.</text></svg>