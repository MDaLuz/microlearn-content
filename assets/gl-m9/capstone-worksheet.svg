<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="400" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">Capstone: walk a real launch backwards</text><text x="40" y="62" font-size="13" fill="#5B6672">Worksheet (schematic). Use an anonymised past launch together with Mathieu.</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="30" y="110" width="135" height="120" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="97.5" y="156.0" text-anchor="middle" font-size="13" fill="#17202A">1. Start at</text><text x="97.5" y="174.0" text-anchor="middle" font-size="12" fill="#17202A">the first sale</text><text x="97.5" y="192.0" text-anchor="middle" font-size="12" fill="#17202A">date</text><line x1="165" y1="170" x2="179" y2="170" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="180" y="110" width="135" height="120" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="247.5" y="147.0" text-anchor="middle" font-size="13" fill="#17202A">2. Which gate</text><text x="247.5" y="165.0" text-anchor="middle" font-size="12" fill="#17202A">came last?</text><text x="247.5" y="183.0" text-anchor="middle" font-size="12" fill="#17202A">(licence, P&amp;R,</text><text x="247.5" y="201.0" text-anchor="middle" font-size="12" fill="#17202A">stock, patent)</text><line x1="315" y1="170" x2="329" y2="170" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="110" width="135" height="120" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="397.5" y="147.0" text-anchor="middle" font-size="13" fill="#17202A">3. Trace back</text><text x="397.5" y="165.0" text-anchor="middle" font-size="12" fill="#17202A">each phase:</text><text x="397.5" y="183.0" text-anchor="middle" font-size="12" fill="#17202A">planned vs</text><text x="397.5" y="201.0" text-anchor="middle" font-size="12" fill="#17202A">actual</text><line x1="465" y1="170" x2="479" y2="170" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="480" y="110" width="135" height="120" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="547.5" y="156.0" text-anchor="middle" font-size="13" fill="#17202A">4. Mark the</text><text x="547.5" y="174.0" text-anchor="middle" font-size="12" fill="#17202A">slips and</text><text x="547.5" y="192.0" text-anchor="middle" font-size="12" fill="#17202A">their causes</text><line x1="615" y1="170" x2="629" y2="170" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="110" width="135" height="120" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="697.5" y="156.0" text-anchor="middle" font-size="13" fill="#17202A">5. One lesson</text><text x="697.5" y="174.0" text-anchor="middle" font-size="12" fill="#17202A">per phase</text><text x="697.5" y="192.0" text-anchor="middle" font-size="12" fill="#17202A">for next time</text><text x="40" y="276" font-size="14" font-weight="700" fill="#17202A">Questions to answer together</text><text x="40" y="302" font-size="13" fill="#17202A">• What was on the critical path, and was it the one we expected?</text><text x="40" y="324" font-size="13" fill="#17202A">• Which slip could have been seen earlier, and from which document?</text><text x="40" y="346" font-size="13" fill="#17202A">• Which phase overlapped well (e.g. artwork drafts during clock-stops)?</text><text x="40" y="368" font-size="13" fill="#17202A">• What would you put in the risk register next time?</text></svg>