<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="410" fill="#FFFFFF"/><text x="40" y="40" font-size="22" font-weight="700" fill="#17202A">The critical path and where it slips</text><text x="40" y="62" font-size="13" fill="#5B6672">Typical chain for an in-licensed generic (illustrative). Red flags = frequent slip points.</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker></defs><rect x="30" y="120" width="96" height="80" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="78.0" y="155.0" text-anchor="middle" font-size="12" font-weight="700" fill="#17202A">Dossier</text><text x="78.0" y="173.0" text-anchor="middle" font-size="11" fill="#17202A">+ gaps</text><line x1="126" y1="160" x2="136" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="136" y="120" width="96" height="80" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="184.0" y="155.0" text-anchor="middle" font-size="12" font-weight="700" fill="#17202A">DCP</text><text x="184.0" y="173.0" text-anchor="middle" font-size="11" fill="#17202A">+ clock-stops</text><line x1="232" y1="160" x2="242" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="242" y="120" width="96" height="80" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="290.0" y="155.0" text-anchor="middle" font-size="12" font-weight="700" fill="#17202A">National</text><text x="290.0" y="173.0" text-anchor="middle" font-size="11" fill="#17202A">texts</text><line x1="338" y1="160" x2="348" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="348" y="120" width="96" height="80" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="396.0" y="155.0" text-anchor="middle" font-size="12" font-weight="700" fill="#17202A">Artwork</text><text x="396.0" y="173.0" text-anchor="middle" font-size="11" fill="#17202A">+ printing</text><line x1="444" y1="160" x2="454" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="454" y="120" width="96" height="80" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="502.0" y="155.0" text-anchor="middle" font-size="12" font-weight="700" fill="#17202A">Packing</text><text x="502.0" y="173.0" text-anchor="middle" font-size="11" fill="#17202A">launch batches</text><line x1="550" y1="160" x2="560" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="560" y="120" width="96" height="80" rx="10" fill="#EAF6FB" stroke="#0089BF" stroke-width="2"/><text x="608.0" y="155.0" text-anchor="middle" font-size="12" font-weight="700" fill="#17202A">EU test</text><text x="608.0" y="173.0" text-anchor="middle" font-size="11" fill="#17202A">+ QP</text><line x1="656" y1="160" x2="666" y2="160" stroke="#17202A" stroke-width="2" marker-end="url(#a)"/><rect x="666" y="120" width="96" height="80" rx="10" fill="#FBE8EF" stroke="#C2185B" stroke-width="2"/><text x="714.0" y="164.0" text-anchor="middle" font-size="12" font-weight="700" fill="#17202A">Launch</text><path d="M78 230 l0 -24" stroke="#C2185B" stroke-width="2"/><path d="M78 206 l14 6 l-14 6z" fill="#C2185B"/><text x="48" y="250" font-size="11" fill="#17202A">late dossier,</text><text x="48" y="264" font-size="11" fill="#17202A">stability gaps</text><path d="M184 230 l0 -24" stroke="#C2185B" stroke-width="2"/><path d="M184 206 l14 6 l-14 6z" fill="#C2185B"/><text x="154" y="250" font-size="11" fill="#17202A">long</text><text x="154" y="264" font-size="11" fill="#17202A">clock-stops</text><path d="M396 230 l0 -24" stroke="#C2185B" stroke-width="2"/><path d="M396 206 l14 6 l-14 6z" fill="#C2185B"/><text x="366" y="250" font-size="11" fill="#17202A">proof rounds,</text><text x="366" y="264" font-size="11" fill="#17202A">printer slots</text><path d="M608 230 l0 -24" stroke="#C2185B" stroke-width="2"/><path d="M608 206 l14 6 l-14 6z" fill="#C2185B"/><text x="578" y="250" font-size="11" fill="#17202A">documents,</text><text x="578" y="264" font-size="11" fill="#17202A">test capacity</text><text x="40" y="306" font-size="14" font-weight="700" fill="#17202A">Can override the whole chain</text><text x="40" y="330" font-size="13" fill="#17202A">• Patent/SPC expiry later than the plan (Module 3)</text><text x="40" y="352" font-size="13" fill="#17202A">• National listing calendar or tender date (phase 4)</text><text x="40" y="374" font-size="13" fill="#17202A">• A GMP problem at a key site (Module 6)</text></svg>