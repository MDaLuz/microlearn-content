FF" font-weight="bold" text-anchor="start">RAG</text><text x="468" y="277" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="start">Owner</text><text x="548" y="277" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="start">What happened</text><rect x="30" y="284" width="760" height="24" rx="0" fill="#FFFFFF" stroke="#E3E8EE" stroke-width="1"/><text x="38" y="300" font-size="11" fill="#1B2430" font-weight="normal" text-anchor="start">R1</text><text x="74" y="300" font-size="11" fill="#1B2430" font-weight="normal" text-anchor="start">DCP clock-stop longer than 3 months</text><text x="324" y="300" font-size="11" fill="#1B2430" font-weight="normal" text-anchor="start">4×4=16</text><rect x="396" y="288" width="56" height="16" rx="8" fill="#FBE4EE" stroke="none" stroke-width="1"/><text x="424.0" y="300" font-size="10.5" fill="#C2185B" font-weight="bold" text-anchor="middle">Red</text><text x="468" y="300" font-size="11" fill="#1B2430" font-weight="normal" text-anchor="start">RA</text><text x="548" y="300" font-size="11" fill="#1B2430" font-weight="normal" text-anchor="start">day-120 clock-stop 4.5 months (+1.5)</text><rect x="30" y="308" width="760" height="24" rx="0" fill="#FFFFFF" stroke="#E3E8EE" stroke-width="1"/><text x="38" y="324" font-size="11" fill="#1B2430" font-weight="normal" text-anchor="start">R2</text><text x="74" y="324" font-size="11" fill="#1B2430" font-weight="normal" text-anchor="start">API written confirmation expires b…</text><text x="324" y="324" font-size="11" fill="#1B2430" font-weight="normal" text-anchor="start">3×5=15</text><rect x="396" y="312" width="56" height="16" rx="8" fill="#FBE4EE" stroke="none" stroke-width="1"/><text x="424.0" y="324" font-size="10.5" fill="#C2185B" font-weight="bold" text-anchor="middle">Red</text><text x="468" y="324" font-size="11" fill="#1B2430" font-weight="normal" text-anchor="start">QA</text><text x="548" y="324" font-size="11" fill="#1B2430" font-weight="normal" text-anchor="start">