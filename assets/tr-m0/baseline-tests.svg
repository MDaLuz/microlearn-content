<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="470" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Your baseline test sheet</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Warm up 5 minutes. Rest 3 minutes between strength tests. Compare only with yourself.</text><rect x="30" y="92" width="760" height="30" rx="4" fill="#1F3A5F" stroke="none" stroke-width="1"/><text x="40" y="112" font-size="12.5" fill="#FFF" font-weight="bold" text-anchor="start">Test</text><text x="230" y="112" font-size="12.5" fill="#FFF" font-weight="bold" text-anchor="start">How</text><text x="610" y="112" font-size="12.5" fill="#FFF" font-weight="bold" text-anchor="start">Result</text><text x="720" y="112" font-size="12.5" fill="#FFF" font-weight="bold" text-anchor="start">Date</text><rect x="30" y="122" width="760" height="52" rx="0" fill="#FFFFFF" stroke="#E3E8EE" stroke-width="1"/><text x="40" y="153" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start">Push-ups</text><text x="230" y="153" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="start">Max reps, good form: straight line head to heels</text><rect x="610" y="134" width="90" height="28" rx="4" fill="#FFFFFF" stroke="#5B6672" stroke-width="1" stroke-dasharray="3 3"/><rect x="718" y="134" width="64" height="28" rx="4" fill="#FFFFFF" stroke="#5B6672" stroke-width="1" stroke-dasharray="3 3"/><rect x="30" y="174" width="760" height="52" rx="0" fill="#F7F9FB" stroke="#E3E8EE" stroke-width="1"/><text x="40" y="205" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start">Goblet squat, 12 kg</text><text x="230" y="205" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="start">Full-depth reps, stop at ~2 in reserve (cap 30)</text><rect x="610" y="186" width="90" height="28" rx="4" fill="#FFFFFF" stroke="#5B6672" stroke-width="1" stroke-dasharray="3 3"/><rect x="718" y="186" width="64" height="28" rx="4" fill="#FFFFFF" stroke="#5B6672" stroke-width="1" stroke-dasharray="3 3"/><rect x="30" y="226" width="760" height="52" rx="0" fill="#FFFFFF" stroke="#E3E8EE" stroke-width="1"/><text x="40" y="257" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start">Front plank</text><text x="230" y="257" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="start">Hold until hips sag or lift (seconds)</text><rect x="610" y="238" width="90" height="28" rx="4" fill="#FFFFFF" stroke="#5B6672" stroke-width="1" stroke-dasharray="3 3"/><rect x="718" y="238" width="64" height="28" rx="4" fill="#FFFFFF" stroke="#5B6672" stroke-width="1" stroke-dasharray="3 3"/><rect x="30" y="278" width="760" height="52" rx="0" fill="#F7F9FB" stroke="#E3E8EE" stroke-width="1"/><text x="40" y="309" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start">Side plank</text><text x="230" y="309" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="start">Each side, same rule (seconds, L / R)</text><rect x="610" y="290" width="90" height="28" rx="4" fill="#FFFFFF" stroke="#5B6672" stroke-width="1" stroke-dasharray="3 3"/><rect x="718" y="290" width="64" height="28" rx="4" fill="#FFFFFF" stroke="#5B6672" stroke-width="1" stroke-dasharray="3 3"/><rect x="30" y="330" width="760" height="52" rx="0" fill="#FFFFFF" stroke="#E3E8EE" stroke-width="1"/><text x="40" y="361" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start">Resting HR + step test</text><text x="230" y="361" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="start">On waking, 60 s · 30 cm step, 24/min, 3 min, HR 1 min after</text><rect x="610" y="342" width="90" height="28" rx="4" fill="#FFFFFF" stroke="#5B6672" stroke-width="1" stroke-dasharray="3 3"/><rect x="718" y="342" width="64" height="28" rx="4" fill="#FFFFFF" stroke="#5B6672" stroke-width="1" stroke-dasharray="3 3"/><rect x="30" y="382" width="760" height="52" rx="0" fill="#F7F9FB" stroke="#E3E8EE" stroke-width="1"/><text x="40" y="413" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start">Waist + photos</text><text x="230" y="413" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="start">Midway lowest rib – hip bone, after breath out · front, side, back</text><rect x="610" y="394" width="90" height="28" rx="4" fill="#FFFFFF" stroke="#5B6672" stroke-width="1" stroke-dasharray="3 3"/><rect x="718" y="394" width="64" height="28" rx="4" fill="#FFFFFF" stroke="#5B6672" stroke-width="1" stroke-dasharray="3 3"/><text x="30" y="448" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Repeat every 4–12 weeks, same order, same time of day.</text></svg>