<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="360" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">A simple screening flow</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Based on the PAR-Q+ (current version at eparmedx.com). Not medical advice.</text><rect x="30" y="110" width="200" height="80" rx="10" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1.4"/><text x="130.0" y="146.10000000000002" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Answer the 7 general</text><text x="130.0" y="163.00000000000003" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">PAR-Q+ questions</text><line x1="230" y1="130" x2="320" y2="110" stroke="#5B6672" stroke-width="1.5" marker-end="url(#ar)"/><text x="270" y="108" font-size="11.5" fill="#2E8B57" font-weight="bold" text-anchor="middle">all 'no'</text><line x1="230" y1="170" x2="320" y2="215" stroke="#5B6672" stroke-width="1.5" marker-end="url(#ar)"/><text x="262" y="212" font-size="11.5" fill="#B7791F" font-weight="bold" text-anchor="middle">any 'yes'</text><rect x="330" y="80" width="210" height="60" rx="10" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4"/><text x="435.0" y="114.55" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Start gradually</text><rect x="330" y="190" width="210" height="70" rx="10" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4"/><text x="435.0" y="221.10000000000002" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Answer the</text><text x="435.0" y="238.00000000000003" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">follow-up questions</text><line x1="540" y1="205" x2="600" y2="140" stroke="#5B6672" stroke-width="1.5" marker-end="url(#ar)"/><text x="574" y="196" font-size="11.5" fill="#2E8B57" font-weight="bold" text-anchor="start">cleared</text><line x1="540" y1="245" x2="600" y2="270" stroke="#5B6672" stroke-width="1.5" marker-end="url(#ar)"/><rect x="610" y="90" width="180" height="50" rx="10" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4"/><text x="700.0" y="119.55" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Start gradually</text><rect x="610" y="240" width="180" height="70" rx="10" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4"/><text x="700.0" y="271.25" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="middle">Talk to a doctor or</text><text x="700.0" y="287.5" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="middle">qualified exercise pro</text><text x="30" y="340" font-size="12" fill="#C2185B" font-weight="bold" text-anchor="start">During training, stop for chest pain or pressure, dizziness, unusual breathlessness or palpitations.</text></svg>