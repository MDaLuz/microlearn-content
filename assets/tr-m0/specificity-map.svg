<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="400" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">What you train is what you get</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Specificity: the main result of each kind of training. Every row also helps the others a little.</text><rect x="30" y="96" width="380" height="52" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><text x="46" y="127" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Steady cardio: running, cycling, sport</text><line x1="418" y1="122" x2="488" y2="122" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><rect x="496" y="96" width="294" height="52" rx="8" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.4"/><text x="512" y="127" font-size="14" fill="#2F7FB3" font-weight="bold" text-anchor="start">Aerobic endurance</text><rect x="30" y="162" width="380" height="52" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><text x="46" y="193" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Heavy lifts, about 1–6 reps</text><line x1="418" y1="188" x2="488" y2="188" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><rect x="496" y="162" width="294" height="52" rx="8" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4"/><text x="512" y="193" font-size="14" fill="#C2185B" font-weight="bold" text-anchor="start">Maximal strength</text><rect x="30" y="228" width="380" height="52" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><text x="46" y="259" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Moderate or light loads, sets close to failure</text><line x1="418" y1="254" x2="488" y2="254" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><rect x="496" y="228" width="294" height="52" rx="8" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4"/><text x="512" y="259" font-size="14" fill="#B7791F" font-weight="bold" text-anchor="start">Muscle size (hypertrophy)</text><rect x="30" y="294" width="380" height="52" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><text x="46" y="325" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Light loads moved fast, jumps, swings</text><line x1="418" y1="320" x2="488" y2="320" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><rect x="496" y="294" width="294" height="52" rx="8" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4"/><text x="512" y="325" font-size="14" fill="#2E8B57" font-weight="bold" text-anchor="start">Power</text><text x="30" y="380" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">A mostly-cardio routine trains the top row. Muscle and strength need the middle rows.</text></svg>