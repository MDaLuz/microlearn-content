<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="400" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Stress, recovery, adaptation</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Simplified picture of one session. The fitness–fatigue model in the lesson is the more accurate version.</text><line x1="70" y1="220" x2="770" y2="220" stroke="#5B6672" stroke-width="1.2" stroke-dasharray="5 4"/><text x="70" y="212" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="start">starting level</text><path d="M70,220 L160,220 C200,220 220,300 270,300 C330,300 370,220 410,190 C450,165 500,165 540,180 C600,200 670,215 770,218" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="148" y="94" width="24" height="18" rx="3" fill="#C2185B" stroke="none" stroke-width="1"/><text x="160" y="107" font-size="11" fill="#FFF" font-weight="bold" text-anchor="middle">S</text><line x1="160" y1="114" x2="160" y2="216" stroke="#C2185B" stroke-width="1.5" stroke-dasharray="3 3"/><text x="160" y="88" font-size="11.5" fill="#C2185B" font-weight="bold" text-anchor="middle">session</text><text x="270" y="324" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="middle">1. Fatigue: weaker than before</text><text x="370" y="208" font-size="12" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" font-weight="bold" text-anchor="start">2. Recovery</text><text x="370" y="208" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="start">2. Recovery</text><text x="500" y="152" font-size="12" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" font-weight="bold" text-anchor="middle">3. Adaptation: a bit above the start</text><text x="500" y="152" font-size="12" fill="#2E8B57" font-weight="bold" text-anchor="middle">3. Adaptation: a bit above the start</text><text x="690" y="250" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="middle">4. Fades if no new session</text><text x="30" y="364" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Next session too soon: fatigue stacks up. Too late: the gain fades. About right: it lands near the peak.</text><text x="30" y="384" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">Sleep, food and rest days are where step 2 and step 3 happen.</text></svg>