<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 550" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="550" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">The training loop</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Every programme in this course runs on it.</text><path d="M491.7,129.6 A180,180 0 0 1 565.9,200.0" stroke="#5B6672" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="332.0" y="84.0" width="156" height="52" rx="12" fill="#1F3A5F" stroke="none" stroke-width="1"/><text x="410.0" y="107.0" font-size="15" fill="#FFF" font-weight="bold" text-anchor="middle">Plan</text><text x="410.0" y="124.0" font-size="10.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle">exercises, sets, reps, load</text><path d="M570.4,371.7 A180,180 0 0 1 500.0,445.9" stroke="#5B6672" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="512.0" y="264.0" width="156" height="52" rx="12" fill="#C2185B" stroke="none" stroke-width="1"/><text x="590.0" y="287.0" font-size="15" fill="#FFF" font-weight="bold" text-anchor="middle">Do</text><text x="590.0" y="304.0" font-size="10.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle">make one thing harder</text><path d="M328.3,450.4 A180,180 0 0 1 254.1,380.0" stroke="#5B6672" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="332.0" y="444.0" width="156" height="52" rx="12" fill="#1F3A5F" stroke="none" stroke-width="1"/><text x="410.0" y="467.0" font-size="15" fill="#FFF" font-weight="bold" text-anchor="middle">Log</text><text x="410.0" y="484.0" font-size="10.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle">what you did, how hard</text><path d="M249.6,208.3 A180,180 0 0 1 320.0,134.1" stroke="#5B6672" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="152.0" y="264.0" width="156" height="52" rx="12" fill="#1F3A5F" stroke="none" stroke-width="1"/><text x="230.0" y="287.0" font-size="15" fill="#FFF" font-weight="bold" text-anchor="middle">Adjust</text><text x="230.0" y="304.0" font-size="10.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle">next week's targets</text><text x="410" y="286" font-size="14" fill="#C2185B" font-weight="bold" text-anchor="middle">progressive</text><text x="410" y="304" font-size="14" fill="#C2185B" font-weight="bold" text-anchor="middle">overload</text><text x="555.6" y="425.6" font-size="11.5" fill="#2E8B57" font-weight="bold" text-anchor="start">recovery</text><text x="30" y="532" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">Re-test the baseline every 4–12 weeks to check the loop is working.</text></svg>