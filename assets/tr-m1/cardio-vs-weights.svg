<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="420" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">What each type of training does best</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Summary of guideline and trial evidence. ●●● strong, ●● moderate, ● small.</text><rect x="30" y="90" width="760" height="32" rx="4" fill="#1F3A5F" stroke="none" stroke-width="1"/><text x="42" y="111" font-size="13" fill="#FFF" font-weight="bold" text-anchor="start"></text><text x="410.0" y="111" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">Cardio</text><text x="570.0" y="111" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">Weights</text><text x="720.0" y="111" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">Both</text><rect x="30" y="122" width="760" height="40" rx="0" fill="#FFF" stroke="#E3E8EE" stroke-width="1"/><text x="42" y="147" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Energy used per session</text><text x="410.0" y="148" font-size="16" fill="#2F7FB3" font-weight="bold" text-anchor="middle">●●●</text><text x="570.0" y="148" font-size="16" fill="#C2185B" font-weight="bold" text-anchor="middle">●●</text><text x="720.0" y="148" font-size="16" fill="#2E8B57" font-weight="bold" text-anchor="middle">●●●</text><rect x="30" y="162" width="760" height="40" rx="0" fill="#F7F9FB" stroke="#E3E8EE" stroke-width="1"/><text x="42" y="187" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Fat loss</text><text x="410.0" y="188" font-size="16" fill="#2F7FB3" font-weight="bold" text-anchor="middle">●●●</text><text x="570.0" y="188" font-size="16" fill="#C2185B" font-weight="bold" text-anchor="middle">●●</text><text x="720.0" y="188" font-size="16" fill="#2E8B57" font-weight="b