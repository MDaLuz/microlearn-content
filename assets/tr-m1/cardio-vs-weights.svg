anchor="middle">●●</text><text x="720.0" y="348" font-size="16" fill="#2E8B57" font-weight="bold" text-anchor="middle">●●●</text><text x="30" y="384" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">STRRIDE AT/RT (8 months): cardio cut more fat, weights added lean mass, both did both at ~2× the time.</text><text x="30" y="404" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">WHO: 150–300 min moderate aerobic a week + muscle strengthening on ≥ 2 days.</text></svg>