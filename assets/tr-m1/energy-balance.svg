<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="490" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Energy balance, and what lifting protects</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Fat goes down when energy out exceeds energy in, over weeks. Proportions illustrative.</text><rect x="120" y="118" width="170" height="150" rx="6" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4"/><text x="205" y="189.0" font-size="15" fill="#B7791F" font-weight="bold" text-anchor="middle">Energy in</text><text x="205" y="209.0" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">food and drink</text><text x="205" y="290" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="middle">in</text><rect x="400" y="104" width="170" height="98.4" rx="0" fill="#1F3A5F" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="584" y="157.2" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="start">Resting metabolism</text><rect x="400" y="202.4" width="170" height="32.8" rx="0" fill="#2F7FB3" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="584" y="222.8" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="start">Daily movement, steps</text><rect x="400" y="235.2" width="170" height="19.68" rx="0" fill="#C2185B" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="584" y="249.04" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Exercise</text><rect x="400" y="254.88" width="170" height="13.12" rx="0" fill="#5B6672" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="584" y="265.44" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Digesting food</text><text x="485" y="290" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="middle">out (taller = deficit)</text><line x1="300" y1="104" x2="390" y2="104" stroke="#C2185B" stroke-width="1.2" stroke-dasharray="4 3"/><text x="350.0" y="98" font-size="12" fill="#C2185B" font-weight="bold" text-anchor="middle">deficit</text><text x="30" y="345" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Same deficit, two outcomes</text><text x="30" y="383" font-size="12.5" fill="#5B6672" font-weight="bold" text-anchor="start">Diet only</text><rect x="170" y="363" width="325" height="28" rx="4" fill="#FFF1D6" stroke="#B7791F" stroke-width="1"/><text x="178" y="382" font-size="11.5" fill="#1B2430" font-weight="normal" text-anchor="start">fat lost</text><rect x="495" y="363" width="175" height="28" rx="4" fill="#FBE4EE" stroke="#C2185B" stroke-width="1"/><text x="503" y="382" font-size="11.5" fill="#1B2430" font-weight="normal" text-anchor="start">muscle lost</text><text x="30" y="431" font-size="12.5" fill="#C2185B" font-weight="bold" text-anchor="start">Diet + lifting</text><rect x="170" y="411" width="460" height="28" rx="4" fill="#FFF1D6" stroke="#B7791F" stroke-width="1"/><text x="178" y="430" font-size="11.5" fill="#1B2430" font-weight="normal" text-anchor="start">fat lost</text><rect x="630" y="411" width="40" height="28" rx="4" fill="#FBE4EE" stroke="#C2185B" stroke-width="1"/><text x="678" y="430" font-size="11.5" fill="#C2185B" font-weight="bold" text-anchor="start">little muscle lost</text><text x="30" y="476" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="start">A deficit of ~500 kcal/day or more stalled muscle gain in a 2022 meta-analysis. Aim to lose ~0.5–1% of body weight a week.</text></svg>