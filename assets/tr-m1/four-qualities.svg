<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="500" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Four trainable qualities, plus the engine</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">They overlap. Your goal decides the emphasis, not the exclusion.</text><circle cx="410" cy="270" r="185" fill="none" stroke="#2F7FB3" stroke-width="10" stroke-opacity="0.25"/><text x="410" y="485" font-size="12.5" fill="#2F7FB3" font-weight="bold" text-anchor="middle">Ring: aerobic fitness, the engine (Module 7)</text><rect x="205" y="174" width="194" height="76" rx="12" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.6"/><text x="302" y="206" font-size="15" fill="#C2185B" font-weight="bold" text-anchor="middle">Strength</text><text x="302" y="226" font-size="10.5" fill="#1B2430" font-weight="normal" text-anchor="middle">heavy, few reps</text><rect x="421" y="174" width="194" height="76" rx="12" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.6"/><text x="518" y="206" font-size="15" fill="#B7791F" font-weight="bold" text-anchor="middle">Hypertrophy</text><text x="518" y="226" font-size="10.5" fill="#1B2430" font-weight="normal" text-anchor="middle">close to failure, wide load range</text><rect x="205" y="290" width="194" height="76" rx="12" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.6"/><text x="302" y="322" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="middle">Muscular endurance</text><text x="302" y="342" font-size="10.5" fill="#1B2430" font-weight="normal" text-anchor="middle">light, many reps</text><rect x="421" y="290" width="194" height="76" rx="12" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.6"/><text x="518" y="322" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Mobility</text><text x="518" y="342" font-size="10.5" fill="#1B2430" font-weight="normal" text-anchor="middle">range of motion with control</text><circle cx="410" cy="270" r="22" fill="#FFF" stroke="#1B2430" stroke-width="1.5"/><text x="410" y="274" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="middle">you</text></svg>