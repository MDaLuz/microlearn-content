<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="440" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Your 12-week goal card</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Fill it from your baseline tests. Example values in grey are illustrative.</text><rect x="30" y="92" width="760" height="54" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><rect x="30" y="92" width="8" height="54" rx="3" fill="#1F3A5F" stroke="none" stroke-width="1"/><text x="54" y="125" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start">Priority</text><text x="210" y="125" font-size="13" fill="#5B6672" font-weight="normal" text-anchor="start">Fat loss while keeping and building muscle</text><rect x="30" y="154" width="760" height="54" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><rect x="30" y="154" width="8" height="54" rx="3" fill="#B7791F" stroke="none" stroke-width="1"/><text x="54" y="187" font-size="14" fill="#B7791F" font-weight="bold" text-anchor="start">Outcome</text><text x="210" y="187" font-size="13" fill="#5B6672" font-weight="normal" text-anchor="start">Waist −3 to −4 cm</text><rect x="30" y="216" width="760" height="54" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><rect x="30" y="216" width="8" height="54" rx="3" fill="#C2185B" stroke="none" stroke-width="1"/><text x="54" y="249" font-size="14" fill="#C2185B" font-weight="bold" text-anchor="start">Performance</text><text x="210" y="249" font-size="13" fill="#5B6672" font-weight="normal" text-anchor="start">Goblet squat 20 → 30 reps at 12 kg · push-ups 15 → 25</text><rect x="30" y="278" width="760" height="54" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><rect x="30" y="278" width="8" height="54" rx="3" fill="#2E8B57" stroke="none" stroke-width="1"/><text x="54" y="311" font-size="14" fill="#2E8B57" font-weight="bold" text-anchor="start">Behaviour</text><text x="210" y="311" font-size="13" fill="#5B6672" font-weight="normal" text-anchor="start">3 × 30 min strength · sport 1–2× · 8,000+ steps a day</text><rect x="30" y="340" width="760" height="54" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><rect x="30" y="340" width="8" height="54" rx="3" fill="#5B6672" stroke="none" stroke-width="1"/><text x="54" y="373" font-size="14" fill="#5B6672" font-weight="bold" text-anchor="start">Reviews</text><text x="210" y="373" font-size="13" fill="#5B6672" font-weight="normal" text-anchor="start">Week 4 · week 8 · week 12 (re-test)</text><text x="30" y="422" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Behaviour targets are the ones you control each week: track them first.</text></svg>