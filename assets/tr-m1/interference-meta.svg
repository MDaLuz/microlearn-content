<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="400" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Does cardio hurt strength gains?</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Schumann et al. 2021, 43 studies: cardio + strength vs strength alone. Effect size (SMD) with 95% CI.</text><line x1="596.0" y1="96" x2="596.0" y2="300" stroke="#5B6672" stroke-width="1.5"/><text x="596.0" y="316" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="middle">0 = no difference</text><line x1="366.0" y1="100" x2="366.0" y2="300" stroke="#E3E8EE" stroke-width="1" stroke-dasharray="3 3"/><text x="366.0" y="316" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">-0.50</text><line x1="481.0" y1="100" x2="481.0" y2="300" stroke="#E3E8EE" stroke-width="1" stroke-dasharray="3 3"/><text x="481.0" y="316" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">-0.25</text><line x1="711.0" y1="100" x2="711.0" y2="300" stroke="#E3E8EE" stroke-width="1" stroke-dasharray="3 3"/><text x="711.0" y="316" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">+0.25</text><text x="30" y="135" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Muscle size</text><text x="30" y="152" font-size="11.5" fill="#2E8B57" font-weight="bold" text-anchor="start">no interference</text><line x1="522.4" y1="130" x2="678.8" y2="130" stroke="#2E8B57" stroke-width="3"/><circle cx="591.4" cy="130" r="7" fill="#2E8B57"/><text x="30" y="195" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Maximal strength</text><text x="30" y="212" font-size="11.5" fill="#2E8B57" font-weight="bold" text-anchor="start">no interference</text><line x1="504.0" y1="190" x2="637.4" y2="190" stroke="#2E8B57" stroke-width="3"/><circle cx="568.4" cy="190" r="7" fill="#2E8B57"/><text x="30" y="255" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Explosive strength</text><text x="30" y="272" font-size="11.5" fill="#C2185B" font-weight="bold" text-anchor="start">small interference</text><line x1="375.20000000000005" y1="250" x2="559.2" y2="250" stroke="#C2185B" stroke-width="3"/><circle cx="467.2" cy="250" r="7" fill="#C2185B"/><text x="30" y="360" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">The explosive-strength effect appeared with sessions &lt; 20 min apart, not ≥ 3 h apart. Order made no clear difference.</text><text x="30" y="382" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">Study quality was medium; treat the explosive result as a caution, not a rule.</text></svg>