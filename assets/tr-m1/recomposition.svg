<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="400" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Body recomposition: same weight, different body</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Illustrative. The scale barely moves; the waist and strength do.</text><rect x="90" y="290" width="110" height="40" rx="0" fill="#E4EAF2" stroke="none" stroke-width="1"/><text x="145" y="314.0" font-size="9.5" fill="#5B6672" font-weight="normal" text-anchor="middle">bone, organs, water</text><rect x="90" y="180" width="110" height="110" rx="0" fill="#FBE4EE" stroke="#C2185B" stroke-width="1"/><text x="145" y="239.0" font-size="12" fill="#C2185B" font-weight="bold" text-anchor="middle">muscle</text><rect x="90" y="90" width="110" height="90" rx="0" fill="#FFF1D6" stroke="#B7791F" stroke-width="1"/><text x="145" y="139.0" font-size="12" fill="#B7791F" font-weight="bold" text-anchor="middle">fat</text><text x="145" y="350" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="middle">Week 0</text><rect x="260" y="290" width="110" height="40" rx="0" fill="#E4EAF2" stroke="none" stroke-width="1"/><text x="315" y="314.0" font-size="9.5" fill="#5B6672" font-weight="normal" text-anchor="middle">bone, organs, water</text><rect x="260" y="165" width="110" height="125" rx="0" fill="#FBE4EE" stroke="#C2185B" stroke-width="1"/><text x="315" y="231.5" font-size="12" fill="#C2185B" font-weight="bold" text-anchor="middle">muscle</text><rect x="260" y="100" width="110" height="65" rx="0" fill="#FFF1D6" stroke="#B7791F" stroke-width="1"/><text x="315" y="136.5" font-size="12" fill="#B7791F" font-weight="bold" text-anchor="middle">fat</text><text x="315" y="350" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="middle">Week 12</text><text x="195" y="80" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="middle">≈ same body weight</text><text x="450" y="110" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Most likely in people who are:</text><circle cx="458" cy="136" r="4" fill="#2E8B57"/><text x="472" y="140" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">new to lifting</text><circle cx="458" cy="164" r="4" fill="#2E8B57"/><text x="472" y="168" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">returning after a break</text><circle cx="458" cy="192" r="4" fill="#2E8B57"/><text x="472" y="196" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">carrying more body fat</text><text x="450" y="240" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">And it needs:</text><circle cx="458" cy="266" r="4" fill="#C2185B"/><text x="472" y="270" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">enough protein (Module 9)</text><circle cx="458" cy="294" r="4" fill="#C2185B"/><text x="472" y="298" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">progressive resistance training</text><circle cx="458" cy="322" r="4" fill="#C2185B"/><text x="472" y="326" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">a moderate deficit, not a crash diet</text></svg>