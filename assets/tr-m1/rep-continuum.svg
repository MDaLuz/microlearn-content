<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="400" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Loads, reps and what they build</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Approximate. Muscle grows across a wide range when sets end close to failure.</text><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#C2185B"/><stop offset="1" stop-color="#2E8B57"/></linearGradient></defs><rect x="60" y="250" width="700" height="16" rx="8" fill="url(#g)" stroke="none" stroke-width="1"/><text x="60" y="290" font-size="12" fill="#C2185B" font-weight="bold" text-anchor="start">Heavy (≥ ~80% of 1RM)</text><text x="760" y="290" font-size="12" fill="#2E8B57" font-weight="bold" text-anchor="end">Light (~30–40% of 1RM)</text><line x1="144.0" y1="246" x2="144.0" y2="270" stroke="#FFF" stroke-width="2"/><text x="144.0" y="312" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="middle">1–5 reps</text><line x1="375.0" y1="246" x2="375.0" y2="270" stroke="#FFF" stroke-width="2"/><text x="375.0" y="312" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="middle">6–12 reps</text><line x1="620.0" y1="246" x2="620.0" y2="270" stroke="#FFF" stroke-width="2"/><text x="620.0" y="312" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="middle">12–30 reps</text><rect x="60.0" y="96" width="294.0" height="34" rx="17" fill="#C2185B" stroke="none" stroke-width="1" fill-opacity="0.22"/><text x="207.0" y="118" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="middle">Maximal strength: best here</text><rect x="235.0" y="146" width="490.0" height="34" rx="17" fill="#B7791F" stroke="none" stroke-width="1" fill-opacity="0.25"/><text x="480.0" y="168" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="middle">Muscle growth: similar across this range, if sets end near failure</text><rect x="550.0" y="196" width="210.0" height="34" rx="17" fill="#2E8B57" stroke="none" stroke-width="1" fill-opacity="0.25"/><text x="655.0" y="218" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="middle">Muscular endurance</text><text x="30" y="360" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">Very light loads (~20% of 1RM) built less muscle in studies: light, but not too light.</text><text x="30" y="382" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="start">ACSM 2026: strength ≥ ~80% of 1RM, 2–3 sets; muscle ~10 sets per muscle group per week.</text></svg>