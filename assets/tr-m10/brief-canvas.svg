<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="400" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Your training brief</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">One page, four boxes. Every programme decision traces back to it.</text><rect x="30" y="86" width="370" height="136" rx="12" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4"/><text x="46" y="116" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="start">Goal</text><text x="46" y="148" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">One priority (Module 1)</text><text x="46" y="172" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">One 12-week measure,</text><text x="46" y="196" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">e.g. waist −4 cm</text><rect x="420" y="86" width="370" height="136" rx="12" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4"/><text x="436" y="116" font-size="16" fill="#B7791F" font-weight="bold" text-anchor="start">Constraints</text><text x="436" y="148" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Training days and minutes</text><text x="436" y="172" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Sport days</text><text x="436" y="196" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Anything to work around</text><rect x="30" y="236" width="370" height="136" rx="12" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4"/><text x="46" y="266" font-size="16" fill="#2E8B57" font-weight="bold" text-anchor="start">Kit</text><text x="46" y="298" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Weights and space (Module 3)</text><text x="46" y="322" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Next purchase, if needed</text><rect x="420" y="236" width="370" height="136" rx="12" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4"/><text x="436" y="266" font-size="16" fill="#C2185B" font-weight="bold" text-anchor="start">Baseline</text><text x="436" y="298" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Module 0 test results</text><text x="436" y="322" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Dated, same conditions</text><text x="436" y="346" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">for the re-test</text></svg>