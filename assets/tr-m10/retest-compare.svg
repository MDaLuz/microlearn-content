<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="380" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Baseline vs week 12</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Illustrative example: same tests, same conditions.</text><text x="330" y="96" font-size="13.5" fill="#5B6672" font-weight="bold" text-anchor="middle">Baseline</text><text x="450" y="96" font-size="13.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Week 12</text><rect x="30" y="112" width="500" height="32" rx="4" fill="#F7F4EE" stroke="none" stroke-width="1"/><text x="42" y="133" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start">Push-ups (near failure)</text><text x="330" y="133" font-size="13" fill="#5B6672" font-weight="normal" text-anchor="middle">15</text><text x="450" y="133" font-size="13.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle">25</text><text x="505" y="133" font-size="13" fill="#2E8B57" font-weight="bold" text-anchor="middle">▲</text><rect x="30" y="150" width="500" height="32" rx="4" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="42" y="171" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start">Goblet squats at set weight</text><text x="330" y="171" font-size="13" fill="#5B6672" font-weight="normal" text-anchor="middle">20</text><text x="450" y="171" font-size="13.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle">30</text><text x="505" y="171" font-size="13" fill="#2E8B57" font-weight="bold" text-anchor="middle">▲</text><rect x="30" y="188" width="500" height="32" rx="4" fill="#F7F4EE" stroke="none" stroke-width="1"/><text x="42" y="209" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start">Plank hold</text><text x="330" y="209" font-size="13" fill="#5B6672" font-weight="normal" text-anchor="middle">40 s</text><text x="450" y="209" font-size="13.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle">75 s</text><text x="505" y="209" font-size="13" fill="#2E8B57" font-weight="bold" text-anchor="middle">▲</text><rect x="30" y="226" width="500" height="32" rx="4" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="42" y="247" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start">Resting heart rate</text><text x="330" y="247" font-size="13" fill="#5B6672" font-weight="normal" text-anchor="middle">68</text><text x="450" y="247" font-size="13.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle">62</text><text x="505" y="247" font-size="13" fill="#2E8B57" font-weight="bold" text-anchor="middle">▼</text><rect x="30" y="264" width="500" height="32" rx="4" fill="#F7F4EE" stroke="none" stroke-width="1"/><text x="42" y="285" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start">Waist</text><text x="330" y="285" font-size="13" fill="#5B6672" font-weight="normal" text-anchor="middle">96 cm</text><text x="450" y="285" font-size="13.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle">91 cm</text><text x="505" y="285" font-size="13" fill="#2E8B57" font-weight="bold" text-anchor="middle">▼</text><rect x="560" y="112" width="230" height="186" rx="10" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4"/><text x="675.0" y="167.3" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Next block</text><text x="675.0" y="184.20000000000002" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="middle">new goal or priority</text><text x="675.0" y="201.10000000000002" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="middle">harder variations</text><text x="675.0" y="218.0" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="middle">or new kit</text><text x="675.0" y="234.90000000000003" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="middle">fix sleep, protein,</text><text x="675.0" y="251.8" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="middle">steps if stalled</text><text x="30" y="366" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Then write a new brief and start the next 12-week cycle.</text></svg>