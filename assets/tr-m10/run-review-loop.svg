<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="360" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">The weekly and 4-week loop</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Small, regular checks; one change at a time.</text><rect x="60" y="110" width="220" height="90" rx="10" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.4"/><text x="170.0" y="150.8" font-size="14" fill="#2F7FB3" font-weight="bold" text-anchor="middle">Train and log</text><text x="170.0" y="169.0" font-size="14" fill="#2F7FB3" font-weight="bold" text-anchor="middle">weight · reps · RIR</text><rect x="320" y="110" width="200" height="90" rx="10" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4"/><text x="420.0" y="150.8" font-size="14" fill="#2E8B57" font-weight="bold" text-anchor="middle">Weekly check</text><text x="420.0" y="169.0" font-size="14" fill="#2E8B57" font-weight="bold" text-anchor="middle">5 minutes, load helper</text><rect x="560" y="110" width="220" height="90" rx="10" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4"/><text x="670.0" y="150.8" font-size="14" fill="#B7791F" font-weight="bold" text-anchor="middle">4-week review</text><text x="670.0" y="169.0" font-size="14" fill="#B7791F" font-weight="bold" text-anchor="middle">improved · stalled · change</text><line x1="282" y1="155" x2="316" y2="155" stroke="#1B2430" stroke-width="2" marker-end="url(#ar)"/><line x1="522" y1="155" x2="556" y2="155" stroke="#1B2430" stroke-width="2" marker-end="url(#ar)"/><path d="M670,202 C670,300 170,300 170,206" stroke="#1B2430" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="170" y1="216" x2="170" y2="204" stroke="#1B2430" stroke-width="2" marker-end="url(#ar)"/><text x="420" y="290" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">back to training with one change</text><text x="30" y="346" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Weekly log also includes average weight, steps and sleep.</text></svg>