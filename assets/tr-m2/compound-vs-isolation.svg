<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="400" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Compound first, isolation if time allows</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Compound: several joints and muscles. Isolation: one joint, one muscle.</text><rect x="30" y="86" width="370" height="280" rx="12" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4"/><text x="48" y="114" font-size="16" fill="#C2185B" font-weight="bold" text-anchor="start">Compound</text><text x="382" y="114" font-size="11.5" fill="#1B2430" font-weight="normal" text-anchor="end">most of the session</text><text x="48" y="146" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Goblet squat</text><text x="220" y="146" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">quads, glutes, core</text><text x="48" y="182" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Romanian deadlift</text><text x="220" y="182" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">glutes, hamstrings, back</text><text x="48" y="218" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Push-up</text><text x="220" y="218" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">chest, shoulders, triceps</text><text x="48" y="254" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">One-arm row</text><text x="220" y="254" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">lats, upper back, biceps</text><text x="48" y="290" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Overhead press</text><text x="220" y="290" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">shoulders, triceps, core</text><text x="48" y="326" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Swing</text><text x="220" y="326" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">glutes, hamstrings, back</text><rect x="420" y="86" width="370" height="280" rx="12" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.4"/><text x="438" y="114" font-size="16" fill="#2F7FB3" font-weight="bold" text-anchor="start">Isolation</text><text x="772" y="114" font-size="11.5" fill="#1B2430" font-weight="normal" text-anchor="end">if time allows, at the end</text><text x="438" y="146" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Curl</text><text x="610" y="146" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">biceps</text><text x="438" y="182" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Triceps extension</text><text x="610" y="182" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">triceps</text><text x="438" y="218" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Lateral raise</text><text x="610" y="218" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">side of shoulders</text><text x="438" y="254" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Calf raise</text><text x="610" y="254" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">calves</text></svg>