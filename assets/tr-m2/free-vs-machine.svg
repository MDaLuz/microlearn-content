<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="440" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Free weights, machines, bodyweight</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Trade-offs, not winners. ●●● most, ● least.</text><rect x="30" y="90" width="760" height="32" rx="4" fill="#1F3A5F" stroke="none" stroke-width="1"/><text x="42" y="111" font-size="13" fill="#FFF" font-weight="bold" text-anchor="start"></text><text x="405.0" y="111" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">Machines</text><text x="560.0" y="111" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">Free weights</text><text x="715.0" y="111" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">Bodyweight</text><rect x="30" y="122" width="760" height="38" rx="0" fill="#FFF" stroke="#E3E8EE" stroke-width="1"/><text x="42" y="146" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Stability you must provide</text><text x="405.0" y="147" font-size="15" fill="#5B6672" font-weight="bold" text-anchor="middle">●</text><text x="560.0" y="147" font-size="15" fill="#C2185B" font-weight="bold" text-anchor="middle">●●●</text><text x="715.0" y="147" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="middle">●●</text><rect x="30" y="160" width="760" height="38" rx="0" fill="#F7F9FB" stroke="#E3E8EE" stroke-width="1"/><text x="42" y="184" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Easy to learn</text><text x="405.0" y="185" font-size="15" fill="#5B6672" font-weight="bold" text-anchor="middle">●●●</text><text x="560.0" y="185" font-size="15" fill="#C2185B" font-weight="bold" text-anchor="middle">●●</text><text x="715.0" y="185" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="middle">●●</text><rect x="30" y="198" width="760" height="38" rx="0" fill="#FFF" stroke="#E3E8EE" stroke-width="1"/><text x="42" y="222" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Carry-over to daily movement</text><text x="405.0" y="223" font-size="15" fill="#5B6672" font-weight="bold" text-anchor="middle">●</text><text x="560.0" y="223" font-size="15" fill="#C2185B" font-weight="bold" text-anchor="middle">●●●</text><text x="715.0" y="223" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="middle">●●●</text><rect x="30" y="236" width="760" height="38" rx="0" fill="#F7F9FB" stroke="#E3E8EE" stroke-width="1"/><text x="42" y="260" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Safe to push close to failure</text><text x="405.0" y="261" font-size="15" fill="#5B6672" font-weight="bold" text-anchor="middle">●●●</text><text x="560.0" y="261" font-size="15" fill="#C2185B" font-weight="bold" text-anchor="middle">●●</text><text x="715.0" y="261" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="middle">●●●</text><rect x="30" y="274" width="760" height="38" rx="0" fill="#FFF" stroke="#E3E8EE" stroke-width="1"/><text x="42" y="298" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Easy to add load over time</text><text x="405.0" y="299" font-size="15" fill="#5B6672" font-weight="bold" text-anchor="middle">●●●</text><text x="560.0" y="299" font-size="15" fill="#C2185B" font-weight="bold" text-anchor="middle">●●●</text><text x="715.0" y="299" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="middle">●</text><rect x="30" y="312" width="760" height="38" rx="0" fill="#F7F9FB" stroke="#E3E8EE" stroke-width="1"/><text x="42" y="336" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Home-friendly</text><text x="405.0" y="337" font-size="15" fill="#5B6672" font-weight="bold" text-anchor="middle">●</text><text x="560.0" y="337" font-size="15" fill="#C2185B" font-weight="bold" text-anchor="middle">●●●</text><text x="715.0" y="337" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="middle">●●●</text><rect x="30" y="368" width="760" height="52" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><text x="46" y="390" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Haugen et al. 2023 (13 studies): no overall difference in muscle growth or jump height.</text><text x="46" y="409" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">Strength gains were greatest on the kind of equipment trained with.</text></svg>