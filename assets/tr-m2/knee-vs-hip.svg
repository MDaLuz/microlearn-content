<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="500" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Knee-dominant squat vs hip-dominant hinge</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Side view. Both bend the hips and knees; the balance between them differs.</text><rect x="40" y="86" width="360" height="360" rx="14" fill="#DDF2E5" stroke="none" stroke-width="1" fill-opacity="0.5"/><rect x="420" y="86" width="360" height="360" rx="14" fill="#FBE4EE" stroke="none" stroke-width="1" fill-opacity="0.5"/><ellipse cx="224" cy="289" rx="40" ry="12" transform="rotate(12 224 289)" fill="#2E8B57" fill-opacity="0.55"/><ellipse cx="570" cy="288" rx="40" ry="12" transform="rotate(45 570 288)" fill="#C2185B" fill-opacity="0.55"/><line x1="228" y1="164" x2="216" y2="192" stroke="#1B2430" stroke-width="6" stroke-linecap="round"/><line x1="216" y1="192" x2="182" y2="280" stroke="#1B2430" stroke-width="6" stroke-linecap="round"/><line x1="182" y1="280" x2="265" y2="298" stroke="#1B2430" stroke-width="6" stroke-linecap="round"/><line x1="265" y1="298" x2="220" y2="370" stroke="#1B2430" stroke-width="6" stroke-linecap="round"/><line x1="220" y1="370" x2="262" y2="370" stroke="#1B2430" stroke-width="6" stroke-linecap="round"/><line x1="216" y1="192" x2="244" y2="214" stroke="#1B2430" stroke-width="6" stroke-linecap="round"/><circle cx="228" cy="164" r="15" fill="#FFF" stroke="#1B2430" stroke-width="5"/><circle cx="244" cy="226" r="13" fill="#5B6672"/><path d="M236,216 Q244,204 252,216" stroke="#5B6672" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="668" y1="200" x2="640" y2="218" stroke="#1B2430" stroke-width="6" stroke-linecap="round"/><line x1="640" y1="218" x2="542" y2="258" stroke="#1B2430" stroke-width="6" stroke-linecap="round"/><line x1="542" y1="258" x2="602" y2="318" stroke="#1B2430" stroke-width="6" stroke-linecap="round"/><line x1="602" y1="318" x2="590" y2="370" stroke="#1B2430" stroke-width="6" stroke-linecap="round"/><line x1="590" y1="370" x2="632" y2="370" stroke="#1B2430" stroke-width="6" stroke-linecap="round"/><line x1="640" y1="218" x2="638" y2="300" stroke="#1B2430" stroke-width="6" stroke-linecap="round"/><circle cx="668" cy="200" r="15" fill="#FFF" stroke="#1B2430" stroke-width="5"/><circle cx="638" cy="312" r="13" fill="#5B6672"/><path d="M630,302 Q638,290 646,302" stroke="#5B6672" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="60" y1="373" x2="380" y2="373" stroke="#C9C0B0" stroke-width="2"/><line x1="440" y1="373" x2="760" y2="373" stroke="#C9C0B0" stroke-width="2"/><text x="220" y="116" font-size="16" fill="#2E8B57" font-weight="bold" text-anchor="middle">Goblet squat</text><text x="600" y="116" font-size="16" fill="#C2185B" font-weight="bold" text-anchor="middle">Romanian deadlift</text><text x="60" y="404" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Knees travel forward, torso upright</text><text x="60" y="422" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Most work: quadriceps</text><text x="440" y="404" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Hips back, shins near vertical, flat back</text><text x="440" y="422" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Most work: glutes and hamstrings</text><text x="30" y="484" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Put one of each in every session. Lunges and step-ups sit in between.</text></svg>