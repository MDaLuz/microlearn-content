<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="520" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Seven movement patterns</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Plan by pattern and every muscle group gets covered. A teaching model; coaches' lists vary.</text><path d="M410.0,225.0 L410.0,100.0 A195,195 0 0 1 562.5,173.4 L464.7,251.4 A70,70 0 0 0 410.0,225.0 Z" fill="#2E8B57" fill-opacity="0.16" stroke="#FFFFFF" stroke-width="3"/><text x="470.0928978677818" y="166.21581179551495" font-size="14" fill="#2E8B57" font-weight="bold" text-anchor="middle">Squat</text><text x="470.0928978677818" y="183.21581179551495" font-size="10" fill="#1B2430" font-weight="normal" text-anchor="middle">goblet squat</text><path d="M464.7,251.4 L562.5,173.4 A195,195 0 0 1 600.1,338.4 L478.2,310.6 A70,70 0 0 0 464.7,251.4 Z" fill="#C2185B" fill-opacity="0.16" stroke="#FFFFFF" stroke-width="3"/><text x="545.0275158371826" y="260.1808506470505" font-size="14" fill="#C2185B" font-weight="bold" text-anchor="middle">Hinge</text><text x="545.0275158371826" y="277.1808506470505" font-size="10" fill="#1B2430" font-weight="normal" text-anchor="middle">swing · Romanian deadlift</text><path d="M478.2,310.6 L600.1,338.4 A195,195 0 0 1 494.6,470.7 L440.4,358.1 A70,70 0 0 0 478.2,310.6 Z" fill="#B7791F" fill-opacity="0.16" stroke="#FFFFFF" stroke-width="3"/><text x="518.2836603218221" y="377.3533375574346" font-size="14" fill="#B7791F" font-weight="bold" text-anchor="middle">Lunge</text><text x="518.2836603218221" y="394.3533375574346" font-size="10" fill="#1B2430" font-weight="normal" text-anchor="middle">reverse lunge</text><path d="M440.4,358.1 L494.6,470.7 A195,195 0 0 1 325.4,470.7 L379.6,358.1 A70,70 0 0 0 440.4,358.1 Z" fill="#2F7FB3" fill-opacity="0.16" stroke="#FFFFFF" stroke-width="3"/><text x="410.0" y="429.5" font-size="14" fill="#2F7FB3" font-weight="bold" text-anchor="middle">Push</text><text x="410.0" y="446.5" font-size="10" fill="#1B2430" font-weight="normal" text-anchor="middle">push-up · overhead press</text><path d="M379.6,358.1 L325.4,470.7 A195,195 0 0 1 219.9,338.4 L341.8,310.6 A70,70 0 0 0 379.6,358.1 Z" fill="#1F3A5F" fill-opacity="0.16" stroke="#FFFFFF" stroke-width="3"/><text x="301.71633967817786" y="377.3533375574346" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Pull</text><text x="301.71633967817786" y="394.3533375574346" font-size="10" fill="#1B2430" font-weight="normal" text-anchor="middle">one-arm row</text><path d="M341.8,310.6 L219.9,338.4 A195,195 0 0 1 257.5,173.4 L355.3,251.4 A70,70 0 0 0 341.8,310.6 Z" fill="#8A6D3B" fill-opacity="0.16" stroke="#FFFFFF" stroke-width="3"/><text x="274.9724841628174" y="260.1808506470505" font-size="14" fill="#8A6D3B" font-weight="bold" text-anchor="middle">Carry</text><text x="274.9724841628174" y="277.1808506470505" font-size="10" fill="#1B2430" font-weight="normal" text-anchor="middle">farmer's carry</text><path d="M355.3,251.4 L257.5,173.4 A195,195 0 0 1 410.0,100.0 L410.0,225.0 A70,70 0 0 0 355.3,251.4 Z" fill="#5B6672" fill-opacity="0.16" stroke="#FFFFFF" stroke-width="3"/><text x="349.9071021322182" y="166.21581179551498" font-size="14" fill="#5B6672" font-weight="bold" text-anchor="middle">Rotate / resist</text><text x="349.9071021322182" y="183.21581179551498" font-size="10" fill="#1B2430" font-weight="normal" text-anchor="middle">side plank · Pallof press</text><circle cx="410" cy="295" r="64" fill="#FFF" stroke="#E3E8EE"/><text x="410" y="291" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">full-body</text><text x="410" y="308" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">week</text></svg>