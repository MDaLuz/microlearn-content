<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="420" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Push and pull, two directions each</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Aim for roughly as many pulling sets as pushing sets each week (coaching practice).</text><text x="320.0" y="90" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="middle">Horizontal</text><text x="620.0" y="90" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="middle">Vertical</text><text x="150" y="165.0" font-size="15" fill="#1B2430" font-weight="bold" text-anchor="end">Push</text><rect x="176" y="106" width="288" height="108" rx="10" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.4"/><text x="320.0" y="165.0" font-size="13.5" fill="#2F7FB3" font-weight="bold" text-anchor="middle">Push-up · floor press</text><rect x="476" y="106" width="288" height="108" rx="10" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.4"/><text x="620.0" y="165.0" font-size="13.5" fill="#2F7FB3" font-weight="bold" text-anchor="middle">Overhead press (DB or KB)</text><text x="150" y="285.0" font-size="15" fill="#1B2430" font-weight="bold" text-anchor="end">Pull</text><rect x="176" y="226" width="288" height="108" rx="10" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4"/><text x="320.0" y="285.0" font-size="13.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle">One-arm row · renegade row</text><rect x="476" y="226" width="288" height="108" rx="10" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4"/><text x="620.0" y="280.0" font-size="13.5" fill="#B7791F" font-weight="bold" text-anchor="middle">Band pulldown · door-frame bar</text><text x="620.0" y="302.0" font-size="11.5" fill="#B7791F" font-weight="normal" text-anchor="middle">needs a band or a bar</text><text x="30" y="402" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Without a pull-up bar, rows cover most of the back; a high-anchored band adds the vertical pull.</text></svg>