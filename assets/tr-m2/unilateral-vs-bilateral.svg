<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="420" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">One side or both: what the evidence shows</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Liao et al. 2022, 14 studies, ages 16–26. Effect size (ES), unilateral vs bilateral training.</text><line x1="570.0" y1="92" x2="570.0" y2="330" stroke="#5B6672" stroke-width="1.5"/><line x1="420.0" y1="96" x2="420.0" y2="330" stroke="#E3E8EE" stroke-width="1" stroke-dasharray="3 3"/><text x="420.0" y="348" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">-1.0</text><line x1="495.0" y1="96" x2="495.0" y2="330" stroke="#E3E8EE" stroke-width="1" stroke-dasharray="3 3"/><text x="495.0" y="348" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">-0.5</text><line x1="645.0" y1="96" x2="645.0" y2="330" stroke="#E3E8EE" stroke-width="1" stroke-dasharray="3 3"/><text x="645.0" y="348" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">+0.5</text><line x1="720.0" y1="96" x2="720.0" y2="330" stroke="#E3E8EE" stroke-width="1" stroke-dasharray="3 3"/><text x="720.0" y="348" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">+1.0</text><text x="465.0" y="86" font-size="11.5" fill="#2F7FB3" font-weight="bold" text-anchor="middle">← favours both sides</text><text x="675.0" y="86" font-size="11.5" fill="#B7791F" font-weight="bold" text-anchor="middle">favours one side →</text><text x="30" y="125" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Two-sided strength</text><line x1="463.5" y1="120" x2="549.0" y2="120" stroke="#2F7FB3" stroke-width="3"/><circle cx="505.5" cy="120" r="7" fill="#2F7FB3"/><text x="30" y="169" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">One-legged jump</text><line x1="648.0" y1="164" x2="759.0" y2="164" stroke="#B7791F" stroke-width="3"/><circle cx="703.5" cy="164" r="7" fill="#B7791F"/><text x="30" y="213" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">One-sided strength</text><line x1="565.5" y1="208" x2="652.5" y2="208" stroke="#5B6672" stroke-width="3"/><circle cx="609.0" cy="208" r="7" fill="#5B6672"/><text x="30" y="257" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Change of direction</text><line x1="568.5" y1="252" x2="664.5" y2="252" stroke="#5B6672" stroke-width="3"/><circle cx="616.5" cy="252" r="7" fill="#5B6672"/><text x="30" y="301" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Sprint</text><line x1="501.0" y1="296" x2="601.5" y2="296" stroke="#5B6672" stroke-width="3"/><circle cx="552.0" cy="296" r="7" fill="#5B6672"/><text x="30" y="382" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Grey: no clear difference. Training carries over best to the way you trained.</text><text x="30" y="404" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">At home, one-sided work makes light weights harder and trains balance for sport.</text></svg>