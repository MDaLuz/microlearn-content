<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="330" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">A buying order that follows the bottleneck</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Re-check what limits you every 4–8 weeks.</text><rect x="30" y="96" width="238" height="180" rx="12" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4"/><text x="46" y="126" font-size="16" fill="#C2185B" font-weight="bold" text-anchor="start">Now</text><text x="46" y="160" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Heavier load for</text><text x="46" y="179" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">legs and hips</text><text x="46" y="216" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">16 or 20 kg kettlebell,</text><text x="46" y="233" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">or adjustable dumbbells</text><line x1="270" y1="185" x2="288" y2="185" stroke="#5B6672" stroke-width="1.8" marker-end="url(#ar)"/><rect x="292" y="96" width="238" height="180" rx="12" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4"/><text x="308" y="126" font-size="16" fill="#B7791F" font-weight="bold" text-anchor="start">After 4–8 weeks</text><text x="308" y="160" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Bands; a pull-up bar</text><text x="308" y="179" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">if the door allows</text><text x="308" y="216" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">fills the vertical-pull gap</text><line x1="532" y1="185" x2="550" y2="185" stroke="#5B6672" stroke-width="1.8" marker-end="url(#ar)"/><rect x="554" y="96" width="238" height="180" rx="12" fill="#EEF1F4" stroke="#5B6672" stroke-width="1.4"/><text x="570" y="126" font-size="16" fill="#5B6672" font-weight="bold" text-anchor="start">Later</text><text x="570" y="160" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Bench, more kettlebells,</text><text x="570" y="179" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">floor tiles</text><text x="570" y="216" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">when the floor or a bell</text><text x="570" y="233" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">limits you</text><text x="30" y="308" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Second-hand cast-iron kettlebells and plates are usually fine: check for cracks and rough handles.</text></svg>