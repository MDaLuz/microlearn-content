<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="420" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Fixed, spin-lock or selector dumbbells</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">General trade-offs; individual models vary.</text><rect x="30" y="90" width="760" height="32" rx="4" fill="#1F3A5F" stroke="none" stroke-width="1"/><text x="42" y="111" font-size="13" fill="#FFF" font-weight="bold" text-anchor="start"></text><text x="330.0" y="111" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">Fixed</text><text x="510.0" y="111" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">Spin-lock</text><text x="695.0" y="111" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">Selector</text><rect x="30" y="122" width="760" height="40" rx="0" fill="#FFF" stroke="#E3E8EE" stroke-width="1"/><text x="42" y="147" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Change speed</text><text x="330.0" y="147" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">instant</text><text x="510.0" y="147" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">slow (collars)</text><text x="695.0" y="147" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">fast (dial or pin)</text><rect x="30" y="162" width="760" height="40" rx="0" fill="#F7F9FB" stroke="#E3E8EE" stroke-width="1"/><text x="42" y="187" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Space for a full range</text><text x="330.0" y="187" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">large</text><text x="510.0" y="187" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">small</text><text x="695.0" y="187" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">small</text><rect x="30" y="202" width="760" height="40" rx="0" fill="#FFF" stroke="#E3E8EE" stroke-width="1"/><text x="42" y="227" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Cost for a full range</text><text x="330.0" y="227" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">high</text><text x="510.0" y="227" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">low</text><text x="695.0" y="227" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">medium–high</text><rect x="30" y="242" width="760" height="40" rx="0" fill="#F7F9FB" stroke="#E3E8EE" stroke-width="1"/><text x="42" y="267" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Durability</text><text x="330.0" y="267" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">very high</text><text x="510.0" y="267" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">high, check collars</text><text x="695.0" y="267" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">avoid dropping</text><rect x="30" y="282" width="760" height="40" rx="0" fill="#FFF" stroke="#E3E8EE" stroke-width="1"/><text x="42" y="307" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Feel in the hand</text><text x="330.0" y="307" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">compact</text><text x="510.0" y="307" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">long bar</text><text x="695.0" y="307" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">bulky</text><rect x="30" y="322" width="760" height="40" rx="0" fill="#F7F9FB" stroke="#E3E8EE" stroke-width="1"/><text x="42" y="347" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Small weight steps</text><text x="330.0" y="347" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">pairs needed</text><text x="510.0" y="347" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">yes, with small plates</text><text x="695.0" y="347" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">yes, 1–2.5 kg</text><text x="30" y="402" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">For lower-body moves, plan for about 20–30 kg per hand eventually (practice estimate; test sets decide).</text></svg>