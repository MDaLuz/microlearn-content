<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="430" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Extras: what each adds</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Practice guidance; follow each product's load rating and fitting instructions.</text><rect x="30" y="90" width="760" height="56" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><rect x="30" y="90" width="8" height="56" rx="3" fill="#2E8B57" stroke="none" stroke-width="1"/><text x="52" y="114" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Mat (6–10 mm)</text><rect x="52" y="122" width="69.6" height="18" rx="9" fill="#FFF" stroke="#2E8B57" stroke-width="1"/><text x="57" y="135" font-size="11" fill="#2E8B57" font-weight="bold" text-anchor="start">essential</text><text x="290" y="124" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Comfort for floor work, core and yoga</text><rect x="30" y="154" width="760" height="56" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><rect x="30" y="154" width="8" height="56" rx="3" fill="#2E8B57" stroke="none" stroke-width="1"/><text x="52" y="178" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Resistance bands</text><rect x="52" y="186" width="69.6" height="18" rx="9" fill="#FFF" stroke="#2E8B57" stroke-width="1"/><text x="57" y="199" font-size="11" fill="#2E8B57" font-weight="bold" text-anchor="start">early buy</text><text x="290" y="188" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Cheap and portable; adds pulling and extra load</text><rect x="30" y="218" width="760" height="56" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><rect x="30" y="218" width="8" height="56" rx="3" fill="#B7791F" stroke="none" stroke-width="1"/><text x="52" y="242" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Door-frame bar</text><rect x="52" y="250" width="127.2" height="18" rx="9" fill="#FFF" stroke="#B7791F" stroke-width="1"/><text x="57" y="263" font-size="11" fill="#B7791F" font-weight="bold" text-anchor="start">if the door allows</text><text x="290" y="252" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Adds vertical pulling; needs a solid frame, can mark trim</text><rect x="30" y="282" width="760" height="56" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><rect x="30" y="282" width="8" height="56" rx="3" fill="#5B6672" stroke="none" stroke-width="1"/><text x="52" y="306" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Bench</text><rect x="52" y="314" width="44.0" height="18" rx="9" fill="#FFF" stroke="#5B6672" stroke-width="1"/><text x="57" y="327" font-size="11" fill="#5B6672" font-weight="bold" text-anchor="start">later</text><text x="290" y="316" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Easier rows and incline presses; the floor works at first</text><rect x="30" y="346" width="760" height="56" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><rect x="30" y="346" width="8" height="56" rx="3" fill="#5B6672" stroke="none" stroke-width="1"/><text x="52" y="370" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Rubber tiles</text><rect x="52" y="378" width="88.80000000000001" height="18" rx="9" fill="#FFF" stroke="#5B6672" stroke-width="1"/><text x="57" y="391" font-size="11" fill="#5B6672" font-weight="bold" text-anchor="start">nice to have</text><text x="290" y="380" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Protects the floor under kettlebells</text></svg>