<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="400" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Home kit: starter, next, later</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Buy for what limits you. About 2 × 2 m of floor is enough.</text><rect x="30" y="86" width="240" height="230" rx="12" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4"/><text x="46" y="114" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="start">Starter (example)</text><circle cx="52" cy="146" r="4" fill="#2E8B57"/><text x="64" y="150" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">12 kg kettlebell</text><circle cx="52" cy="190" r="4" fill="#2E8B57"/><text x="64" y="194" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Dumbbells up to 10 kg</text><circle cx="52" cy="234" r="4" fill="#2E8B57"/><text x="64" y="238" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Yoga mat</text><line x1="272" y1="200" x2="286" y2="200" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><rect x="288" y="86" width="240" height="230" rx="12" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4"/><text x="304" y="114" font-size="15" fill="#B7791F" font-weight="bold" text-anchor="start">Likely next</text><circle cx="310" cy="146" r="4" fill="#B7791F"/><text x="322" y="150" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Heavier kettlebell (16 or 20 kg)</text><circle cx="310" cy="190" r="4" fill="#B7791F"/><text x="322" y="194" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Adjustable dumbbells</text><circle cx="310" cy="234" r="4" fill="#B7791F"/><text x="322" y="238" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Resistance bands (3 strengths)</text><line x1="530" y1="200" x2="544" y2="200" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><rect x="546" y="86" width="240" height="230" rx="12" fill="#EEF1F4" stroke="#5B6672" stroke-width="1.4"/><text x="562" y="114" font-size="15" fill="#5B6672" font-weight="bold" text-anchor="start">Optional later</text><circle cx="568" cy="146" r="4" fill="#5B6672"/><text x="580" y="150" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Door-frame pull-up bar</text><circle cx="568" cy="190" r="4" fill="#5B6672"/><text x="580" y="194" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Flat or adjustable bench</text><circle cx="568" cy="234" r="4" fill="#5B6672"/><text x="580" y="238" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Rubber floor tiles</text><text x="30" y="356" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Skip: machines, barbell and rack, treadmill, gadgets.</text><text x="30" y="378" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">Protect the floor under kettlebells; store weights low and away from children.</text></svg>