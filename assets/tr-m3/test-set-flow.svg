<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="400" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Finding a working weight with a test set</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Reps in reserve (RIR): how many more reps you could have done.</text><rect x="30" y="140" width="170" height="70" rx="10" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1.4"/><text x="115.0" y="172.0" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Pick a target</text><text x="115.0" y="188.0" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">e.g. 10–15 reps</text><line x1="200" y1="175" x2="240" y2="175" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><rect x="250" y="140" width="170" height="70" rx="10" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1.4"/><text x="335.0" y="172.0" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Do one set</text><text x="335.0" y="188.0" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">with a guess</text><line x1="420" y1="160" x2="520" y2="110" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><line x1="420" y1="175" x2="520" y2="175" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><line x1="420" y1="190" x2="520" y2="245" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><rect x="530" y="80" width="250" height="56" rx="10" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4"/><text x="655.0" y="113.0" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">More than ~4 left → heavier</text><rect x="530" y="148" width="250" height="56" rx="10" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4"/><text x="655.0" y="181.0" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">1–3 left → your weight</text><rect x="530" y="216" width="250" height="56" rx="10" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4"/><text x="655.0" y="249.0" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Target missed → lighter</text><text x="30" y="362" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Rest 2–3 minutes and retest if needed. First two weeks: err on the light side while learning technique.</text><text x="30" y="384" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">Baseline hint: 20+ goblet squats at 12 kg means 12 kg is too light for 10–15-rep squat sets.</text></svg>