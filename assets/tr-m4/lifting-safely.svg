<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="380" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Picking a weight up from the floor</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Hips back and a flat back; never reach forward with straight legs.</text><rect x="60" y="86" width="330" height="260" rx="14" fill="#DDF2E5" stroke="none" stroke-width="1" fill-opacity="0.45"/><line x1="140" y1="300" x2="350" y2="300" stroke="#CFC7B8" stroke-width="2"/><line x1="200.0" y1="230.0" x2="246.0" y2="256.0" stroke="#A8B0BA" stroke-width="7.5" stroke-linecap="round"/><line x1="246.0" y1="256.0" x2="226.0" y2="300.0" stroke="#A8B0BA" stroke-width="7.5" stroke-linecap="round"/><line x1="226.0" y1="300.0" x2="248.0" y2="300.0" stroke="#A8B0BA" stroke-width="7.5" stroke-linecap="round"/><line x1="256.0" y1="182.0" x2="246.0" y2="222.0" stroke="#A8B0BA" stroke-width="7.5" stroke-linecap="round"/><line x1="246.0" y1="222.0" x2="240.0" y2="270.0" stroke="#A8B0BA" stroke-width="7.5" stroke-linecap="round"/><line x1="256.0" y1="182.0" x2="200.0" y2="230.0" stroke="#1B2430" stroke-width="8.5" stroke-linecap="round"/><line x1="200.0" y1="230.0" x2="250.0" y2="256.0" stroke="#1B2430" stroke-width="7.5" stroke-linecap="round"/><line x1="250.0" y1="256.0" x2="230.0" y2="300.0" stroke="#1B2430" stroke-width="7.5" stroke-linecap="round"/><line x1="230.0" y1="300.0" x2="252.0" y2="300.0" stroke="#1B2430" stroke-width="7.5" stroke-linecap="round"/><line x1="272.0" y1="170.0" x2="256.0" y2="182.0" stroke="#1B2430" stroke-width="7.5" stroke-linecap="round"/><circle cx="272.0" cy="170.0" r="12.0" fill="#FFFFFF" stroke="#1B2430" stroke-width="4.5"/><line x1="256.0" y1="182.0" x2="250.0" y2="222.0" stroke="#1B2430" stroke-width="7.5" stroke-linecap="round"/><line x1="250.0" y1="222.0" x2="242.0" y2="270.0" stroke="#1B2430" stroke-width="7.5" stroke-linecap="round"/><circle cx="242.0" cy="291.5" r="11.0" fill="#5B6672"/><path d="M236.0,284.0 Q242.0,272.0 248.0,284.0" stroke="#5B6672" stroke-width="3.5" fill="none"/><text x="245" y="116" font-size="16" fill="#2E8B57" font-weight="bold" text-anchor="middle">✓ Do</text><text x="245" y="330" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">Hips back, flat back, bell between the feet</text><rect x="430" y="86" width="330" height="260" rx="14" fill="#FBE4EE" stroke="none" stroke-width="1" fill-opacity="0.45"/><line x1="500" y1="300" x2="710" y2="300" stroke="#CFC7B8" stroke-width="2"/><line x1="584.0" y1="204.0" x2="594.0" y2="252.0" stroke="#A8B0BA" stroke-width="7.5" stroke-linecap="round"/><line x1="594.0" y1="252.0" x2="586.0" y2="300.0" stroke="#A8B0BA" stroke-width="7.5" stroke-linecap="round"/><line x1="586.0" y1="300.0" x2="608.0" y2="300.0" stroke="#A8B0BA" stroke-width="7.5" stroke-linecap="round"/><line x1="648.0" y1="200.0" x2="654.0" y2="234.0" stroke="#A8B0BA" stroke-width="7.5" stroke-linecap="round"/><line x1="654.0" y1="234.0" x2="658.0" y2="270.0" stroke="#A8B0BA" stroke-width="7.5" stroke-linecap="round"/><line x1="648.0" y1="200.0" x2="584.0" y2="204.0" stroke="#1B2430" stroke-width="8.5" stroke-linecap="round"/><line x1="584.0" y1="204.0" x2="596.0" y2="252.0" stroke="#1B2430" stroke-width="7.5" stroke-linecap="round"/><line x1="596.0" y1="252.0" x2="590.0" y2="300.0" stroke="#1B2430" stroke-width="7.5" stroke-linecap="round"/><line x1="590.0" y1="300.0" x2="612.0" y2="300.0" stroke="#1B2430" stroke-width="7.5" stroke-linecap="round"/><line x1="668.0" y1="206.0" x2="648.0" y2="200.0" stroke="#1B2430" stroke-width="7.5" stroke-linecap="round"/><circle cx="668.0" cy="206.0" r="12.0" fill="#FFFFFF" stroke="#1B2430" stroke-width="4.5"/><line x1="648.0" y1="200.0" x2="658.0" y2="234.0" stroke="#1B2430" stroke-width="7.5" stroke-linecap="round"/><line x1="658.0" y1="234.0" x2="662.0" y2="270.0" stroke="#1B2430" stroke-width="7.5" stroke-linecap="round"/><circle cx="662.0" cy="291.5" r="11.0" fill="#5B6672"/><path d="M656.0,284.0 Q662.0,272.0 668.0,284.0" stroke="#5B6672" stroke-width="3.5" fill="none"/><path d="M584,204 Q620,172 648,200" stroke="#C2185B" stroke-width="3" fill="none" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/><text x="605" y="116" font-size="16" fill="#C2185B" font-weight="bold" text-anchor="middle">✗ Don't</text><text x="605" y="330" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">Straight legs, rounded back, bell far in front</text><text x="30" y="370" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="start">Brace before you lift, breathe out through the effort, and put the weight down the same way.</text></svg>