<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="380" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Full-body A/B around your sport</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Each big muscle group trained 2–3 times a week. Days are an example.</text><text x="82.0" y="100" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Mon</text><rect x="32" y="110" width="100" height="90" rx="10" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.3"/><text x="82.0" y="150" font-size="12.5" fill="#C2185B" font-weight="bold" text-anchor="middle">Session A</text><text x="190.0" y="100" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Tue</text><rect x="140" y="110" width="100" height="90" rx="10" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.3"/><text x="190.0" y="150" font-size="12.5" fill="#2E8B57" font-weight="bold" text-anchor="middle">Sport</text><text x="298.0" y="100" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Wed</text><rect x="248" y="110" width="100" height="90" rx="10" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.3"/><text x="298.0" y="150" font-size="12.5" fill="#2F7FB3" font-weight="bold" text-anchor="middle">Session B</text><text x="406.0" y="100" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Thu</text><rect x="356" y="110" width="100" height="90" rx="10" fill="#F1F3F5" stroke="#5B6672" stroke-width="1.3"/><text x="406.0" y="150" font-size="12.5" fill="#5B6672" font-weight="bold" text-anchor="middle">Rest</text><text x="406.0" y="166" font-size="12.5" fill="#5B6672" font-weight="bold" text-anchor="middle">or walk</text><text x="514.0" y="100" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Fri</text><rect x="464" y="110" width="100" height="90" rx="10" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.3"/><text x="514.0" y="150" font-size="12.5" fill="#C2185B" font-weight="bold" text-anchor="middle">Session A</text><text x="622.0" y="100" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Sat</text><rect x="572" y="110" width="100" height="90" rx="10" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.3"/><text x="622.0" y="150" font-size="12.5" fill="#2E8B57" font-weight="bold" text-anchor="middle">Sport</text><text x="730.0" y="100" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Sun</text><rect x="680" y="110" width="100" height="90" rx="10" fill="#F1F3F5" stroke="#5B6672" stroke-width="1.3"/><text x="730.0" y="150" font-size="12.5" fill="#5B6672" font-weight="bold" text-anchor="middle">Rest</text><rect x="32" y="220" width="370" height="140" rx="10" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><text x="48" y="246" font-size="14" fill="#C2185B" font-weight="bold" text-anchor="start">Session A</text><text x="48" y="272" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Squat · push</text><text x="48" y="294" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Pull · carry</text><text x="48" y="316" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">e.g. goblet squat, push-up,</text><text x="48" y="338" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">one-arm row, suitcase carry</text><rect x="422" y="220" width="370" height="140" rx="10" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><text x="438" y="246" font-size="14" fill="#2F7FB3" font-weight="bold" text-anchor="start">Session B</text><text x="438" y="272" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Hinge · lunge</text><text x="438" y="294" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Push · pull · core</text><text x="438" y="316" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">e.g. single-leg RDL, reverse lunge,</text><text x="438" y="338" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">floor press, band pulldown, side plank</text></svg>