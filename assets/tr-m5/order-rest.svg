<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="360" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Order and rest at a glance</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Priority first; rest enough to keep the sets hard.</text><circle cx="62" cy="122" r="18" fill="#C2185B"/><text x="62" y="127" font-size="14" fill="#FFF" font-weight="bold" text-anchor="middle">1</text><rect x="90" y="100" width="290" height="44" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><text x="104" y="127" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Priority compound lift</text><circle cx="62" cy="186" r="18" fill="#1F3A5F"/><text x="62" y="191" font-size="14" fill="#FFF" font-weight="bold" text-anchor="middle">2</text><rect x="90" y="164" width="290" height="44" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><text x="104" y="191" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Other compound lifts</text><circle cx="62" cy="250" r="18" fill="#5B6672"/><text x="62" y="255" font-size="14" fill="#FFF" font-weight="bold" text-anchor="middle">3</text><rect x="90" y="228" width="290" height="44" rx="8" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><text x="104" y="255" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Carry, core, isolation</text><text x="430" y="116" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Big lift, same exercise</text><rect x="430" y="124" width="240.0" height="18" rx="4" fill="#2F7FB3" stroke="none" stroke-width="1"/><text x="678.0" y="138" font-size="12" fill="#2F7FB3" font-weight="bold" text-anchor="start">1–2 min</text><text x="430" y="180" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">After a superset pair</text><rect x="430" y="188" width="200.0" height="18" rx="4" fill="#2F7FB3" stroke="none" stroke-width="1"/><text x="638.0" y="202" font-size="12" fill="#2F7FB3" font-weight="bold" text-anchor="start">60–90 s</text><text x="430" y="244" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Small, single-joint move</text><rect x="430" y="252" width="120.0" height="18" rx="4" fill="#2F7FB3" stroke="none" stroke-width="1"/><text x="558.0" y="266" font-size="12" fill="#2F7FB3" font-weight="bold" text-anchor="start">&lt; 1 min</text><text x="30" y="322" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Strength improved most on the exercise done first (2021 meta-analysis); growth didn't depend on order.</text><text x="30" y="344" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">Rest &gt; 60 s may help growth slightly; little extra beyond ~90 s (2024 meta-analysis).</text></svg>