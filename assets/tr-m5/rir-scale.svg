<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="300" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">RPE and reps in reserve</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Resistance-training RPE scale: RPE 10 = no reps left.</text><rect x="278.0" y="120" width="396.0" height="100" rx="10" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.2"/><text x="476.0" y="110" font-size="12.5" fill="#2E8B57" font-weight="bold" text-anchor="middle">usual working zone (1–3 in reserve)</text><line x1="80" y1="150" x2="740" y2="150" stroke="#5B6672" stroke-width="2"/><circle cx="80.0" cy="150" r="9" fill="#1F3A5F"/><text x="80.0" y="186" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="middle">RPE 5</text><text x="80.0" y="206" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="middle">5+ in reserve</text><circle cx="212.0" cy="150" r="9" fill="#1F3A5F"/><text x="212.0" y="186" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="middle">RPE 6</text><text x="212.0" y="206" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="middle">4 in reserve</text><circle cx="344.0" cy="150" r="9" fill="#1F3A5F"/><text x="344.0" y="186" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="middle">RPE 7</text><text x="344.0" y="206" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="middle">3 in reserve</text><circle cx="476.0" cy="150" r="9" fill="#1F3A5F"/><text x="476.0" y="186" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="middle">RPE 8</text><text x="476.0" y="206" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="middle">2 in reserve</text><circle cx="608.0" cy="150" r="9" fill="#1F3A5F"/><text x="608.0" y="186" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="middle">RPE 9</text><text x="608.0" y="206" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="middle">1 in reserve</text><circle cx="740.0" cy="150" r="9" fill="#C2185B"/><text x="740.0" y="186" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="middle">RPE 10</text><text x="740.0" y="206" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="middle">0 in reserve</text><text x="740" y="230" font-size="12" fill="#C2185B" font-weight="bold" text-anchor="middle">failure</text><text x="30" y="286" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Most people underestimate their reps left by about one. Check now and then on a safe exercise.</text></svg>