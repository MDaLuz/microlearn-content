<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="330" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">A 30-minute full-body session</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Protect the main supersets; trim accessories first when time is short.</text><rect x="42.0" y="110" width="119.33333333333331" height="110" rx="10" fill="#EEF1F4" stroke="#5B6672" stroke-width="1.4"/><text x="101.66666666666666" y="156" font-size="13" fill="#5B6672" font-weight="bold" text-anchor="middle">Warm-up</text><text x="101.66666666666666" y="178" font-size="11.5" fill="#1B2430" font-weight="normal" text-anchor="middle">ramp-up sets</text><rect x="165.33333333333331" y="110" width="218.0" height="110" rx="10" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4"/><text x="274.3333333333333" y="156" font-size="13" fill="#C2185B" font-weight="bold" text-anchor="middle">Superset 1</text><text x="274.3333333333333" y="178" font-size="11.5" fill="#1B2430" font-weight="normal" text-anchor="middle">squat + push</text><rect x="387.3333333333333" y="110" width="218.00000000000006" height="110" rx="10" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4"/><text x="496.33333333333337" y="156" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Superset 2</text><text x="496.33333333333337" y="178" font-size="11.5" fill="#1B2430" font-weight="normal" text-anchor="middle">hinge + pull</text><rect x="609.3333333333334" y="110" width="119.33333333333326" height="110" rx="10" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4"/><text x="669.0" y="156" font-size="13" fill="#B7791F" font-weight="bold" text-anchor="middle">Accessories</text><text x="669.0" y="178" font-size="11.5" fill="#1B2430" font-weight="normal" text-anchor="middle">carry or core</text><rect x="732.6666666666666" y="110" width="45.33333333333337" height="110" rx="10" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4"/><text x="755.3333333333333" y="100" font-size="11.5" fill="#2E8B57" font-weight="bold" text-anchor="end">finisher (optional)</text><text x="40.0" y="244" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="middle">0′</text><text x="163.33333333333331" y="244" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="middle">5′</text><text x="385.3333333333333" y="244" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="middle">14′</text><text x="607.3333333333334" y="244" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="middle">23′</text><text x="730.6666666666666" y="244" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="middle">28′</text><text x="780.0" y="244" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="middle">30′</text><text x="30" y="290" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Main lifts: 3 sets of 8–15 at 1–3 reps in reserve; 60–90 s rest after each pair.</text><text x="30" y="312" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">Warm-up: a few dynamic moves, then lighter sets of the first exercise.</text></svg>