<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="540" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">The seven programme dials</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Count hard sets per muscle per week; the dials set how you get them.</text><line x1="410" y1="275" x2="410.0" y2="125.0" stroke="#E3E8EE" stroke-width="2"/><circle cx="410.0" cy="125.0" r="40" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.5"/><path d="M410.0,125.0 L427.8,137.9" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="410.0" y="181.0" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="middle">Exercise</text><text x="410.0" y="196.0" font-size="10.5" fill="#5B6672" font-weight="normal" text-anchor="middle">which movement</text><line x1="410" y1="275" x2="527.2747223702045" y2="181.47652972119" stroke="#E3E8EE" stroke-width="2"/><circle cx="527.3" cy="181.5" r="40" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.5"/><path d="M527.3,181.5 L528.2,203.5" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="527.2747223702045" y="237.47652972119" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="middle">Sets</text><text x="527.2747223702045" y="252.47652972119" font-size="10.5" fill="#5B6672" font-weight="normal" text-anchor="middle">how many rounds</text><line x1="410" y1="275" x2="556.2391868272736" y2="308.37814009344714" stroke="#E3E8EE" stroke-width="2"/><circle cx="556.2" cy="308.4" r="40" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.5"/><path d="M556.2,308.4 L539.7,322.8" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="556.2391868272736" y="364.37814009344714" font-size="13.5" fill="#1B243