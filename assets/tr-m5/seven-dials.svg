p</text><line x1="410" y1="275" x2="292.7252776297955" y2="181.47652972119" stroke="#E3E8EE" stroke-width="2"/><circle cx="292.7" cy="181.5" r="40" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.5"/><path d="M292.7,181.5 L313.9,175.6" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="292.7252776297955" y="237.47652972119" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="middle">Frequency</text><text x="292.7252776297955" y="252.47652972119" font-size="10.5" fill="#5B6672" font-weight="normal" text-anchor="middle">per muscle, per week</text><circle cx="410" cy="275" r="56" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.6"/><text x="410" y="265" font-size="12.5" fill="#C2185B" font-weight="bold" text-anchor="middle">hard sets</text><text x="410" y="280" font-size="12.5" fill="#C2185B" font-weight="bold" text-anchor="middle">per muscle</text><text x="410" y="295" font-size="12.5" fill="#C2185B" font-weight="bold" text-anchor="middle">per week</text></svg>