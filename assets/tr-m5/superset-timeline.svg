<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="330" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Same sets, about half the time</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Six sets each way. Illustrative timings: 45 s per set, 90 s rest.</text><text x="30" y="132" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Straight sets</text><rect x="170" y="110" width="28.125" height="34" rx="3" fill="#C2185B" stroke="none" stroke-width="1"/><rect x="198.125" y="110" width="56.25" height="34" rx="3" fill="#E3E8EE" stroke="none" stroke-width="1"/><rect x="254.375" y="110" width="28.125" height="34" rx="3" fill="#C2185B" stroke="none" stroke-width="1"/><rect x="282.5" y="110" width="56.25" height="34" rx="3" fill="#E3E8EE" stroke="none" stroke-width="1"/><rect x="338.75" y="110" width="28.125" height="34" rx="3" fill="#C2185B" stroke="none" stroke-width="1"/><rect x="366.875" y="110" width="56.25" height="34" rx="3" fill="#E3E8EE" stroke="none" stroke-width="1"/><rect x="423.125" y="110" width="28.125" height="34" rx="3" fill="#2F7FB3" stroke="none" stroke-width="1"/><rect x="451.25" y="110" width="56.25" height="34" rx="3" fill="#E3E8EE" stroke="none" stroke-width="1"/><rect x="507.5" y="110" width="28.125" height="34" rx="3" fill="#2F7FB3" stroke="none" stroke-width="1"/><rect x="535.625" y="110" width="56.25" height="34" rx="3" fill="#E3E8EE" stroke="none" stroke-width="1"/><rect x="591.875" y="110" width="28.125" height="34" rx="3" fill="#2F7FB3" stroke="none" stroke-width="1"/><rect x="620.0" y="110" width="56.25" height="34" rx="3" fill="#E3E8EE" stroke="none" stroke-width="1"/><text x="686.25" y="132" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start">≈ 14 min</text><text x="30" y="212" font-size="13.5" fill="#1B