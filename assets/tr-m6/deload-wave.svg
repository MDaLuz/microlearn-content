<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="340" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Build, deload, build again</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Illustrative weekly training stress. Deload: about half the sets, same exercises, further from failure.</text><rect x="80" y="174.0" width="48" height="96.0" rx="4" fill="#1F3A5F" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="104" y="288" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">W1</text><rect x="146" y="164.39999999999998" width="48" height="105.60000000000001" rx="4" fill="#1F3A5F" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="170" y="288" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">W2</text><rect x="212" y="154.8" width="48" height="115.19999999999999" rx="4" fill="#1F3A5F" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="236" y="288" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">W3</text><rect x="278" y="145.2" width="48" height="124.80000000000001" rx="4" fill="#1F3A5F" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="302" y="288" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">W4</text><rect x="344" y="135.6" width="48" height="134.4" rx="4" fill="#1F3A5F" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="368" y="288" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">W5</text><rect x="410" y="202.8" width="48" height="67.2" rx="4" fill="#B7791F" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="434" y="288" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">W6</text><text x="434" y="192.8" font-size="12" fill="#B7791F" font-weight="bold" text-anchor="middle">deload</text><rect x="476" y="161.2" width="48" height="108.80000000000001" rx="4" fill="#1F3A5F" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="500" y="288" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">W7</text><rect x="542" y="151.6" width="48" height="118.4" rx="4" fill="#1F3A5F" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="566" y="288" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">W8</text><rect x="608" y="142.0" width="48" height="128.0" rx="4" fill="#1F3A5F" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="632" y="288" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">W9</text><rect x="674" y="132.4" width="48" height="137.6" rx="4" fill="#1F3A5F" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="698" y="288" font-size="11" fill="#5B6672" font-weight="normal" text-anchor="middle">W10</text><line x1="70" y1="270" x2="740" y2="270" stroke="#5B6672" stroke-width="1.2"/><text x="30" y="326" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="start">Every 4–8 weeks, or sooner if performance drops two sessions in a row (practice).</text></svg>