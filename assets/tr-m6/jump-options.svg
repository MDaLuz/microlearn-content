<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="290" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Bridging a big weight jump</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">12 → 16 kg is a 33% jump. Make the 12 kg harder first.</text><rect x="30" y="120" width="110" height="90" rx="10" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4"/><text x="85.0" y="171.3" font-size="18" fill="#1F3A5F" font-weight="bold" text-anchor="middle">12 kg</text><rect x="165" y="120" width="120" height="90" rx="10" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1.4"/><text x="225.0" y="161.39999999999998" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="middle">1. More reps</text><text x="225.0" y="176.99999999999997" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="middle">up to ~20</text><line x1="145" y1="165" x2="161" y2="165" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><rect x="300" y="120" width="120" height="90" rx="10" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1.4"/><text x="360.0" y="161.39999999999998" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="middle">2. Slower or</text><text x="360.0" y="176.99999999999997" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="middle">paused reps</text><line x1="280" y1="165" x2="296" y2="165" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><rect x="435" y="120" width="120" height="90" rx="10" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1.4"/><text x="495.0" y="161.39999999999998" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="middle">3. One side or</text><text x="495.0" y="176.99999999999997" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="middle">harder version</text><line x1="415" y1="165" x2="431" y2="165" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><rect x="570" y="120" width="120" height="90" rx="10" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1.4"/><text x="630.0" y="161.39999999999998" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="middle">4. 16 kg: 1 set,</text><text x="630.0" y="176.99999999999997" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="middle">then 2, then all</text><line x1="550" y1="165" x2="566" y2="165" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><line x1="705" y1="165" x2="715" y2="165" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><rect x="720" y="120" width="80" height="90" rx="10" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4"/><text x="760.0" y="171.3" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle">16 kg</text><text x="30" y="250" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Very slow reps (&gt; ~10 s) may build less muscle; 3-second lowering or short pauses are fine.</text><text x="30" y="272" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">If none of these work, it's time for new kit (Module 3).</text></svg>