<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="470" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Ways to progress an exercise</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Roughly from easiest to apply at home to the one that needs new kit.</text><rect x="60" y="92" width="440" height="32" rx="8" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2"/><text x="76" y="113" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="start">More reps</text><text x="260" y="113" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">one more per set</text><rect x="60" y="132" width="470" height="32" rx="8" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2"/><text x="76" y="153" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="start">More sets</text><text x="260" y="153" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">within weekly volume</text><rect x="60" y="172" width="500" height="32" rx="8" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2"/><text x="76" y="193" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="start">Slower lowering</text><text x="260" y="193" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">about 3 seconds</text><rect x="60" y="212" width="530" height="32" rx="8" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2"/><text x="76" y="233" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="start">Pauses</text><text x="260" y="233" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">1–2 s at the hardest point</text><rect x="60" y="252" width="560" height="32" rx="8" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2"/><text x="76" y="273" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="start">More range</text><text x="260" y="273" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">deeper, deficit</text><rect x="60" y="292" width="590" height="32" rx="8" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2"/><text x="76" y="313" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="start">Harder variation</text><text x="260" y="313" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">e.g. split → Bulgarian</text><rect x="60" y="332" width="620" height="32" rx="8" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2"/><text x="76" y="353" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="start">One side at a time</text><text x="260" y="353" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">same weight, one limb</text><rect x="60" y="372" width="650" height="32" rx="8" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2"/><text x="76" y="393" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="start">Less rest</text><text x="260" y="393" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">same work, less time</text><rect x="60" y="412" width="680" height="32" rx="8" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.2"/><text x="76" y="433" font-size="13" fill="#C2185B" font-weight="bold" text-anchor="start">More load</text><text x="260" y="433" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">the next weight up</text></svg>