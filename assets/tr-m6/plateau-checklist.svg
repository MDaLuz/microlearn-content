<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="470" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Diagnosing a plateau</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">A lift stalled for 2–3 weeks? Check in this order. Change the exercise last.</text><rect x="120" y="90" width="580" height="46" rx="10" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1.2"/><circle cx="92" cy="113" r="15" fill="#1F3A5F"/><text x="92" y="118" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">1</text><text x="138" y="119" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Effort</text><text x="300" y="119" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Are sets really 1–3 reps from failure?</text><line x1="92" y1="130" x2="92" y2="148" stroke="#5B6672" stroke-width="1.4"/><rect x="120" y="150" width="580" height="46" rx="10" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1.2"/><circle cx="92" cy="173" r="15" fill="#1F3A5F"/><text x="92" y="178" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">2</text><text x="138" y="179" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Sleep and stress</text><text x="300" y="179" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">7+ hours most nights?</text><line x1="92" y1="190" x2="92" y2="208" stroke="#5B6672" stroke-width="1.4"/><rect x="120" y="210" width="580" height="46" rx="10" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1.2"/><circle cx="92" cy="233" r="15" fill="#1F3A5F"/><text x="92" y="238" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">3</text><text x="138" y="239" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Food</text><text x="300" y="239" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Moderate deficit, enough protein?</text><line x1="92" y1="250" x2="92" y2="268" stroke="#5B6672" stroke-width="1.4"/><rect x="120" y="270" width="580" height="46" rx="10" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1.2"/><circle cx="92" cy="293" r="15" fill="#1F3A5F"/><text x="92" y="298" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">4</text><text x="138" y="299" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Volume</text><text x="300" y="299" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Enough weekly hard sets for that muscle?</text><line x1="92" y1="310" x2="92" y2="328" stroke="#5B6672" stroke-width="1.4"/><rect x="120" y="330" width="580" height="46" rx="10" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1.2"/><circle cx="92" cy="353" r="15" fill="#1F3A5F"/><text x="92" y="358" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">5</text><text x="138" y="359" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Fatigue</text><text x="300" y="359" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">When was the last deload?</text><line x1="92" y1="370" x2="92" y2="388" stroke="#5B6672" stroke-width="1.4"/><rect x="120" y="390" width="580" height="46" rx="10" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.2"/><circle cx="92" cy="413" r="15" fill="#C2185B"/><text x="92" y="418" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">6</text><text x="138" y="419" font-size="14" fill="#C2185B" font-weight="bold" text-anchor="start">Programme</text><text x="300" y="419" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Only now: new exercise or rep range</text></svg>