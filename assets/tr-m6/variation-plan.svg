<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="320" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Stable main lifts, rotating accessories</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Three 6-week blocks. Change main lifts between blocks, within the same pattern.</text><text x="150" y="100" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="middle">Block 1</text><rect x="30" y="110" width="240" height="110" rx="10" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2"/><text x="42" y="130" font-size="11.5" fill="#1F3A5F" font-weight="bold" text-anchor="start">Main lifts (stay all block)</text><text x="42" y="154" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Goblet squat</text><text x="42" y="174" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">KB Romanian deadlift</text><text x="42" y="194" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Push-up</text><rect x="30" y="230" width="240" height="66" rx="10" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.2"/><text x="42" y="250" font-size="11.5" fill="#B7791F" font-weight="bold" text-anchor="start">Accessories (rotate freely)</text><text x="42" y="270" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Suitcase carry</text><text x="42" y="288" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Dead bug</text><text x="408" y="100" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="middle">Block 2</text><rect x="288" y="110" width="240" height="110" rx="10" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2"/><text x="300" y="130" font-size="11.5" fill="#1F3A5F" font-weight="bold" text-anchor="start">Main lifts (stay all block)</text><text x="300" y="154" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Bulgarian split squat</text><text x="300" y="174" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Single-leg RDL</text><text x="300" y="194" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Feet-raised push-up</text><rect x="288" y="230" width="240" height="66" rx="10" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.2"/><text x="300" y="250" font-size="11.5" fill="#B7791F" font-weight="bold" text-anchor="start">Accessories (rotate freely)</text><text x="300" y="270" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Farmer's carry</text><text x="300" y="288" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Side plank</text><text x="666" y="100" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="middle">Block 3</text><rect x="546" y="110" width="240" height="110" rx="10" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2"/><text x="558" y="130" font-size="11.5" fill="#1F3A5F" font-weight="bold" text-anchor="start">Main lifts (stay all block)</text><text x="558" y="154" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Goblet squat, 16 kg</text><text x="558" y="174" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Swing + RDL</text><text x="558" y="194" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Floor press</text><rect x="546" y="230" width="240" height="66" rx="10" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.2"/><text x="558" y="250" font-size="11.5" fill="#B7791F" font-weight="bold" text-anchor="start">Accessories (rotate freely)</text><text x="558" y="270" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Pallof press</text><text x="558" y="288" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">Curl</text></svg>