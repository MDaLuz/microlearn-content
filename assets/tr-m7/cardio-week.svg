<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="380" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">A week with strength, sport and easy cardio</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Example only. Steps every day: weekly average about 8,000–10,000.</text><text x="192.0" y="98" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Mon</text><text x="284.0" y="98" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Tue</text><text x="376.0" y="98" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Wed</text><text x="468.0" y="98" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Thu</text><text x="560.0" y="98" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Fri</text><text x="652.0" y="98" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Sat</text><text x="744.0" y="98" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">Sun</text><text x="30" y="140" font-size="12.5" fill="#C2185B" font-weight="bold" text-anchor="start">Strength</text><rect x="150" y="116" width="84" height="44" rx="8" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.2"/><text x="192.0" y="143" font-size="11.5" fill="#C2185B" font-weight="bold" text-anchor="middle">A</text><rect x="334" y="116" width="84" height="44" rx="8" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.2"/><text x="376.0" y="143" font-size="11.5" fill="#C2185B" font-weight="bold" text-anchor="middle">B</text><rect x="518" y="116" width="84" height="44" rx="8" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.2"/><text x="560.0" y="143" font-size="11.5" fill="#C2185B" font-weight="bold" text-anchor="middle">A</text><text x="30" y="198" font-size="12.5" fill="#2E8B57" font-weight="bold" text-anchor="start">Sport</text><rect x="242" y="174" width="84" height="44" rx="8" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.2"/><text x="284.0" y="201" font-size="11.5" fill="#2E8B57" font-weight="bold" text-anchor="middle">Football</text><rect x="610" y="174" width="84" height="44" rx="8" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.2"/><text x="652.0" y="201" font-size="11.5" fill="#2E8B57" font-weight="bold" text-anchor="middle">Tennis</text><text x="30" y="256" font-size="12.5" fill="#2F7FB3" font-weight="bold" text-anchor="start">Easy cardio</text><rect x="426" y="232" width="84" height="44" rx="8" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.2"/><text x="468.0" y="259" font-size="11.5" fill="#2F7FB3" font-weight="bold" text-anchor="middle">Easy ride</text><rect x="702" y="232" width="84" height="44" rx="8" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.2"/><text x="744.0" y="259" font-size="11.5" fill="#2F7FB3" font-weight="bold" text-anchor="middle">Long walk</text><text x="30" y="314" font-size="12.5" fill="#B7791F" font-weight="bold" text-anchor="start">Finisher</text><rect x="150" y="290" width="84" height="44" rx="8" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.2"/><text x="192.0" y="317" font-size="11.5" fill="#B7791F" font-weight="bold" text-anchor="middle">Swings</text><text x="30" y="366" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="start">Keep hard cardio and hard legs ≥ 3 h apart, and hard legs away from the day before a match.</text></svg>