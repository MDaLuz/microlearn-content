<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="360" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Intervals vs steady cardio</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Meta-analyses: Milanović 2015 (fitness), Wewege 2017 (body fat). Bars are schematic.</text><text x="30" y="122" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Aerobic fitness (VO2max)</text><text x="30" y="142" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">both improve; HIIT slightly more</text><rect x="290" y="104" width="300.0" height="22" rx="4" fill="#2F7FB3" stroke="none" stroke-width="1"/><text x="596.0" y="120" font-size="11.5" fill="#2F7FB3" font-weight="bold" text-anchor="start">steady</text><rect x="290" y="132" width="345.0" height="22" rx="4" fill="#C2185B" stroke="none" stroke-width="1"/><text x="641.0" y="148" font-size="11.5" fill="#C2185B" font-weight="bold" text-anchor="start">HIIT</text><text x="30" y="200" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Body fat and waist</text><text x="30" y="220" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">similar</text><rect x="290" y="182" width="300.0" height="22" rx="4" fill="#2F7FB3" stroke="none" stroke-width="1"/><text x="596.0" y="198" font-size="11.5" fill="#2F7FB3" font-weight="bold" text-anchor="start">steady</text><rect x="290" y="210" width="300.0" height="22" rx="4" fill="#C2185B" stroke="none" stroke-width="1"/><text x="596.0" y="226" font-size="11.5" fill="#C2185B" font-weight="bold" text-anchor="start">HIIT</text><text x="30" y="278" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Time needed</text><text x="30" y="298" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">HIIT about 40% less</text><rect x="290" y="260" width="300.0" height="22" rx="4" fill="#2F7FB3" stroke="none" stroke-width="1"/><text x="596.0" y="276" font-size="11.5" fill="#2F7FB3" font-weight="bold" text-anchor="start">steady</text><rect x="290" y="288" width="180.0" height="22" rx="4" fill="#C2185B" stroke="none" stroke-width="1"/><text x="476.0" y="304" font-size="11.5" fill="#C2185B" font-weight="bold" text-anchor="start">HIIT</text><text x="30" y="346" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="start">HIIT is a time-saver, not a fat-burning secret. Hard sport often counts as interval work.</text></svg>