<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="400" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Five heart-rate zones</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Share of maximum heart rate (≈ 208 − 0.7 × age). Borders are rough; definitions vary.</text><rect x="150" y="90" width="640" height="42" rx="8" fill="#8E1240" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="30" y="117" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Zone 5</text><text x="166" y="117" font-size="14" fill="#FFF" font-weight="bold" text-anchor="start">90–100%</text><text x="260" y="117" font-size="12.5" fill="#FFF" font-weight="normal" text-anchor="start">talk test: all-out, seconds</text><rect x="150" y="142" width="570" height="42" rx="8" fill="#C2185B" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="30" y="169" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Zone 4</text><text x="166" y="169" font-size="14" fill="#FFF" font-weight="bold" text-anchor="start">80–90%</text><text x="260" y="169" font-size="12.5" fill="#FFF" font-weight="normal" text-anchor="start">talk test: a few words</text><rect x="150" y="194" width="500" height="42" rx="8" fill="#B7791F" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="30" y="221" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Zone 3</text><text x="166" y="221" font-size="14" fill="#FFF" font-weight="bold" text-anchor="start">70–80%</text><text x="260" y="221" font-size="12.5" fill="#FFF" font-weight="normal" text-anchor="start">talk test: short sentences</text><rect x="150" y="246" width="430" height="42" rx="8" fill="#2E8B57" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="30" y="273" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Zone 2</text><text x="166" y="273" font-size="14" fill="#FFF" font-weight="bold" text-anchor="start">60–70%</text><text x="260" y="273" font-size="12.5" fill="#FFF" font-weight="normal" text-anchor="start">talk test: full sentences</text><rect x="150" y="298" width="360" height="42" rx="8" fill="#2F7FB3" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="30" y="325" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start">Zone 1</text><text x="166" y="325" font-size="14" fill="#FFF" font-weight="bold" text-anchor="start">50–60%</text><text x="260" y="325" font-size="12.5" fill="#FFF" font-weight="normal" text-anchor="start">talk test: easy walk</text><text x="30" y="386" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Example: age 40 → max ≈ 180 bpm; zone 2 ≈ 108–126 bpm.</text></svg>