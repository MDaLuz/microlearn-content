<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="380" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Most cardio is easy</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">A typical healthy mix of weekly cardio time (illustrative).</text><polygon points="330.0,100 330.0,100 410.0,180 250.0,180" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.5"/><text x="330" y="162" font-size="13.5" fill="#C2185B" font-weight="bold" text-anchor="middle">Hard intervals</text><text x="434.0" y="145.0" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">sprints in sport, short HIIT</text><polygon points="250.0,180 410.0,180 470.0,260 190.0,260" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.5"/><text x="330" y="228.0" font-size="13.5" fill="#B7791F" font-weight="bold" text-anchor="middle">Moderate</text><text x="494.0" y="225.0" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">football, tennis, brisk rides</text><polygon points="190.0,260 470.0,260 550.0,340 110.0,340" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.5"/><text x="330" y="308.0" font-size="13.5" fill="#2E8B57" font-weight="bold" text-anchor="middle">Easy</text><text x="574.0" y="305.0" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">walking, easy cycling, easy runs</text><text x="30" y="366" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="start">WHO: 150–300 min moderate or 75–150 min vigorous a week; a vigorous minute counts about double.</text></svg>