<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="330" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Three kettlebell conditioning formats</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Use as a 5–10-minute finisher; stop when technique breaks.</text><rect x="30" y="90" width="240" height="180" rx="12" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4"/><text x="46" y="120" font-size="15" fill="#C2185B" font-weight="bold" text-anchor="start">Swing intervals</text><text x="46" y="154" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">15 swings at the top</text><text x="46" y="180" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">of each minute</text><text x="46" y="206" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">10 minutes</text><rect x="288" y="90" width="240" height="180" rx="12" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4"/><text x="304" y="120" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="start">Complex</text><text x="304" y="154" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">5 swings · 5 cleans</text><text x="304" y="180" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">5 presses · 5 squats</text><text x="304" y="206" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">rest 1–2 min, 3–5 rounds</text><rect x="546" y="90" width="240" height="180" rx="12" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4"/><text x="562" y="120" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="start">EMOM</text><text x="562" y="154" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">odd minutes: 15 swings</text><text x="562" y="180" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">even minutes: 10 push-ups</text><text x="562" y="206" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">10 minutes</text><text x="30" y="316" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">One small study: 12 min of swings ≈ 87% of max heart rate but ≈ 65% of max oxygen use.</text></svg>