<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="380" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">More steps, lower risk</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Relative risk of death vs the lowest group. 2022 meta-analysis, 15 cohorts, ~47,000 adults (observational).</text><rect x="120" y="120.0" width="90" height="180.0" rx="4" fill="#1F3A5F" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="165" y="112.0" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">1.00</text><text x="165" y="320" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="middle">~3,600</text><rect x="270" y="192.0" width="90" height="108.0" rx="4" fill="#2E8B57" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="315" y="184.0" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">0.60</text><text x="315" y="320" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="middle">~5,800</text><rect x="420" y="201.0" width="90" height="99.00000000000001" rx="4" fill="#2E8B57" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="465" y="193.0" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">0.55</text><text x="465" y="320" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="middle">~7,800</text><rect x="570" y="215.4" width="90" height="84.6" rx="4" fill="#2E8B57" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="615" y="207.4" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="middle">0.47</text><text x="615" y="320" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="middle">~10,900</text><line x1="110" y1="300" x2="720" y2="300" stroke="#5B6672" stroke-width="1.2"/><text x="420" y="342" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="middle">Median steps per day in each group</text><text x="30" y="366" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="start">Benefit levelled off around 8,000–10,000 steps under 60, and 6,000–8,000 over 60.</text></svg>