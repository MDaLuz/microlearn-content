<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="330" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Three jobs of the core</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Mostly resisting movement. A coaching framework, not a guideline.</text><rect x="30" y="90" width="240" height="200" rx="12" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4"/><rect x="138" y="125" width="24" height="80" rx="10" fill="#C2185B" stroke="none" stroke-width="1" fill-opacity="0.8"/><path d="M190,145 Q210,165 190,185" stroke="#5B6672" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="202" y="141" font-size="16" fill="#C2185B" font-weight="bold" text-anchor="start">✗</text><text x="150" y="236" font-size="14.5" fill="#C2185B" font-weight="bold" text-anchor="middle">Anti-extension</text><text x="150" y="256" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">resist arching</text><text x="150" y="276" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="middle">plank · dead bug</text><rect x="288" y="90" width="240" height="200" rx="12" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4"/><rect x="396" y="125" width="24" height="80" rx="10" fill="#1F3A5F" stroke="none" stroke-width="1" fill-opacity="0.8"/><path d="M368,135 A40,14 0 0 1 448,135" stroke="#5B6672" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="454" y="131" font-size="16" fill="#C2185B" font-weight="bold" text-anchor="start">✗</text><text x="408" y="236" font-size="14.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Anti-rotation</text><text x="408" y="256" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">resist twisting</text><text x="408" y="276" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="middle">Pallof press · renegade row</text><rect x="546" y="90" width="240" height="200" rx="12" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4"/><rect x="654" y="125" width="24" height="80" rx="10" fill="#2E8B57" stroke="none" stroke-width="1" fill-opacity="0.8"/><path d="M696,129 Q716,165 696,201" stroke="#5B6672" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="716" y="125" font-size="16" fill="#C2185B" font-weight="bold" text-anchor="start">✗</text><text x="666" y="236" font-size="14.5" fill="#2E8B57" font-weight="bold" text-anchor="middle">Anti-lateral flexion</text><text x="666" y="256" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle">resist bending sideways</text><text x="666" y="276" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="middle">side plank · suitcase carry</text></svg>