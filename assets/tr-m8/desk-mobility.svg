<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="330" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Four drills for desk-stiff areas</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">About 6 minutes. Practice, not treatment.</text><rect x="30" y="90" width="370" height="96" rx="12" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4"/><text x="46" y="118" font-size="15" fill="#C2185B" font-weight="bold" text-anchor="start">Hips</text><text x="46" y="144" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Half-kneeling hip-flexor stretch</text><text x="46" y="166" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">45 s each side, squeeze the back glute</text><rect x="420" y="90" width="370" height="96" rx="12" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4"/><text x="436" y="118" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="start">Upper back</text><text x="436" y="144" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Open-book rotations</text><text x="436" y="166" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">8 slow reps each side</text><rect x="30" y="200" width="370" height="96" rx="12" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4"/><text x="46" y="228" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="start">Ankles</text><text x="46" y="254" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Knee-to-wall rocks</text><text x="46" y="276" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">10 each side, heel down</text><rect x="420" y="200" width="370" height="96" rx="12" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4"/><text x="436" y="228" font-size="15" fill="#B7791F" font-weight="bold" text-anchor="start">Shoulders</text><text x="436" y="254" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Wall slides</text><text x="436" y="276" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">10 slow reps, ribs down</text><text x="30" y="316" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Also: break long sitting every 30–60 minutes.</text></svg>