<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="300" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">The RAMP warm-up in 5 minutes</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">A practice framework: warm, not tired.</text><rect x="30" y="90" width="176" height="160" rx="12" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.4"/><text x="46" y="120" font-size="16" fill="#2F7FB3" font-weight="bold" text-anchor="start">Raise</text><text x="190" y="120" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="end">1–2 min</text><text x="46" y="156" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">marching, skipping,</text><text x="46" y="178" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">easy swings</text><line x1="208" y1="170" x2="224" y2="170" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><rect x="226" y="90" width="176" height="160" rx="12" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4"/><text x="242" y="120" font-size="16" fill="#2E8B57" font-weight="bold" text-anchor="start">Activate</text><text x="386" y="120" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="end">1 min</text><text x="242" y="156" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">glute bridges,</text><text x="242" y="178" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">dead bugs</text><line x1="404" y1="170" x2="420" y2="170" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><rect x="422" y="90" width="176" height="160" rx="12" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4"/><text x="438" y="120" font-size="16" fill="#B7791F" font-weight="bold" text-anchor="start">Mobilise</text><text x="582" y="120" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="end">1 min</text><text x="438" y="156" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">hip openers, thoracic</text><text x="438" y="178" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">rotations, arm circles</text><line x1="600" y1="170" x2="616" y2="170" stroke="#5B6672" stroke-width="1.6" marker-end="url(#ar)"/><rect x="618" y="90" width="176" height="160" rx="12" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4"/><text x="634" y="120" font-size="16" fill="#C2185B" font-weight="bold" text-anchor="start">Potentiate</text><text x="778" y="120" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="end">1–2 min</text><text x="634" y="156" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">2 lighter sets of</text><text x="634" y="178" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">the first lift</text><text x="30" y="286" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="start">Before sport: easy movement, dynamic stretches, then short accelerations.</text></svg>