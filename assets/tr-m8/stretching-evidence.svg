<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="360" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Stretching before training: small effects</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Performance change right after stretching. Behm et al. 2016 review.</text><line x1="520" y1="90" x2="520" y2="260" stroke="#5B6672" stroke-width="1.4"/><text x="520" y="278" font-size="11.5" fill="#5B6672" font-weight="normal" text-anchor="middle">0</text><text x="30" y="122" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Static, under 60 s per muscle</text><rect x="476.0" y="106" width="44.0" height="26" rx="4" fill="#B7791F" stroke="none" stroke-width="1"/><text x="468.0" y="125" font-size="12.5" fill="#B7791F" font-weight="bold" text-anchor="end">-1.1%</text><text x="30" y="174" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Static, 60 s or more per muscle</text><rect x="336.0" y="158" width="184.0" height="26" rx="4" fill="#C2185B" stroke="none" stroke-width="1"/><text x="328.0" y="177" font-size="12.5" fill="#C2185B" font-weight="bold" text-anchor="end">-4.6%</text><text x="30" y="226" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Dynamic stretching</text><rect x="520" y="210" width="52.0" height="26" rx="4" fill="#2E8B57" stroke="none" stroke-width="1"/><text x="580.0" y="229" font-size="12.5" fill="#2E8B57" font-weight="bold" text-anchor="start">+1.3%</text><text x="30" y="322" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start">No clear effect of static stretching on injuries; strength training reduced sports injuries (2014).</text><text x="30" y="344" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">Full-range strength training improved flexibility about as much as stretching (2021).</text></svg>