<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="380" fill="#FFFFFF"/><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">A 10-minute flow for lifters</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Breathe slowly through the nose. Go only as far as stays comfortable.</text><rect x="30" y="92" width="178" height="112" rx="12" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><circle cx="56" cy="120" r="15" fill="#2E8B57"/><text x="56" y="125" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">1</text><text x="46" y="158" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Child's pose</text><text x="46" y="192" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">1 min</text><rect x="224" y="92" width="178" height="112" rx="12" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><circle cx="250" cy="120" r="15" fill="#2E8B57"/><text x="250" y="125" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">2</text><text x="240" y="158" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Cat-cow</text><text x="240" y="192" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">1 min</text><rect x="418" y="92" width="178" height="112" rx="12" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><circle cx="444" cy="120" r="15" fill="#2E8B57"/><text x="444" y="125" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">3</text><text x="434" y="158" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Downward dog</text><text x="434" y="192" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">1 min</text><rect x="612" y="92" width="178" height="112" rx="12" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><circle cx="638" cy="120" r="15" fill="#2E8B57"/><text x="638" y="125" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">4</text><text x="628" y="158" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Low lunge</text><text x="628" y="192" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">1 min each side</text><rect x="30" y="222" width="178" height="112" rx="12" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><circle cx="56" cy="250" r="15" fill="#2E8B57"/><text x="56" y="255" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">5</text><text x="46" y="288" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Pigeon or</text><text x="46" y="305" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">figure-four</text><text x="46" y="322" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">1 min each side</text><rect x="224" y="222" width="178" height="112" rx="12" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><circle cx="250" cy="250" r="15" fill="#2E8B57"/><text x="250" y="255" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">6</text><text x="240" y="288" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Cobra</text><text x="240" y="322" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">30 s</text><rect x="418" y="222" width="178" height="112" rx="12" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><circle cx="444" cy="250" r="15" fill="#2E8B57"/><text x="444" y="255" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">7</text><text x="434" y="288" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Seated forward</text><text x="434" y="305" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">fold</text><text x="434" y="322" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">1 min</text><rect x="612" y="222" width="178" height="112" rx="12" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1"/><circle cx="638" cy="250" r="15" fill="#2E8B57"/><text x="638" y="255" font-size="13" fill="#FFF" font-weight="bold" text-anchor="middle">8</text><text x="628" y="288" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Lying twist</text><text x="628" y="322" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">30 s each side</text></svg>