<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="360" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">How fast to lose</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Weekly loss as a share of body weight (review of natural lifters, 2014). Example: 80 kg.</text><text x="30" y="122" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="start">Gentle</text><text x="110" y="122" font-size="15" fill="#1B2430" font-weight="bold" text-anchor="start">0.5%</text><rect x="180" y="102" width="165.0" height="30" rx="6" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4"/><text x="351.0" y="122" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start">0.4 kg/week</text><text x="620" y="122" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">≈ 440 kcal/day</text><text x="30" y="186" font-size="15" fill="#2F7FB3" font-weight="bold" text-anchor="start">Steady</text><text x="110" y="186" font-size="15" fill="#1B2430" font-weight="bold" text-anchor="start">0.75%</text><rect x="180" y="166" width="247.5" height="30" rx="6" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.4"/><text x="433.5" y="186" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start">0.6 kg/week</text><text x="620" y="186" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">≈ 660 kcal/day</text><text x="30" y="250" font-size="15" fill="#B7791F" font-weight="bold" text-anchor="start">Fast</text><text x="110" y="250" font-size="15" fill="#1B2430" font-weight="bold" text-anchor="start">1%</text><rect x="180" y="230" width="330.0" height="30" rx="6" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4"/><text x="516.0" y="250" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start">0.8 kg/week</text><text x="620" y="250" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">≈ 880 kcal/day</text><rect x="180" y="290" width="330" height="26" rx="6" fill="#FBE4EE" stroke="#C2185B" stroke-width="1"/><text x="186" y="308" font-size="12.5" fill="#C2185B" font-weight="bold" text-anchor="start">Above ~1%: more muscle lost</text><text x="30" y="348" font-size="12" fill="#1B2430" font-weight="bold" text-anchor="start">Athletes losing ~0.7%/week gained lean mass; ~1.4%/week did not (2011).</text></svg>