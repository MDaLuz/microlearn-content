<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="340" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Fluids, alcohol and fibre</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Three everyday levers for recovery and health.</text><rect x="30" y="86" width="240" height="200" rx="12" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.4"/><text x="46" y="116" font-size="15.5" fill="#2F7FB3" font-weight="bold" text-anchor="start">Hydration</text><text x="46" y="152" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Drink to thirst</text><text x="46" y="180" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Pale-yellow urine</text><text x="46" y="208" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Long, hot sport: lose</text><text x="46" y="236" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">&lt; 2% body weight</text><rect x="288" y="86" width="240" height="200" rx="12" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4"/><text x="304" y="116" font-size="15.5" fill="#C2185B" font-weight="bold" text-anchor="start">Alcohol</text><text x="304" y="152" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Large dose after training:</text><text x="304" y="180" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">muscle building −24%</text><text x="304" y="208" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">even with protein (2014)</text><text x="304" y="236" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Adds 7 kcal per gram</text><rect x="546" y="86" width="240" height="200" rx="12" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4"/><text x="562" y="116" font-size="15.5" fill="#2E8B57" font-weight="bold" text-anchor="start">Fibre</text><text x="562" y="152" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">25–29 g a day</text><text x="562" y="180" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Linked with less heart</text><text x="562" y="208" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">disease and diabetes</text><text x="562" y="236" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Beans, oats, veg, wholegrains</text><text x="30" y="324" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Keep alcohol occasional and away from training days.</text></svg>