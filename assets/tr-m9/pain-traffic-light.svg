<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="340" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">A pain traffic light</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Pain during exercise, 0–10. From tendon rehabilitation (2007), used widely in practice.</text><circle cx="62" cy="114" r="24" fill="#2E8B57"/><text x="62" y="119" font-size="13.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">0–2</text><rect x="100" y="88" width="690" height="52" rx="8" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.2"/><text x="116" y="110" font-size="14" fill="#2E8B57" font-weight="bold" text-anchor="start">Green: continue</text><text x="116" y="130" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start"></text><circle cx="62" cy="180" r="24" fill="#B7791F"/><text x="62" y="185" font-size="13.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3–5</text><rect x="100" y="154" width="690" height="52" rx="8" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.2"/><text x="116" y="176" font-size="14" fill="#B7791F" font-weight="bold" text-anchor="start">Amber: adapt</text><text x="116" y="196" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">OK if it settles by next morning and isn't worsening</text><circle cx="62" cy="246" r="24" fill="#C2185B"/><text x="62" y="251" font-size="13.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">&gt; 5</text><rect x="100" y="220" width="690" height="52" rx="8" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.2"/><text x="116" y="242" font-size="14" fill="#C2185B" font-weight="bold" text-anchor="start">Red: stop that exercise</text><text x="116" y="262" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">or if pain is worse the next day; use a pain-free option</text><text x="30" y="326" font-size="12.5" fill="#C2185B" font-weight="bold" text-anchor="start">Red flags (chest pain, fainting, a 'pop', swelling, numbness): stop and get medical help.</text></svg>