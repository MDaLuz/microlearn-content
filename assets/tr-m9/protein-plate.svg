<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="380" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Where the protein comes from</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Approximate protein per typical portion; varies by product. Target: 1.6–2.2 g/kg a day.</text><text x="30" y="110" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Chicken breast</text><text x="210" y="110" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">100 g cooked</text><rect x="330" y="94" width="360" height="24" rx="5" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.2"/><text x="698" y="111" font-size="13" fill="#2F7FB3" font-weight="bold" text-anchor="start">≈ 30 g</text><text x="30" y="150" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Whey powder</text><text x="210" y="150" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">1 scoop</text><rect x="330" y="134" width="264" height="24" rx="5" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.2"/><text x="602" y="151" font-size="13" fill="#2F7FB3" font-weight="bold" text-anchor="start">≈ 22 g</text><text x="30" y="190" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Skyr / Greek yoghurt</text><text x="210" y="190" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">200 g</text><rect x="330" y="174" width="240" height="24" rx="5" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.2"/><text x="578" y="191" font-size="13" fill="#2F7FB3" font-weight="bold" text-anchor="start">≈ 20 g</text><text x="30" y="230" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Tofu</text><text x="210" y="230" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">150 g</text><rect x="330" y="214" width="240" height="24" rx="5" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.2"/><text x="578" y="231" font-size="13" fill="#2F7FB3" font-weight="bold" text-anchor="start">≈ 20 g</text><text x="30" y="270" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Eggs</text><text x="210" y="270" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">3 large</text><rect x="330" y="254" width="216" height="24" rx="5" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.2"/><text x="554" y="271" font-size="13" fill="#2F7FB3" font-weight="bold" text-anchor="start">≈ 18 g</text><text x="30" y="310" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start">Lentils</text><text x="210" y="310" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start">150 g cooked</text><rect x="330" y="294" width="156" height="24" rx="5" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.2"/><text x="494" y="311" font-size="13" fill="#2F7FB3" font-weight="bold" text-anchor="start">≈ 13 g</text><text x="30" y="366" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Example at 80 kg: 130–175 g a day, about 30–35 g in each of 3–4 meals.</text></svg>