<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="360" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">Supplement evidence tiers</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Food, training and sleep come first. Check with a doctor if you take medicines.</text><rect x="30" y="86" width="255" height="210" rx="12" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4"/><text x="44" y="116" font-size="15.5" fill="#2E8B57" font-weight="bold" text-anchor="start">Good evidence</text><text x="44" y="152" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Creatine monohydrate 3–5 g/day</text><text x="44" y="182" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Caffeine 3–6 mg/kg, ~1 h before</text><text x="44" y="212" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Protein powder (convenient food)</text><rect x="300" y="86" width="225" height="210" rx="12" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4"/><text x="314" y="116" font-size="15.5" fill="#B7791F" font-weight="bold" text-anchor="start">Only if low</text><text x="314" y="152" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Vitamin D, common in</text><text x="314" y="182" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">northern winters:</text><text x="314" y="212" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">test or ask a doctor</text><rect x="540" y="86" width="250" height="210" rx="12" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4"/><text x="554" y="116" font-size="15.5" fill="#C2185B" font-weight="bold" text-anchor="start">Not needed</text><text x="554" y="152" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Fat burners</text><text x="554" y="182" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">Testosterone boosters</text><text x="554" y="212" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start">BCAAs with enough protein</text><text x="30" y="344" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start">Choose third-party tested products; supplements can be contaminated.</text></svg>