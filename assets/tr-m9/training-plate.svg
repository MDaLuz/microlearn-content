<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"><rect width="820" height="380" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start">A simple plate and timing</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start">Practice: a plate model for everyday meals and when to eat around a session.</text><path d="M170,100 A120,120 0 0 0 170,340 Z" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.5"/><path d="M170,100 A120,120 0 0 1 290,220 L170,220 Z" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.5"/><path d="M290,220 A120,120 0 0 1 170,340 L170,220 Z" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.5"/><text x="110" y="215.0" font-size="13" fill="#2E8B57" font-weight="bold" text-anchor="middle">Vegetables</text><text x="110" y="231.9" font-size="13" fill="#2E8B57" font-weight="bold" text-anchor="middle">and fruit</text><text x="110" y="248.8" font-size="13" fill="#2E8B57" font-weight="bold" text-anchor="middle">(half)</text><text x="225" y="170.0" font-size="13" fill="#C2185B" font-weight="bold" text-anchor="middle">Protein</text><text x="225" y="186.9" font-size="13" fill="#C2185B" font-weight="bold" text-anchor="middle">(¼)</text><text x="225" y="265.0" font-size="13" fill="#B7791F" font-weight="bold" text-anchor="middle">Starchy</text><text x="225" y="281.9" font-size="13" fill="#B7791F" font-weight="bold" text-anchor="middle">carbs (¼)</text><line x1="360" y1="220" x2="790" y2="220" stroke="#1B2430" stroke-width="2"/><circle cx="400" cy="220" r="8" fill="#1F3A5F"/><text x="400" y="196" font-size="13.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Meal</text><text x="400" y="250" font-size="12" fill="#5B6672" font-weight="middle" text-anchor="start">1–3 h before</text><circle cx="550" cy="220" r="8" fill="#1F3A5F"/><text x="550" y="196" font-size="13.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Train</text><text x="550" y="250" font-size="12" fill="#5B6672" font-weight="middle" text-anchor="start">30 min</text><circle cx="690" cy="220" r="8" fill="#1F3A5F"/><text x="690" y="196" font-size="13.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Protein-rich meal</text><text x="690" y="250" font-size="12" fill="#5B6672" font-weight="middle" text-anchor="start">within a few hours</text><text x="360" y="300" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">Long match (90 min)? Make the meal before</text><text x="360" y="318" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start">carbohydrate-rich. Short session? Nothing special.</text></svg>