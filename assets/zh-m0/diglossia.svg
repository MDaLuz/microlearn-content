<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="380" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Who uses what, when</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Dialect is spoken; High German is written. Swiss Standard German sits in between.</text><rect x="30" y="86" width="370" height="200" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4" rx="12"/><text x="46" y="116" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">Dialect (Mundart): speaking</text><text x="46" y="148" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">family and friends</text><text x="46" y="174" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">work, meetings, coffee breaks</text><text x="46" y="200" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">shops, neighbours, Gemeinde counter</text><text x="46" y="226" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">radio and TV talk, weather</text><text x="46" y="252" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">chat messages</text><rect x="420" y="86" width="370" height="200" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4" rx="12"/><text x="436" y="116" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">High German: writing</text><text x="436" y="148" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">news bulletins</text><text x="436" y="174" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">official letters and forms</text><text x="436" y="200" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">school lessons, books</text><text x="436" y="226" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">signs, menus, contracts</text><text x="436" y="252" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">speaking with non-Swiss</text><rect x="30" y="300" width="760" height="40" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.2" rx="10"/><text x="46" y="325" font-size="13" fill="#B7791F" font-weight="bold" text-anchor="start" font-style="normal">Swiss Standard German: High German with a Swiss accent and words like Velo, parkieren, Trottoir</text><text x="30" y="368" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">2019 federal survey: 89% regularly use Swiss German, 97% Standard German (incl. reading and writing).</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>