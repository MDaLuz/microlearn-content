<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="400" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">How a phrase card works</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Read the respelling aloud, check the IPA if something surprises you, then press play.</text><rect x="30" y="84" width="520" height="36" fill="#E4EAF2" stroke="#E3E8EE" stroke-width="1" rx="6"/><text x="44" y="108" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Phrase</text><text x="170" y="108" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Grüezi mitenand</text><text x="570" y="108" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Zurich spelling (Dieth style)</text><rect x="30" y="126" width="520" height="36" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="6"/><text x="44" y="150" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Say it</text><text x="170" y="150" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">GRÜ-e-tsi MI-te-nand</text><text x="570" y="150" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">CAPS = stressed syllable</text><rect x="30" y="168" width="520" height="36" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="6"/><text x="44" y="192" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">IPA</text><text x="170" y="192" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">[ˈɡryətsi ˈmitənand]</text><text x="570" y="192" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">precise symbols, for reference</text><rect x="30" y="210" width="520" height="36" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="6"/><text x="44" y="234" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Hochdeutsch</text><text x="170" y="234" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Guten Tag zusammen</text><text x="570" y="234" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">the High German you know</text><rect x="30" y="252" width="520" height="36" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="6"/><text x="44" y="276" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">English</text><text x="170" y="276" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Hello everyone (formal)</text><rect x="30" y="294" width="520" height="36" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="6"/><text x="44" y="318" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Note</text><text x="170" y="318" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">üe glides: ü, then a short e</text><text x="570" y="318" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">tips and traps</text><rect x="30" y="336" width="520" height="36" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="6"/><text x="44" y="360" font-size="13" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">▶ Audio</text><text x="170" y="360" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">synthetic Zurich voice</text><text x="570" y="360" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">copy the sound and melody</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>