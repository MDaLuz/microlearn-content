<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="330" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Keeping the conversation in dialect</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Swiss people switch to be polite. Ask once, kindly, and keep going.</text><rect x="30" y="100" width="175" height="130" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.4" rx="12"/><text x="46" y="130" font-size="15" fill="#2F7FB3" font-weight="bold" text-anchor="start" font-style="normal">You speak</text><text x="46" y="162" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">with an accent</text><rect x="225" y="100" width="175" height="130" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4" rx="12"/><text x="241" y="130" font-size="15" fill="#B7791F" font-weight="bold" text-anchor="start" font-style="normal">They switch</text><text x="241" y="162" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">to High German</text><text x="241" y="184" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">to be polite</text><rect x="420" y="100" width="175" height="130" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4" rx="12"/><text x="436" y="130" font-size="15" fill="#C2185B" font-weight="bold" text-anchor="start" font-style="normal">You ask</text><text x="436" y="162" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Chönd Si bitte</text><text x="436" y="184" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Schwiizertüütsch rede?</text><rect x="615" y="100" width="175" height="130" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4" rx="12"/><text x="631" y="130" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">Dialect continues</text><text x="631" y="162" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">you can answer</text><text x="631" y="184" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">in High German</text><line x1="208" y1="165" x2="222" y2="165" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><line x1="403" y1="165" x2="417" y2="165" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><line x1="598" y1="165" x2="612" y2="165" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><text x="30" y="275" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Repeat the request with people you see often: neighbours, colleagues, other parents.</text><text x="30" y="300" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Understanding first; speaking dialect comes later.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>