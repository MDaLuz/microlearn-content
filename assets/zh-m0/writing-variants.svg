<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="330" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">One message, many spellings</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">No official spelling: people write what they hear. This course uses one system (Dieth).</text><rect x="30" y="90" width="760" height="42" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2" rx="8"/><text x="46" y="117" font-size="12.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Course (Dieth style)</text><text x="260" y="118" font-size="16" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="italic">Hoi zäme, bis spöter!</text><rect x="30" y="142" width="760" height="42" fill="#F7F4EE" stroke="#5B6672" stroke-width="1.2" rx="8"/><text x="46" y="169" font-size="12.5" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal">Chat variant</text><text x="260" y="170" font-size="16" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="italic">Hoi zämä, bis schpöter</text><rect x="30" y="194" width="760" height="42" fill="#F7F4EE" stroke="#5B6672" stroke-width="1.2" rx="8"/><text x="46" y="221" font-size="12.5" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal">Chat variant</text><text x="260" y="222" font-size="16" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="italic">hoi zäme bis spööter</text><rect x="30" y="246" width="760" height="42" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.2" rx="8"/><text x="46" y="273" font-size="12.5" fill="#B7791F" font-weight="bold" text-anchor="start" font-style="normal">High German</text><text x="260" y="274" font-size="16" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="italic">Hallo zusammen, bis später!</text><text x="30" y="316" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Emails, letters and forms stay in High German.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>