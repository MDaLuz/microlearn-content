<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="330" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">The three gliding vowels</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Say both parts: the first stressed, then a short, light e.</text><rect x="30" y="88" width="150" height="50" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="8"/><text x="105" y="120" font-size="18" fill="#1B2430" font-weight="bold" text-anchor="middle" font-style="normal">long i (ie)</text><line x1="186" y1="113" x2="246" y2="113" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><rect x="252" y="88" width="150" height="50" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.4" rx="8"/><text x="327" y="120" font-size="18" fill="#2F7FB3" font-weight="bold" text-anchor="middle" font-style="normal">ie [iə]</text><text x="424" y="119" font-size="13.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">lieb · Brief · Liecht</text><rect x="30" y="156" width="150" height="50" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="8"/><text x="105" y="188" font-size="18" fill="#1B2430" font-weight="bold" text-anchor="middle" font-style="normal">long u</text><line x1="186" y1="181" x2="246" y2="181" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><rect x="252" y="156" width="150" height="50" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4" rx="8"/><text x="327" y="188" font-size="18" fill="#2E8B57" font-weight="bold" text-anchor="middle" font-style="normal">ue [uə]</text><text x="424" y="187" font-size="13.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">gut → guet · Fuss → Fuess · Kuh → Chue</text><rect x="30" y="224" width="150" height="50" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="8"/><text x="105" y="256" font-size="18" fill="#1B2430" font-weight="bold" text-anchor="middle" font-style="normal">long ü</text><line x1="186" y1="249" x2="246" y2="249" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><rect x="252" y="224" width="150" height="50" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4" rx="8"/><text x="327" y="256" font-size="18" fill="#B7791F" font-weight="bold" text-anchor="middle" font-style="normal">üe [yə]</text><text x="424" y="255" font-size="13.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">müde → müed · grün → grüen · früh → früe</text><text x="30" y="316" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">One syllable each: GU-et is one beat, not two.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>