<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="320" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Three e sounds</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">From closed to open. The open ä is a strong Zurich marker.</text><line x1="60" y1="230" x2="760" y2="230" stroke="#1B2430" stroke-width="2"/><text x="60" y="255" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">closed</text><text x="760" y="255" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="end" font-style="normal">open</text><rect x="40" y="90" width="200" height="110" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.4" rx="10"/><text x="140" y="120" font-size="16" fill="#2F7FB3" font-weight="bold" text-anchor="middle" font-style="normal">e [e]</text><text x="140" y="150" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">See, Tee, Velo</text><circle cx="140" cy="230" r="7" fill="#2F7FB3"/><rect x="250" y="90" width="200" height="110" fill="#F7F4EE" stroke="#5B6672" stroke-width="1.4" rx="10"/><text x="350" y="120" font-size="16" fill="#5B6672" font-weight="bold" text-anchor="middle" font-style="normal">weak e [ə]</text><text x="350" y="150" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">mache, Garte, bitte</text><text x="350" y="172" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">(unstressed endings)</text><circle cx="350" cy="230" r="7" fill="#5B6672"/><rect x="500" y="90" width="200" height="110" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4" rx="10"/><text x="600" y="120" font-size="16" fill="#C2185B" font-weight="bold" text-anchor="middle" font-style="normal">ä [æ]</text><text x="600" y="150" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">Wätter, Fänschter,</text><text x="600" y="172" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">schnäll, Wält</text><circle cx="600" cy="230" r="7" fill="#C2185B"/><text x="30" y="306" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">High German short e (Wetter, Fenster, schnell) usually becomes open ä.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>