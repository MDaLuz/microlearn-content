<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="320" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Three ending habits</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Dropped -n, one plural verb form, and -li for small things.</text><rect x="30" y="86" width="245" height="170" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.4" rx="12"/><text x="46" y="116" font-size="15" fill="#2F7FB3" font-weight="bold" text-anchor="start" font-style="normal">Dropped -n</text><text x="46" y="148" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">machen → mache</text><text x="46" y="172" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Garten → Garte</text><text x="46" y="196" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">schön → schöö</text><text x="46" y="220" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">(n returns before vowels)</text><rect x="288" y="86" width="245" height="170" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4" rx="12"/><text x="304" y="116" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">Plural -ed</text><text x="304" y="148" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">mir mached</text><text x="304" y="172" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">ihr mached</text><text x="304" y="196" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">si mached</text><text x="304" y="220" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">(one form for all three)</text><rect x="546" y="86" width="245" height="170" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4" rx="12"/><text x="562" y="116" font-size="15" fill="#B7791F" font-weight="bold" text-anchor="start" font-style="normal">Diminutive -li</text><text x="562" y="148" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Huus → Hüüsli</text><text x="562" y="172" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Chatz → Chätzli</text><text x="562" y="196" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Gschänk → Gschänkli</text><text x="562" y="220" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">(often adds umlaut)</text><text x="30" y="290" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Linking n: wie-n-i gseit ha (as I said) · wo-n-er cho isch (when he came)</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>