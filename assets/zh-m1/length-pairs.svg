<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="330" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Short and long</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Length alone can change meaning. Doubled letters are held longer.</text><text x="30" y="118" font-size="18" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Stadt</text><rect x="150" y="100" width="120" height="22" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2" rx="5"/><text x="290" y="117" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">city · short a</text><text x="30" y="172" font-size="18" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Staat</text><rect x="150" y="154" width="264.0" height="22" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2" rx="5"/><text x="434.0" y="171" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">state · long aa</text><text x="30" y="226" font-size="18" fill="#B7791F" font-weight="bold" text-anchor="start" font-style="normal">Vater</text><rect x="150" y="208" width="264.0" height="22" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.2" rx="5"/><text x="434.0" y="225" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">High German: long a</text><text x="30" y="280" font-size="18" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">Vatter</text><rect x="150" y="262" width="120" height="22" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.2" rx="5"/><text x="290" y="279" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Zurich: short a, held tt</text><text x="30" y="316" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Also short in Zurich: heute → hüt. Hat is Huet (ue), not a length pair.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>