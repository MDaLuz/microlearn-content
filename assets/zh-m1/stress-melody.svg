<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="340" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Stress and melody</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Stress the first syllable, even in loanwords. Verbs in -iere are the exception.</text><circle cx="60" cy="100" r="9" fill="#C2185B"/><circle cx="120" cy="100" r="5" fill="#E3E8EE"/><text x="60" y="135" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle" font-style="normal">BÜ</text><text x="120" y="135" font-size="16" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">ro</text><circle cx="250" cy="100" r="9" fill="#C2185B"/><circle cx="310" cy="100" r="5" fill="#E3E8EE"/><text x="250" y="135" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle" font-style="normal">BIL</text><text x="310" y="135" font-size="16" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">jet</text><circle cx="440" cy="100" r="9" fill="#C2185B"/><circle cx="500" cy="100" r="5" fill="#E3E8EE"/><text x="440" y="135" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle" font-style="normal">KA</text><text x="500" y="135" font-size="16" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">fi</text><circle cx="630" cy="100" r="9" fill="#C2185B"/><circle cx="690" cy="100" r="5" fill="#E3E8EE"/><text x="630" y="135" font-size="18" fill="#C2185B" font-weight="bold" text-anchor="middle" font-style="normal">VE</text><text x="690" y="135" font-size="16" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">lo</text><text x="30" y="175" font-size="13" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">But: par-KIE-re, te-le-fo-NIE-re</text><polyline points="60,280 160,262 260,250 360,246 460,250 560,262 660,286" fill="none" stroke="#1F3A5F" stroke-width="3"/><text x="60" y="312" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">Wo</text><text x="160" y="312" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">chunsch</text><text x="260" y="312" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">du</text><text x="360" y="312" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">hüt</text><text x="460" y="312" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">am</text><text x="560" y="312" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">A-</text><text x="660" y="312" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">big?</text><text x="30" y="225" font-size="12.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Melody (practice): even syllables; the voice rises inside the sentence and falls at the end.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>