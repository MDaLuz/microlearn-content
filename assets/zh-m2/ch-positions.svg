<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="330" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">One ch, in every position</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Always the throaty ch of Bach [x]. Zurich has no soft ich-sound.</text><rect x="30" y="86" width="245" height="170" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4" rx="12"/><text x="46" y="116" font-size="15" fill="#C2185B" font-weight="bold" text-anchor="start" font-style="normal">At the start</text><text x="46" y="148" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Chind (Kind)</text><text x="46" y="172" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Chuchi (Küche)</text><text x="46" y="196" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Chäs (Käse)</text><text x="46" y="220" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">chalt (kalt)</text><rect x="288" y="86" width="245" height="170" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.4" rx="12"/><text x="304" y="116" font-size="15" fill="#2F7FB3" font-weight="bold" text-anchor="start" font-style="normal">In the middle</text><text x="304" y="148" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">mache</text><text x="304" y="172" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Chuchi</text><text x="304" y="196" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">lache</text><text x="304" y="220" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Chuchichäschtli</text><rect x="546" y="86" width="245" height="170" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4" rx="12"/><text x="562" y="116" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">After i and e</text><text x="562" y="148" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">ich</text><text x="562" y="172" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">mich, dich</text><text x="562" y="196" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Milch</text><text x="562" y="220" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Liecht (Licht)</text><text x="30" y="290" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">High German ich has the soft [ç]; Zurich ich has the Bach sound [x].</text><text x="30" y="314" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Initial k → ch in native words: Kind → Chind, Kirche → Chile.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>