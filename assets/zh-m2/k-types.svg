<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="320" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Three kinds of k</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Native words, loanwords, and the strong k inside words.</text><rect x="30" y="86" width="245" height="170" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4" rx="12"/><text x="46" y="116" font-size="15" fill="#C2185B" font-weight="bold" text-anchor="start" font-style="normal">Native: k → ch</text><text x="46" y="148" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Kind → Chind</text><text x="46" y="172" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Käse → Chäs</text><text x="46" y="196" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">kaufen → chaufe</text><text x="46" y="220" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Kopf → Chopf</text><rect x="288" y="86" width="245" height="170" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4" rx="12"/><text x="304" y="116" font-size="15" fill="#B7791F" font-weight="bold" text-anchor="start" font-style="normal">Loanwords: kch [kx]</text><text x="304" y="148" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Kafi</text><text x="304" y="172" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Kino</text><text x="304" y="196" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Kilo</text><text x="304" y="220" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Konzärt</text><rect x="546" y="86" width="245" height="170" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4" rx="12"/><text x="562" y="116" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Inside words: gg</text><text x="562" y="148" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Rücken → Rugge</text><text x="562" y="172" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Glocke → Glogge</text><text x="562" y="196" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Brücke → Brugg</text><text x="562" y="220" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">(a strong, held k)</text><text x="30" y="290" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Also keeps k: kei (kein). gg is never a voiced English g.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>