 height="24" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.2" rx="5"/><text x="407.0" y="272" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">please · strong, held tt</text><text x="30" y="314" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Doubled letters in this course always mean the strong, held version.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>