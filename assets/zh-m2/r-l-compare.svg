<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="320" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Zurich l and r vs Bern</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Zurich keeps a clear l. A u-like l is a Bern marker.</text><text x="30" y="100" font-size="13.5" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal"></text><text x="250" y="100" font-size="13.5" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal">Zurich</text><text x="450" y="100" font-size="13.5" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal">Bern</text><text x="630" y="100" font-size="13.5" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal">High German</text><rect x="30" y="112" width="760" height="36" fill="#F7F4EE" stroke="none" stroke-width="1" rx="4"/><text x="42" y="136" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">milk</text><text x="250" y="136" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Milch</text><text x="450" y="136" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Miuch</text><text x="630" y="136" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Milch</text><rect x="30" y="156" width="760" height="36" fill="#FFFFFF" stroke="none" stroke-width="1" rx="4"/><text x="42" y="180" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">much, many</text><text x="250" y="180" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">vil</text><text x="450" y="180" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">viu</text><text x="630" y="180" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">viel</text><rect x="30" y="200" width="760" height="36" fill="#F7F4EE" stroke="none" stroke-width="1" rx="4"/><text x="42" y="224" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">good luck</text><text x="250" y="224" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Vil Glück</text><text x="450" y="224" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Viu Glück</text><text x="630" y="224" font-size="14" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Viel Glück</text><text x="30" y="270" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">r: rolled tongue-tip or throaty back r; both are normal in Zurich.</text><text x="30" y="294" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Final -er stays a short er, not the a-sound of High German Vater.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>