<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="380" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Five consonant rules</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Module 2 on one card.</text><circle cx="52" cy="106" r="18" fill="#C2185B"/><text x="52" y="112" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">1</text><text x="86" y="103" font-size="15" fill="#C2185B" font-weight="bold" text-anchor="start" font-style="normal">one throaty ch, everywhere</text><text x="86" y="124" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Chind · ich</text><circle cx="52" cy="162" r="18" fill="#B7791F"/><text x="52" y="168" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">2</text><text x="86" y="159" font-size="15" fill="#B7791F" font-weight="bold" text-anchor="start" font-style="normal">loanwords keep kch</text><text x="86" y="180" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Kafi · Kino · Kilo</text><circle cx="52" cy="218" r="18" fill="#2F7FB3"/><text x="52" y="224" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">3</text><text x="86" y="215" font-size="15" fill="#2F7FB3" font-weight="bold" text-anchor="start" font-style="normal">scht and schp in every position</text><text x="86" y="236" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">isch · Poscht · geschter</text><circle cx="52" cy="274" r="18" fill="#2E8B57"/><text x="52" y="280" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">4</text><text x="86" y="271" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">soft vs strong = length; no puff</text><text x="86" y="292" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Ofe (oven) · offe (open)</text><circle cx="52" cy="330" r="18" fill="#1F3A5F"/><text x="52" y="336" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="normal">5</text><text x="86" y="327" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">clear l; rolled or throaty r</text><text x="86" y="348" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Milch · vil · rägnet</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>