<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="320" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">scht in every position</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">High German only at the start; Zurich everywhere.</text><rect x="30" y="92" width="760" height="54" fill="#F7F4EE" stroke="#5B6672" stroke-width="1.2" rx="8"/><text x="46" y="125" font-size="14" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal">Start</text><text x="150" y="117" font-size="15" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Stadt · sprechen · spöter</text><text x="150" y="137" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">same as High German (said scht, schp)</text><rect x="30" y="158" width="760" height="54" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.2" rx="8"/><text x="46" y="191" font-size="14" fill="#C2185B" font-weight="bold" text-anchor="start" font-style="normal">Middle</text><text x="150" y="183" font-size="15" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Fänschter · geschter · Chaschte</text><text x="150" y="203" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Fenster · gestern · Kasten</text><rect x="30" y="224" width="760" height="54" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.2" rx="8"/><text x="46" y="257" font-size="14" fill="#C2185B" font-weight="bold" text-anchor="start" font-style="normal">End</text><text x="150" y="249" font-size="15" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">isch · Poscht · Wurscht · Fäscht</text><text x="150" y="269" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">ist · Post · Wurst · Fest</text><text x="30" y="304" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Spelling here: scht in the middle and at the end; st/sp at the start.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>