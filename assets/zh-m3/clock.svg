<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="470" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">The Zurich clock</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Around the hour: ab (after), vor (before); halbi points to the next hour. Example hour: 3 → 4.</text><circle cx="260" cy="270" r="150" fill="#F7F4EE" stroke="#1F3A5F" stroke-width="2"/><line x1="260.0" y1="126.0" x2="260.0" y2="138.0" stroke="#1F3A5F" stroke-width="2"/><text x="260.0" y="106.0" font-size="12" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-style="normal">:00 drüü</text><line x1="332.0" y1="145.29234185504083" x2="326.0" y2="155.6846467004541" stroke="#1F3A5F" stroke-width="2"/><text x="344.0" y="128.5077321642143" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">05 föif ab</text><line x1="384.70765814495917" y1="198.0" x2="374.3153532995459" y2="204.0" stroke="#1F3A5F" stroke-width="2"/><text x="405.4922678357857" y="190.0" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">10 zää ab</text><line x1="404.0" y1="270.0" x2="392.0" y2="270.0" stroke="#1F3A5F" stroke-width="2"/><text x="428.0" y="274.0" font-size="12" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">15 viertel ab</text><line x1="384.70765814495917" y1="342.0" x2="374.3153532995459" y2="336.0" stroke="#1F3A5F" stroke-width="2"/><text x="405.4922678357857" y="358.0" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">20 zwänzg ab</text><line x1="332.0" y1="394.70765814495917" x2="326.0" y2="384.3153532995459" stroke="#1F3A5F" stroke-width="2"/><text x="344.0" y="419.4922678357857" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">25 föif vor halbi</text><line x1="260.0" y1="414.0" x2="260.0" y2="402.0" stroke="#1F3A5F" stroke-width="2"/><text x="260.0" y="442.0" font-size="12" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-style="normal">30 halbi vieri</text><line x1="188.00000000000003" y1="394.70765814495917" x2="194.00000000000003" y2="384.3153532995459" stroke="#1F3A5F" stroke-width="2"/><text x="176.00000000000006" y="419.4922678357857" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="end" font-style="normal">35 föif ab halbi</text><line x1="135.29234185504083" y1="342.0" x2="145.6846467004541" y2="336.0" stroke="#1F3A5F" stroke-width="2"/><text x="114.5077321642143" y="358.0" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="end" font-style="normal">40 zwänzg vor</text><line x1="116.0" y1="270.0" x2="128.0" y2="270.0" stroke="#1F3A5F" stroke-width="2"/><text x="92.0" y="274.0" font-size="12" fill="#1F3A5F" font-weight="bold" text-anchor="end" font-style="normal">45 viertel vor</text><line x1="135.29234185504083" y1="198.0" x2="145.6846467004541" y2="204.0" stroke="#1F3A5F" stroke-width="2"/><text x="114.5077321642143" y="190.0" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="end" font-style="normal">50 zää vor</text><line x1="187.99999999999994" y1="145.2923418550409" x2="193.99999999999994" y2="155.68464670045415" stroke="#1F3A5F" stroke-width="2"/><text x="175.99999999999994" y="128.50773216421436" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="end" font-style="normal">55 föif vor</text><line x1="260" y1="270" x2="260" y2="175" stroke="#1B2430" stroke-width="4"/><line x1="260" y1="270" x2="330" y2="270" stroke="#1B2430" stroke-width="5"/><circle cx="260" cy="270" r="6" fill="#1B2430"/><rect x="560" y="150" width="240" height="200" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4" rx="12"/><text x="576" y="180" font-size="15" fill="#C2185B" font-weight="bold" text-anchor="start" font-style="normal">Hours</text><text x="576" y="212" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">1–3: eis, zwei, drüü</text><text x="576" y="238" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">4–12 add -i: vieri, föifi,</text><text x="576" y="264" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">sächsi, sibni, achti, nüüni,</text><text x="576" y="290" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">zääni, elfi, zwölfi</text><text x="576" y="316" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">at 4: am vieri</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>