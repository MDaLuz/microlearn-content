<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="360" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Which greeting when</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Formal (Si) or informal (du), one person or a group.</text><text x="250" y="100" font-size="13.5" fill="#5B6672" font-weight="bold" text-anchor="middle" font-style="normal">One person</text><text x="560" y="100" font-size="13.5" fill="#5B6672" font-weight="bold" text-anchor="middle" font-style="normal">A group</text><text x="30" y="153" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Formal (Si)</text><rect x="150" y="115" width="200" height="62" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4" rx="10"/><text x="250" y="153" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-style="normal">Grüezi</text><rect x="420" y="115" width="280" height="62" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4" rx="10"/><text x="560" y="153" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-style="normal">Grüezi mitenand</text><text x="30" y="233" font-size="14" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">Informal (du)</text><rect x="150" y="195" width="200" height="62" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4" rx="10"/><text x="250" y="233" font-size="16" fill="#2E8B57" font-weight="bold" text-anchor="middle" font-style="normal">Hoi · Sali</text><rect x="420" y="195" width="280" height="62" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4" rx="10"/><text x="560" y="233" font-size="16" fill="#2E8B57" font-weight="bold" text-anchor="middle" font-style="normal">Hoi zäme · Sali zäme</text><text x="30" y="300" font-size="13" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Goodbye: Uf Widerluege (formal) · Tschau, Tschüss, Ade (informal)</text><text x="30" y="326" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Offer of du: Wämmer Duzis mache?</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>