<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="390" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">A first introduction</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Formal Si with -ed; with du the verb ends in -sch.</text><rect x="30" y="86" width="460" height="48" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2" rx="14"/><text x="46" y="107" font-size="14.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Grüezi, ich heisse Anna.</text><text x="46" y="125" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Hello, my name is Anna.</text><rect x="330" y="144" width="460" height="48" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.2" rx="14"/><text x="346" y="165" font-size="14.5" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">Fröit mi. Ich bi de Marco.</text><text x="346" y="183" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Nice to meet you. I'm Marco.</text><rect x="30" y="202" width="460" height="48" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2" rx="14"/><text x="46" y="223" font-size="14.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Wo chömed Si här?</text><text x="46" y="241" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Where are you from? (formal)</text><rect x="330" y="260" width="460" height="48" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.2" rx="14"/><text x="346" y="281" font-size="14.5" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">Ich chume us Frankriich.</text><text x="346" y="299" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">I'm from France.</text><rect x="30" y="318" width="460" height="48" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2" rx="14"/><text x="46" y="339" font-size="14.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Und was schaffed Si?</text><text x="46" y="357" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">And what do you do for work?</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>