<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="380" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">From a quick check to a full repeat</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Use the lightest phrase that works.</text><rect x="30" y="300" width="400" height="42" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.2" rx="8"/><text x="44" y="327" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Wie bitte?</text><text x="442" y="327" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">missed one word</text><rect x="70" y="248" width="400" height="42" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.2" rx="8"/><text x="84" y="275" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Wie meinsch?</text><text x="482" y="275" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">words yes, meaning no</text><rect x="110" y="196" width="400" height="42" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.2" rx="8"/><text x="124" y="223" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Ich ha s nöd verstande.</text><text x="522" y="223" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">lost completely</text><rect x="150" y="144" width="400" height="42" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.2" rx="8"/><text x="164" y="171" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Chönd Si das bitte langsamer säge?</text><text x="562" y="171" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">too fast</text><rect x="190" y="92" width="400" height="42" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.2" rx="8"/><text x="204" y="119" font-size="14" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Chasch mer s ufschriibe?</text><text x="602" y="119" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">names, numbers, addresses</text><text x="30" y="368" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">light</text><line x1="70" y1="364" x2="140" y2="364" stroke="#5B6672" stroke-width="1.5" marker-end="url(#ar)"/><text x="150" y="368" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">strong</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>