<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="360" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Five key verbs</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">All plural forms share one shape; formal Si uses it too.</text><text x="30" y="100" font-size="13" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal"></text><text x="210" y="100" font-size="13" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal">ich</text><text x="360" y="100" font-size="13" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal">du</text><text x="510" y="100" font-size="13" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal">er / si / es</text><text x="650" y="100" font-size="13" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal">mir / ihr / si</text><rect x="30" y="112" width="760" height="34" fill="#F7F4EE" stroke="none" stroke-width="1" rx="4"/><text x="40" y="135" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">sii (sein)</text><text x="210" y="135" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">bi</text><text x="360" y="135" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">bisch</text><text x="510" y="135" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">isch</text><text x="650" y="135" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">sind</text><rect x="30" y="154" width="760" height="34" fill="#FFFFFF" stroke="none" stroke-width="1" rx="4"/><text x="40" y="177" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">haa (haben)</text><text x="210" y="177" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">ha (han)</text><text x="360" y="177" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">häsch</text><text x="510" y="177" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">hät</text><text x="650" y="177" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">händ</text><rect x="30" y="196" width="760" height="34" fill="#F7F4EE" stroke="none" stroke-width="1" rx="4"/><text x="40" y="219" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">gaa (gehen)</text><text x="210" y="219" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">gaa</text><text x="360" y="219" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">gaasch</text><text x="510" y="219" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">gaat</text><text x="650" y="219" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">gönd</text><rect x="30" y="238" width="760" height="34" fill="#FFFFFF" stroke="none" stroke-width="1" rx="4"/><text x="40" y="261" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">cho (kommen)</text><text x="210" y="261" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">chume</text><text x="360" y="261" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">chunsch</text><text x="510" y="261" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">chunt</text><text x="650" y="261" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">chömed</text><rect x="30" y="280" width="760" height="34" fill="#F7F4EE" stroke="none" stroke-width="1" rx="4"/><text x="40" y="303" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">tue (tun)</text><text x="210" y="303" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">tue</text><text x="360" y="303" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">tuesch</text><text x="510" y="303" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">tuet</text><text x="650" y="303" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">tüend</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>