<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="320" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Four modal verbs</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Plus the polite 'I'd like': Ich hett gern …</text><text x="30" y="100" font-size="13" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal"></text><text x="210" y="100" font-size="13" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal">ich</text><text x="360" y="100" font-size="13" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal">du</text><text x="510" y="100" font-size="13" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal">er / si / es</text><text x="650" y="100" font-size="13" fill="#5B6672" font-weight="bold" text-anchor="start" font-style="normal">mir / ihr / si</text><rect x="30" y="112" width="760" height="34" fill="#F7F4EE" stroke="none" stroke-width="1" rx="4"/><text x="40" y="135" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">welle (wollen)</text><text x="210" y="135" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">wott</text><text x="360" y="135" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">wottsch</text><text x="510" y="135" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">wott</text><text x="650" y="135" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">wänd</text><rect x="30" y="154" width="760" height="34" fill="#FFFFFF" stroke="none" stroke-width="1" rx="4"/><text x="40" y="177" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">chöne (können)</text><text x="210" y="177" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">cha</text><text x="360" y="177" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">chasch</text><text x="510" y="177" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">cha</text><text x="650" y="177" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">chönd</text><rect x="30" y="196" width="760" height="34" fill="#F7F4EE" stroke="none" stroke-width="1" rx="4"/><text x="40" y="219" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">müese (müssen)</text><text x="210" y="219" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">mues</text><text x="360" y="219" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">muesch</text><text x="510" y="219" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">mues</text><text x="650" y="219" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">müend</text><rect x="30" y="238" width="760" height="34" fill="#FFFFFF" stroke="none" stroke-width="1" rx="4"/><text x="40" y="261" font-size="13.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">dörfe (dürfen)</text><text x="210" y="261" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">darf</text><text x="360" y="261" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">darfsch</text><text x="510" y="261" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">darf</text><text x="650" y="261" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">dörfed</text><text x="30" y="304" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">With go: Ich mues go schaffe (I have to go to work).</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>