<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="330" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">One past tense</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">High German simple past and perfect both become the Zurich perfect.</text><rect x="30" y="90" width="380" height="34" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="6"/><text x="46" y="113" font-size="13.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">ich war · ich bin gewesen</text><line x1="418" y1="107" x2="470" y2="107" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><rect x="478" y="90" width="312" height="34" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.2" rx="6"/><text x="494" y="113" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">ich bi gsii</text><rect x="30" y="134" width="380" height="34" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="6"/><text x="46" y="157" font-size="13.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">ich hatte · ich habe gehabt</text><line x1="418" y1="151" x2="470" y2="151" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><rect x="478" y="134" width="312" height="34" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.2" rx="6"/><text x="494" y="157" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">ich ha gha</text><rect x="30" y="178" width="380" height="34" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="6"/><text x="46" y="201" font-size="13.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">ich ging · ich bin gegangen</text><line x1="418" y1="195" x2="470" y2="195" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><rect x="478" y="178" width="312" height="34" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.2" rx="6"/><text x="494" y="201" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">ich bi gange</text><rect x="30" y="222" width="380" height="34" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="6"/><text x="46" y="245" font-size="13.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">ich kam · ich bin gekommen</text><line x1="418" y1="239" x2="470" y2="239" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><rect x="478" y="222" width="312" height="34" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.2" rx="6"/><text x="494" y="245" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">ich bi cho</text><rect x="30" y="266" width="380" height="34" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="6"/><text x="46" y="289" font-size="13.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">ich kaufte · ich habe gekauft</text><line x1="418" y1="283" x2="470" y2="283" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><rect x="478" y="266" width="312" height="34" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.2" rx="6"/><text x="494" y="289" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">ich ha kauft</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>