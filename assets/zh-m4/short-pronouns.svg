<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="330" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Pronouns that fuse with verbs</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Unstressed pronouns shrink and join the verb.</text><rect x="30" y="90" width="200" height="34" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="6"/><text x="130" y="113" font-size="14" fill="#5B6672" font-weight="normal" text-anchor="middle" font-style="normal">händ mir</text><line x1="238" y1="107" x2="290" y2="107" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><rect x="298" y="90" width="200" height="34" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2" rx="6"/><text x="398" y="113" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-style="normal">hämmer</text><rect x="30" y="134" width="200" height="34" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="6"/><text x="130" y="157" font-size="14" fill="#5B6672" font-weight="normal" text-anchor="middle" font-style="normal">gönd mir</text><line x1="238" y1="151" x2="290" y2="151" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><rect x="298" y="134" width="200" height="34" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2" rx="6"/><text x="398" y="157" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-style="normal">gömmer</text><rect x="30" y="178" width="200" height="34" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="6"/><text x="130" y="201" font-size="14" fill="#5B6672" font-weight="normal" te