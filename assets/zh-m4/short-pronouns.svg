ormal">ihn → en</text><text x="530" y="204" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">uns → eus</text><text x="530" y="226" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">euch → eu</text><text x="530" y="248" font-size="13" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">ihnen → ine</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>