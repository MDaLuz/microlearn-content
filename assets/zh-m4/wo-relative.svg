<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="300" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">wo for every relative clause</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">der, die, das, welche → wo. Linking n before a vowel: wo-n-ich.</text><rect x="30" y="92" width="760" height="46" fill="#E4EAF2" stroke="#E3E8EE" stroke-width="1" rx="8"/><text x="46" y="121" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">de Maa, wo dete staat</text><text x="450" y="121" font-size="13" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">der Mann, der dort steht</text><rect x="30" y="148" width="760" height="46" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="8"/><text x="46" y="177" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">d Frau, wo mer hälft</text><text x="450" y="177" font-size="13" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">die Frau, die mir hilft</text><rect x="30" y="204" width="760" height="46" fill="#E4EAF2" stroke="#E3E8EE" stroke-width="1" rx="8"/><text x="46" y="233" font-size="16" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">s Buech, wo-n-ich gläse ha</text><text x="450" y="233" font-size="13" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">das Buch, das ich gelesen habe</text><text x="30" y="284" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Verb last after wil, dass, wänn, öb: …, wil ich chrank bi.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>