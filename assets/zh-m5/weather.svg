ght="bold" text-anchor="start" font-style="normal">Es hät Näbel.</text><text x="44.0" y="201" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">it's foggy</text><rect x="288.0" y="156" width="244.0" height="58" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="10"/><text x="302.0" y="181" font-size="15.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Mir händ Föhn.</text><text x="302.0" y="201" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">warm Alpine wind</text><rect x="546.0" y="156" width="244.0" height="58" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="10"/><text x="560.0" y="181" font-size="15.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Morn sölls rägne.</text><text x="560.0" y="201" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">rain expected tomorrow</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>