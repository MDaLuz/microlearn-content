<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="300" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">From Chrippe to Schuel</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">The Zurich words parents hear every day.</text><line x1="60" y1="170" x2="760" y2="170" stroke="#1B2430" stroke-width="2"/><circle cx="60.0" cy="170" r="9" fill="#2F7FB3"/><text x="60.0" y="140" font-size="13.5" fill="#2F7FB3" font-weight="bold" text-anchor="middle" font-style="normal">Chrippe</text><text x="60.0" y="118" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="middle" font-style="normal">day care</text><text x="60.0" y="200" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">from babies</text><circle cx="293.33333333333337" cy="170" r="9" fill="#2E8B57"/><text x="293.33333333333337" y="140" font-size="13.5" fill="#2E8B57" font-weight="bold" text-anchor="middle" font-style="normal">Chindsgi</text><text x="293.33333333333337" y="118" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="middle" font-style="normal">kindergarten</text><text x="293.33333333333337" y="200" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">about age 4, two years</text><circle cx="526.6666666666667" cy="170" r="9" fill="#B7791F"/><text x="526.6666666666667" y="140" font-size="13.5" fill="#B7791F" font-weight="bold" text-anchor="middle" font-style="normal">Schuel</text><text x="526.6666666666667" y="118" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="middle" font-style="normal">school</text><text x="526.6666666666667" y="200" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">Ufzgi = homework</text><circle cx="760.0" cy="170" r="9" fill="#C2185B"/><text x="760.0" y="140" font-size="13.5" fill="#C2185B" font-weight="bold" text-anchor="middle" font-style="normal">Znüni</text><text x="760.0" y="118" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="middle" font-style="normal">every day</text><text x="760.0" y="200" font-size="12" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">morning snack</text><text x="30" y="280" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Lehrerin / Lehrer = teacher · Pause = break · Elterenabig = parents' evening</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>