<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="330" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">At the playground</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Most parents say du straight away.</text><rect x="30" y="86" width="460" height="48" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2" rx="14"/><text x="46" y="107" font-size="14.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Weles Chind isch dis?</text><text x="46" y="125" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Which child is yours?</text><rect x="330" y="144" width="460" height="48" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.2" rx="14"/><text x="346" y="165" font-size="14.5" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">Mini Tochter heisst Mia. Und dis?</text><text x="346" y="183" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">My daughter is called Mia. And yours?</text><rect x="30" y="202" width="460" height="48" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.2" rx="14"/><text x="46" y="223" font-size="14.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">De Noah, dete. Wänd mer emal abmache?</text><text x="46" y="241" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Noah, over there. Shall we arrange a playdate?</text><rect x="330" y="260" width="460" height="48" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.2" rx="14"/><text x="346" y="281" font-size="14.5" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">Gärn! Chunt er zu eus cho spile?</text><text x="346" y="299" font-size="12" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Sure! Is he coming to play at ours?</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>