<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="250" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Traditional rhymes and lines</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Old folk material: rhythm, -li and initial stress.</text><rect x="30.0" y="86" width="373.0" height="58" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="10"/><text x="44.0" y="111" font-size="15.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Rite, rite Rössli</text><text x="44.0" y="131" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">knee-bouncing rhyme</text><rect x="417.0" y="86" width="373.0" height="58" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="10"/><text x="431.0" y="111" font-size="15.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Schlaf, Chindli, schlaf</text><text x="431.0" y="131" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">the old lullaby</text><rect x="30.0" y="156" width="373.0" height="58" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="10"/><text x="44.0" y="181" font-size="15.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Es isch emal …</text><text x="44.0" y="201" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">once upon a time …</text><rect x="417.0" y="156" width="373.0" height="58" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="10"/><text x="431.0" y="181" font-size="15.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Nomal, nomal!</text><text x="431.0" y="201" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">again, again!</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>