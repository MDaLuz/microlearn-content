-weight="bold" text-anchor="start" font-style="normal">sträng</text><text x="44.0" y="201" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">strenuous</text><rect x="288.0" y="156" width="244.0" height="58" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="10"/><text x="302.0" y="181" font-size="15.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Wie lauft s?</text><text x="302.0" y="201" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">how's it going?</text><rect x="546.0" y="156" width="244.0" height="58" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="10"/><text x="560.0" y="181" font-size="15.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Ich ha vil z tue.</text><text x="560.0" y="201" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">I'm busy</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>