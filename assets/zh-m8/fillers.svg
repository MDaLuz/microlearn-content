<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="330" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Fillers and tags</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Recognise them everywhere; use them sparingly.</text><rect x="30" y="86" width="370" height="106" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.4" rx="12"/><text x="46" y="116" font-size="15" fill="#2F7FB3" font-weight="bold" text-anchor="start" font-style="normal">oder?</text><text x="46" y="148" font-size="13.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">right? (end): Das isch guet, oder?</text><rect x="420" y="86" width="370" height="106" fill="#FBE4EE" stroke="#C2185B" stroke-width="1.4" rx="12"/><text x="436" y="116" font-size="15" fill="#C2185B" font-weight="bold" text-anchor="start" font-style="normal">gäll</text><text x="436" y="148" font-size="13.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">right? (personal): Gäll, du chunsch?</text><rect x="30" y="206" width="370" height="106" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4" rx="12"/><text x="46" y="236" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">ebe</text><text x="46" y="268" font-size="13.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">exactly, that's the thing: Ebe!</text><rect x="420" y="206" width="370" height="106" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4" rx="12"/><text x="436" y="236" font-size="15" fill="#B7791F" font-weight="bold" text-anchor="start" font-style="normal">halt</text><text x="436" y="268" font-size="13.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">just, simply: Es isch halt eso.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>