<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="360" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">A listening cycle</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Practice: four steps, repeated in every conversation.</text><rect x="310" y="90" width="200" height="64" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4" rx="12"/><text x="410" y="118" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-style="normal">1 Predict</text><text x="410" y="138" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">from context</text><rect x="560" y="180" width="200" height="64" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4" rx="12"/><text x="660" y="208" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-style="normal">2 Catch</text><text x="660" y="228" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">stressed words</text><rect x="310" y="270" width="200" height="64" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4" rx="12"/><text x="410" y="298" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-style="normal">3 Reverse</text><text x="410" y="318" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">Ziit → Zeit</text><rect x="60" y="180" width="200" height="64" fill="#E4EAF2" stroke="#1F3A5F" stroke-width="1.4" rx="12"/><text x="160" y="208" font-size="15" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-style="normal">4 Check</text><text x="160" y="228" font-size="12.5" fill="#1B2430" font-weight="normal" text-anchor="middle" font-style="normal">Du meinsch also …</text><line x1="512" y1="122" x2="600" y2="176" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><line x1="600" y1="246" x2="512" y2="296" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><line x1="308" y1="300" x2="210" y2="246" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><line x1="160" y1="178" x2="306" y2="124" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>