<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="320" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Swearing by strength</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">For recognition only.</text><rect x="30.0" y="90" width="245.33333333333334" height="160" fill="#DDF2E5" stroke="#2E8B57" stroke-width="1.4" rx="10"/><text x="44.0" y="116" font-size="14.5" fill="#2E8B57" font-weight="bold" text-anchor="start" font-style="normal">Mild</text><text x="44.0" y="148" font-size="13.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Gopf!</text><text x="44.0" y="174" font-size="13.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Gopfriedstutz!</text><text x="44.0" y="200" font-size="13.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">So en Seich!</text><rect x="287.33333333333337" y="90" width="245.33333333333334" height="160" fill="#D6E9F5" stroke="#2F7FB3" stroke-width="1.4" rx="10"/><text x="301.33333333333337" y="116" font-size="14.5" fill="#2F7FB3" font-weight="bold" text-anchor="start" font-style="normal">Insult</text><text x="301.33333333333337" y="148" font-size="13.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Tubel (idiot)</text><rect x="544.6666666666667" y="90" width="245.33333333333334" height="160" fill="#FFF1D6" stroke="#B7791F" stroke-width="1.4" rx="10"/><text x="558.6666666666667" y="116" font-size="14.5" fill="#B7791F" font-weight="bold" text-anchor="start" font-style="normal">Strong</text><text x="558.6666666666667" y="148" font-size="13.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">Gopferdammi</text><text x="558.6666666666667" y="174" font-size="13.5" fill="#1B2430" font-weight="normal" text-anchor="start" font-style="normal">don't use</text><line x1="30" y1="270" x2="790" y2="270" stroke="#5B6672" stroke-width="2" marker-end="url(#ar)"/><text x="30" y="304" font-size="12.5" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Most Swiss swear words are religious in origin; the mild ones are euphemisms.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>