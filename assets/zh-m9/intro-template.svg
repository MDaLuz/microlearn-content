<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="820" height="460" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker></defs><text x="30" y="38" font-size="22" fill="#1B2430" font-weight="bold" text-anchor="start" font-style="normal">Your introduction template</text><text x="30" y="62" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">Fill in your details and say it daily.</text><rect x="30.0" y="86" width="760.0" height="58" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="10"/><text x="44.0" y="111" font-size="15.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Ich heisse … und chume us …</text><text x="44.0" y="131" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">name and origin</text><rect x="30.0" y="156" width="760.0" height="58" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="10"/><text x="44.0" y="181" font-size="15.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Ich wohne sit … Jahr im Kanton Züri.</text><text x="44.0" y="201" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">where and since when</text><rect x="30.0" y="226" width="760.0" height="58" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="10"/><text x="44.0" y="251" font-size="15.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Ich schaffe …</text><text x="44.0" y="271" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">work</text><rect x="30.0" y="296" width="760.0" height="58" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="10"/><text x="44.0" y="321" font-size="15.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Mir händ … Chind.</text><text x="44.0" y="341" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">family</text><rect x="30.0" y="366" width="760.0" height="58" fill="#F7F4EE" stroke="#E3E8EE" stroke-width="1" rx="10"/><text x="44.0" y="391" font-size="15.5" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Ich lerne Schwiizertüütsch, wil …</text><text x="44.0" y="411" font-size="12.5" fill="#5B6672" font-weight="normal" text-anchor="start" font-style="normal">why you're learning</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>